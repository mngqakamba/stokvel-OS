<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stokvel Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stokvel Manager">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#eef7f0; --panel:#ffffff; --panel-2:#f4faf5; --stripe:#f2faf4; --line:#e3eee6; --text:#132a1d; --muted:#5f7669;
    --accent:#1b5e3f; --accent-dark:#124631; --accent-light:#e6f4ea;
    --green:#1b8f57; --red:#c0392b; --orange:#c8791a; --gold:#a8790b;
    --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(18,36,25,.05), 0 6px 20px rgba(18,36,25,.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0d1712; --panel:#141f19; --panel-2:#192720; --stripe:#17231d; --line:#243830; --text:#e7f3ea; --muted:#8fa696;
    --accent:#3fbf82; --accent-dark:#2e9a67; --accent-light:#1b3327;
    --green:#4fd08c; --red:#ff6b5c; --orange:#f0a94e; --gold:#e0b84a;
  }
  *{box-sizing:border-box}
  body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
  button{transition:background .15s ease, filter .15s ease}
  a{color:inherit}
  .hidden{display:none !important}

  /* ---------- Header ---------- */
  .topbar{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:16px 28px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-badge{height:64px;width:auto;flex-shrink:0;display:flex;align-items:center;background:transparent;padding:0;box-shadow:none;border-radius:0}
  .brand-badge img{height:100%;width:auto;max-width:150px;object-fit:contain;display:block}
  .brand-text h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em;font-style:italic;color:var(--text)}
  .brand-text p{margin:1px 0 0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .topbar-spacer{flex:1}
  .searchbox{position:relative;min-width:240px}
  .searchbox input{width:100%;padding:10px 14px 10px 36px;border-radius:10px;border:1px solid var(--line);
    background:var(--accent-light);color:var(--text)}
  .searchbox input::placeholder{color:var(--muted)}
  .searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
  .icon-btn:hover{background:var(--accent-light)}

  /* ---------- Nav card ---------- */
  .navcard{width:calc(100% - 40px);max-width:1360px;margin:0 auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);position:relative}
  .navcard-top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 8px}
  .navcard-top .label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
  select.yearsel{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  #app > .navcard{position:sticky;top:6px;z-index:30}
  .navtabs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto}
  .navtab{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:none;
    background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .navtab:hover{background:var(--accent-light);color:var(--text)}
  .navtab.active{background:var(--accent);color:#fff}
  .navtab svg{opacity:.9}
  .menubtn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:700;font-size:13px;cursor:pointer}
  .menubtn:hover,.menubtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .menupanel{position:absolute;right:16px;top:54px;z-index:40;min-width:250px;max-width:calc(100vw - 52px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px}
  .menupanel[hidden]{display:none}
  .menugroup{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px}
  .menuitem{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;border:none;background:transparent;color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left}
  .menuitem:hover{background:var(--accent-light)}
  .menuitem.active{background:var(--accent);color:#fff}

  /* ---------- Ticker ---------- */
  .ticker{width:calc(100% - 40px);max-width:1360px;margin:14px auto;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:11px 18px;overflow-x:auto;white-space:nowrap;font-size:12.5px;color:var(--muted)}
  .ticker b{color:var(--text)}
  .ticker .r{color:var(--red);font-weight:700}
  .ticker .g{color:var(--green);font-weight:700}
  .ticker .sep{margin:0 12px;opacity:.5}

  /* ---------- Main ---------- */
  main{padding:6px 20px 60px;max-width:1400px;margin:0 auto}
  .card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px}
  .card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  .card .sub{margin:0 0 16px;color:var(--muted);font-size:12.5px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text)}
  label .req{color:var(--red)}
  label .hint{display:block;font-weight:400;color:var(--muted);margin-top:2px}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  textarea{resize:vertical;min-height:80px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;border:none;
    background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn:hover{background:var(--accent-dark)}
  .btn.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
  .btn.secondary:hover{background:var(--accent-light)}
  .btn.danger{background:var(--red);color:#fff}
  .btn.danger:hover{filter:brightness(.9)}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;white-space:nowrap;border:none}
  tbody tr:nth-child(even){background:var(--stripe)}
  tbody tr:hover{background:var(--accent-light)}
  .tablewrap{overflow-x:auto;border-radius:10px}
  .topscroll{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:4px}
  /* Wide sheets: keep # and Member visible while scrolling sideways */
  table.freeze th:nth-child(1), table.freeze td:nth-child(1){position:sticky;left:0;z-index:2;min-width:44px;width:44px;background:var(--panel)}
  table.freeze th:nth-child(2), table.freeze td:nth-child(2){position:sticky;left:44px;z-index:2;min-width:170px;background:var(--panel);box-shadow:2px 0 0 var(--line)}
  table.freeze tbody tr:nth-child(even) td:nth-child(1), table.freeze tbody tr:nth-child(even) td:nth-child(2){background:var(--stripe)}
  table.freeze tr.tot-row td:nth-child(1), table.freeze tr.tot-row td:nth-child(2){background:var(--panel)}

  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tot-row td{font-weight:800;background:var(--panel-2) !important;border-top:2px solid var(--line)}

  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
  .pill.green{background:#e3f3e7;color:var(--accent-dark)}
  .pill.red{background:#fbe6e3;color:var(--red)}
  .pill.orange{background:#fbeed9;color:var(--orange)}
  .pill.gray{background:var(--panel-2);color:var(--muted)}
  [data-theme="dark"] .pill.green{background:#183527}
  [data-theme="dark"] .pill.red{background:#3a1e1a}
  [data-theme="dark"] .pill.orange{background:#3a2c14}

  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty svg{opacity:.4;margin-bottom:10px}

  #toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:999}
  .toast{background:var(--accent-dark);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);
    font-size:13.5px;font-weight:600;animation:slidein .2s ease-out}
  .toast.err{background:var(--red)}
  @keyframes slidein{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,20,14,.5);display:flex;align-items:center;
    justify-content:center;z-index:998;padding:20px}
  .modal{background:var(--panel);border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 10px}
  .modal p{color:var(--muted);font-size:13.5px;line-height:1.5}
  .modal .btnrow{margin-top:18px;justify-content:flex-end}

  .statusdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
  .statusdot.on{background:var(--green)}
  .syncbar{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:8px 22px}

  .kpi{background:var(--panel-2);border-radius:12px;padding:16px}
  .kpi .v{font-size:22px;font-weight:800}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}

  @media print{
    .topbar,.navcard,.ticker,.syncbar,.no-print{display:none !important}
    body{background:#fff}
    .card{box-shadow:none;border:1px solid #e0e0e0;padding:8px}
    /* Wide tables (Main Sheet, Yearly Contributions) were getting columns clipped
       off the right edge of the printed page — shrink everything down and let
       the table use the full page width instead of overflowing it. */
    .tablewrap{overflow:visible !important}
    table.freeze th, table.freeze td{position:static !important;box-shadow:none !important}
    table{width:100% !important;table-layout:auto;font-size:7.5px !important}
    th,td{padding:3px 4px !important;white-space:normal !important;word-break:break-word;border:none !important}
    h2{font-size:12px}
    .sub{font-size:9px}
    /* Zebra striping instead of grid lines — needs this to survive most browsers'
       "don't print backgrounds" default. */
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
    tbody tr:nth-child(even){background:#eef6f0 !important}
    .tot-row td{background:#e3eee6 !important}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script id="seed-data" type="application/json">{"members": [], "datalog": [], "settings": {"clubName": "Your Club", "clubShort": "YC", "intRate": 0.2, "memberShare": 0.95, "clubShare": 0.05, "monthsElapsed": 10, "yearLabel": 2026, "b2sCount": 0, "activeCount": 0, "late": 50, "t1": 150, "t2": 200, "t3": 300, "intPenalty": 70, "noIntPool": 200, "attApology": 100, "attNoApol": 200, "attProxy": 200, "t1Cutoff": 1000, "t2Cutoff": 2000, "bankInterest": 0, "functionFundCost": 0, "applyPenaltyShare": "NO", "bankSignatories": [], "dueOnTimeDay": 4, "dueLateDay": 10, "noPenaltyMonth": "Dec"}, "attMeeting": {"date": "", "number": 1, "notes": ""}}</script>
<script src="config.js"></script>
<script>


const CLUB_LOGO_URI = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b5e3f'/%3E%3Ccircle cx='22' cy='26' r='7' fill='%23f4c542'/%3E%3Ccircle cx='42' cy='26' r='7' fill='%23f4c542'/%3E%3Cpath d='M10 50c0-9 6-14 12-14s12 5 12 14zM30 50c0-9 6-14 12-14s12 5 12 14z' fill='%23ffffff'/%3E%3C/svg%3E";
/* ==========================================================================
   STOKVEL MANAGER — WEB APP (multi-club)
   Rebuilt from the Excel workbook + VBA. See build notes in chat.

   SECURITY NOTE: this file ships with NO real member or transaction data.
   Everything loads live from Supabase, after a signed-in, admin-approved
   login — see supabase-schema.sql for the access rules.
   ========================================================================== */

const SEED = JSON.parse(document.getElementById('seed-data').textContent);
const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ["Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov"]; // rebuilt from the club's start month by syncMonths()
const ROLE_BASES = ['capture','viewer','auditor','member'];
const DELEGABLE_KEYS = ['members','settings','yearend','activity'];
const MONTH_ALIASES = {
  "dec":"Dec","december":"Dec","jan":"Jan","january":"Jan",
  "dec-jan":"Jan","decjan":"Jan","dec/jan":"Jan", // old combined slot: treated as January
  "feb":"Feb","february":"Feb","mar":"Mar","march":"Mar","apr":"Apr","april":"Apr",
  "may":"May","jun":"Jun","june":"Jun","jul":"Jul","july":"Jul","aug":"Aug","august":"Aug",
  "sep":"Sep","sept":"Sep","september":"Sep","oct":"Oct","october":"Oct","nov":"Nov","november":"Nov"
};
// Baked in so this file works with zero setup once it's hosted publicly. These two
// values are meant to be public (that's the Supabase model) — real security comes
// from login + the row-level security rules in supabase-schema.sql, not from hiding
// these.
// The project URL and public (anon) key are built in. config.js, if present, overrides them.
const DEFAULT_CLOUD = {
  url: (typeof window!=='undefined' && window.SAAS_CONFIG && window.SAAS_CONFIG.url) || "https://aokyzcocayefqudstdbw.supabase.co",
  key: (typeof window!=='undefined' && window.SAAS_CONFIG && window.SAAS_CONFIG.key) || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFva3l6Y29jYXllZnF1ZHN0ZGJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODkwOTcsImV4cCI6MjEwNzY2NTA5N30.pFG_3585xResdxBE9lwwEIkuwBzC3gDs9D5wWrTLgcc"
};

/* ---------------------------------------------------------------------
   BUSINESS DETAILS, LEGAL LINKS, SUPPORT  (values come from config.js)
   --------------------------------------------------------------------- */
const LEGAL_VERSION = '2026-10';
function bizVal(k){
  const b = (typeof window!=='undefined' && window.SAAS_CONFIG && window.SAAS_CONFIG.business) || {};
  const v = String(b[k]==null?'':b[k]).trim();
  return (v && !/^\[.*\]$/.test(v)) ? v : '';     // "[placeholder]" counts as not filled in
}
function supportLinkHtml(){
  const mail = bizVal('email'), wa = bizVal('whatsapp').replace(/\D/g,'');
  const club = (Auth && Auth.club && Auth.club.name) || '';
  const parts = [];
  if(mail) parts.push(`<a href="mailto:${escapeHtml(mail)}?subject=${encodeURIComponent('Support request' + (club?' - '+club:''))}">Help &amp; support</a>`);
  if(wa) parts.push(`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp us</a>`);
  return parts.join(' &middot; ');
}
const DEFAULT_BILLING = {
  currency: 'R', referencePrefix: 'STK', invoiceNote: '', payDays: 7,
  plans: [
    {id:'small',    name:'Small',    maxMembers:25,   monthly:99,  annual:990},
    {id:'standard', name:'Standard', maxMembers:60,   monthly:199, annual:1990},
    {id:'large',    name:'Large',    maxMembers:null, monthly:349, annual:3490},
  ],
  bank: {}
};
function billingCfg(){
  const b = (typeof window!=='undefined' && window.SAAS_CONFIG && window.SAAS_CONFIG.billing) || {};
  const plans = (Array.isArray(b.plans) && b.plans.length ? b.plans : DEFAULT_BILLING.plans).filter(x => x && x.id && x.name).map(x => ({
    id:String(x.id), name:String(x.name), maxMembers: (x.maxMembers==null||x.maxMembers==='') ? null : Math.max(1, Math.floor(Number(x.maxMembers))||1),
    monthly: Number(x.monthly)||0, annual: Number(x.annual)||0 }));
  const bank = {}; ['accountName','bank','accountNumber','branchCode','accountType'].forEach(k => { const v = String((b.bank||{})[k]==null?'':(b.bank||{})[k]).trim(); if(v && !/^\[.*\]$/.test(v)) bank[k] = v; });
  return { currency: String(b.currency||DEFAULT_BILLING.currency), referencePrefix: String(b.referencePrefix||DEFAULT_BILLING.referencePrefix),
           invoiceNote: String(b.invoiceNote||''), payDays: Number(b.payDays)||DEFAULT_BILLING.payDays, plans, bank };
}
function money(n){ const c = billingCfg().currency; return c + Number(n||0).toLocaleString('en-ZA', {maximumFractionDigits:2}); }
function clubReference(club){ const c = club || Auth.club || {}; return billingCfg().referencePrefix + '-' + String(c.id||'').replace(/-/g,'').slice(0,6).toUpperCase(); }
function planById(id){ return billingCfg().plans.find(x => x.id === id) || null; }
function planLimitText(pl){ return pl.maxMembers ? 'up to ' + pl.maxMembers + ' members' : 'any number of members'; }
function bankDetailsHtml(){
  const bk = billingCfg().bank, rows = [['Account name','accountName'],['Bank','bank'],['Account number','accountNumber'],['Branch code','branchCode'],['Account type','accountType']].filter(r => bk[r[1]]);
  if(!rows.length) return '<p class="hint">Banking details have not been added yet. Please contact us to arrange payment.</p>';
  return '<table style="width:auto;border-collapse:collapse;font-size:14px">' + rows.map(r => `<tr><td style="padding:3px 16px 3px 0;color:var(--muted)">${r[0]}</td><td style="padding:3px 0;font-weight:600">${escapeHtml(bk[r[1]])}</td></tr>`).join('') + '</table>';
}
function openInvoice(club, planId, period){
  const pl = planById(planId); if(!pl){ toast('Choose a plan first.', true); return; }
  const amount = period === 'annual' ? pl.annual : pl.monthly;
  const cfg = billingCfg(), ref = clubReference(club), today = new Date(), due = new Date(Date.now() + cfg.payDays*864e5);
  const d = x => x.toLocaleDateString('en-ZA', {day:'2-digit', month:'long', year:'numeric'});
  const bk = cfg.bank, biz = k => bizVal(k);
  const no = ref + '-' + today.toISOString().slice(0,10).replace(/-/g,'');
  const w = window.open('', '_blank');
  if(!w){ toast('Your browser blocked the invoice window. Allow pop-ups for this site and try again.', true); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Invoice ${escapeHtml(no)}</title><style>
  body{font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:#1c2a22;max-width:720px;margin:30px auto;padding:0 20px}
  h1{margin:0 0 4px;font-size:26px}.m{color:#5b6b62;font-size:13.5px}table{width:100%;border-collapse:collapse;margin:18px 0}
  th,td{padding:9px 10px;border-bottom:1px solid #dfe6e1;text-align:left}th:last-child,td:last-child{text-align:right}
  .tot td{font-weight:700;font-size:17px;border-bottom:none}.box{background:#f4f7f5;border-radius:10px;padding:12px 16px;margin-top:10px}
  .row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}@media print{.np{display:none}}</style></head><body>
  <div class="row"><div><h1>Invoice</h1><div class="m">No. ${escapeHtml(no)}<br>Date: ${d(today)}<br>Due: ${d(due)}</div></div>
  <div style="text-align:right"><b>${escapeHtml(biz('name')||biz('tradingAs')||'')}</b><div class="m">${escapeHtml(biz('address')||'')}<br>${escapeHtml(biz('email')||'')} ${escapeHtml(biz('phone')||'')}</div></div></div>
  <div class="box"><b>Billed to</b><br>${escapeHtml(club.name||'')}<br><span class="m">${escapeHtml(club.contact_name||'')} ${escapeHtml(club.contact_email||'')}</span></div>
  <table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody>

function hexToHsl(hex){
  let h = String(hex||'').replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) h = '1b5e3f';
  const r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let hh=0, ss=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; ss = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    hh = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; hh*=60; }
  return {h:hh, s:ss*100, l:l*100};
}
function hsl(h,s,l){ return `hsl(${Math.round(h)},${Math.round(Math.max(0,Math.min(100,s)))}%,${Math.round(Math.max(0,Math.min(100,l)))}%)`; }
// Keeps the accent readable with white text (light mode) or on a dark panel (dark mode).
function brandPalette(primary){
  const {h,s,l} = hexToHsl(primary);
  const sat = Math.max(25, Math.min(s, 80));
  const rgbOf = (hh,ss,ll) => { hh/=360; ss/=100; ll/=100; const f=n=>{const k=(n+hh*12)%12,aa=ss*Math.min(ll,1-ll);return ll-aa*Math.max(-1,Math.min(k-3,9-k,1));}; return [f(0),f(8),f(4)]; };
  const lumOf = c => { const t=c.map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)); return 0.2126*t[0]+0.7152*t[1]+0.0722*t[2]; };
  const ratio = (c1,c2) => { const x=lumOf(c1), y=lumOf(c2); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
  let accL = Math.min(l, 36); while(accL>8 && ratio(rgbOf(h,sat,accL),[1,1,1]) < 4.8) accL -= 1;
  const darkBg = rgbOf(h,sat*0.28,11);
  let accD = Math.max(l, 50); while(accD<92 && ratio(rgbOf(h,sat*0.85,accD),darkBg) < 5) accD += 1;
  return {
    light:{ bg:hsl(h,sat*0.45,95), panel:'#ffffff', panel2:hsl(h,sat*0.45,97), stripe:hsl(h,sat*0.45,96), line:hsl(h,sat*0.3,90),
            text:hsl(h,35,12), muted:hsl(h,10,40), accent:hsl(h,sat,accL), accentDark:hsl(h,sat,Math.max(10,accL-8)), accentLight:hsl(h,sat*0.6,92) },
    dark:{  bg:hsl(h,sat*0.3,8), panel:hsl(h,sat*0.28,11), panel2:hsl(h,sat*0.28,14), stripe:hsl(h,sat*0.28,12.5), line:hsl(h,sat*0.25,20),
            text:hsl(h,25,92), muted:hsl(h,10,62), accent:hsl(h,sat*0.85,accD), accentDark:hsl(h,sat*0.85,Math.max(30,accD-12)), accentLight:hsl(h,sat*0.4,18) }
  };
}
function brandOf(b){ return Object.assign({}, DEFAULT_BRAND, b||{}); }
function brandCss(b){

  return `:root{${vars(P.light)}--font:${f};--radius:${c.r}px;--radius-sm:${c.rs}px}\n[data-theme="dark"]{${vars(P.dark)}}`;
}

// Shrinks an uploaded picture to a small PNG so it stays light inside the settings row.
function fileToLogoDataUri(file){
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('No file chosen.'));
    if(!/^image\//.test(file.type)) return reject(new Error('Please choose an image (PNG, JPG, SVG or WEBP).'));
    if(file.size > 3*1024*1024) return reject(new Error('That picture is too large. Use one under 3 MB.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Could not read that file.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That picture could not be opened.'));
      img.onload = () => {
        const maxW = 360, maxH = 240;
        const w0 = img.naturalWidth || img.width || maxW, h0 = img.naturalHeight || img.height || maxH;
        const k = Math.min(1, maxW/w0, maxH/h0);
        const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w0*k)); cv.height = Math.max(1, Math.round(h0*k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let out = cv.toDataURL('image/png');
        if(out.length > 200000) out = cv.toDataURL('image/webp', 0.85);
        if(out.length > 250000) return reject(new Error('That picture is too detailed. Try a simpler logo.'));
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------
   CLUB RULES — what each club switches on and how its rules behave.
   Stored in the club's settings (state.settings.rules). Anything not set
   falls back to the defaults below, which match the original club.
   --------------------------------------------------------------------- */
const DEFAULT_RULES = {
  features:{ b2s:true, funeral:true, attendance:true, loans:true, penalties:true, poolCharge:true, bankAudit:true },
  blockB2sLoans:true,           // members who pay no monthly contribution cannot take loans
  payoutPct:80,                 // % of a resigning member's balance that is paid out; the club keeps the rest
  labels:{ b2s:'Back 2 School', b2sShort:'B2S', funeral:'Funeral Fund' },
  startMonth:12,                // calendar month (1-12) the club's financial year begins in; 12 = December
  roles:[],                     // the club's own named roles (see rolesCardHtml)
};
function syncMonths(sm){
  // MONTHS is the club's financial year in order, starting from its start month. It is rebuilt in place
  // so every screen that reads it follows the club's calendar.
  const want = Array.from({length:12}, (_,i) => MON_SHORT[(sm-1+i)%12]);
  if(MONTHS.join() !== want.join()){ MONTHS.length = 0; want.forEach(m => MONTHS.push(m)); }
}
function startMonth(){ return rules().startMonth; }
function rules(){
  const r = (state.settings && state.settings.rules) || {};
  const sm = Math.round(Number(r.startMonth));
  const startM = (sm>=1 && sm<=12) ? sm : DEFAULT_RULES.startMonth;
  syncMonths(startM);
  return {
    startMonth: startM,
    roles: Array.isArray(r.roles) ? r.roles.filter(x => x && x.id && x.name && ROLE_BASES.includes(x.base)).map(x => ({id:String(x.id), name:String(x.name), base:x.base, perms:Array.isArray(x.perms)?x.perms.filter(k=>DELEGABLE_KEYS.includes(k)):[]})) : [],
    features: Object.assign({}, DEFAULT_RULES.features, r.features||{}),
    blockB2sLoans: r.blockB2sLoans === undefined ? DEFAULT_RULES.blockB2sLoans : !!r.blockB2sLoans,
    payoutPct: (isFinite(Number(r.payoutPct)) && Number(r.payoutPct) >= 0 && Number(r.payoutPct) <= 100 && r.payoutPct !== '' && r.payoutPct !== undefined && r.payoutPct !== null) ? Number(r.payoutPct) : DEFAULT_RULES.payoutPct,
    labels: Object.assign({}, DEFAULT_RULES.labels, r.labels||{}),
  };
}
function feat(name){ return rules().features[name] !== false; }
function payoutPct(){ return rules().payoutPct; }
function payoutFrac(){ return rules().payoutPct/100; }

const RULE_TEMPLATES = [
  { id:'classic', name:'Savings, loans, penalties and funds', blurb:'Everything switched on. How the original club runs.',
    rules:{ features:{b2s:true,funeral:true,attendance:true,loans:true,penalties:true,poolCharge:true,bankAudit:true}, blockB2sLoans:true, payoutPct:80 } },
  { id:'loans', name:'Savings with loans', blurb:'Contributions, loans, interest and penalties. No special funds or attendance.',
    rules:{ features:{b2s:false,funeral:false,attendance:false,loans:true,penalties:true,poolCharge:true,bankAudit:true}, blockB2sLoans:true, payoutPct:100 } },
  { id:'simple', name:'Simple savings', blurb:'Only monthly contributions and the year-end payout. No loans or penalties.',
    rules:{ features:{b2s:false,funeral:false,attendance:false,loans:false,penalties:false,poolCharge:false,bankAudit:true}, blockB2sLoans:true, payoutPct:100 } },
];

// Hides what a club has switched off and shows its own names for the funds.
// Runs after every screen is drawn, so the many tables and totals need no edits.
const RULE_HIDE_COLS = {
  b2s:['B2S'], funeral:['Funeral'],
  loans:['Loan','Loan Repaid','Loan Repayment','Loan Rep','Interest Accrued','Interest Paid','Int Paid','Total Owing','95% Alloc','Principal Outstanding','Loan Deducted'],
  penalties:['Penalties Paid','Penalty Owing','Penalties Owed','Pena','Penalties'],
  poolCharge:['Pool Charge','Pool Share'],
};
const RULE_HIDE_ROWS = {
  b2s:['Back 2 School fund','B2S accumulated','B2S-only members'],
  funeral:['Funeral fund'],
  loans:['Principal outstanding','Interest outstanding','Total loan book','Loans issued (out)','Loan repayments','Interest paid'],
  penalties:['Penalties paid','Penalties still owed','Members with penalties owed'],
  poolCharge:['Year-end pool charges','5% pool per active member'],
};
function applyRuleDom(){
  try{
    const root = document.getElementById('app'); if(!root || !root.querySelectorAll) return;
    const off = Object.keys(RULE_HIDE_COLS).filter(k => !feat(k));
    off.forEach(k => {
      root.querySelectorAll('table').forEach(tbl => {
        const ths = tbl.querySelectorAll('thead th, tr th'); if(!ths || !ths.length) return;
        const heads = Array.from(ths);
        heads.forEach((th, i) => {
          const t = String(th.textContent||'').replace(/\s+/g,' ').trim();
          if(!RULE_HIDE_COLS[k].includes(t)) return;
          const idx = Array.prototype.indexOf.call(th.parentElement.children, th);
          tbl.querySelectorAll('tr').forEach(tr => {
            const cells = tr.children; if(!cells || cells.length <= idx) return;
            if(Array.from(cells).some(c => c.colSpan > 1)) return;
            cells[idx].style.display = 'none';
          });
        });
      });
    });
    Object.keys(RULE_HIDE_ROWS).filter(k => !feat(k)).forEach(k => {
      root.querySelectorAll('tr').forEach(tr => {
        const first = tr.children && tr.children[0]; if(!first) return;
        if(RULE_HIDE_ROWS[k].includes(String(first.textContent||'').trim())) tr.style.display = 'none';
      });
      root.querySelectorAll('.kpi').forEach(el => {
        const l = el.querySelector('.l'); if(l && RULE_HIDE_ROWS[k].includes(String(l.textContent||'').trim())) el.style.display = 'none';
      });
    });
    const L = rules().labels, D = DEFAULT_RULES.labels;
    if(L.b2s !== D.b2s || L.b2sShort !== D.b2sShort || L.funeral !== D.funeral){
      const walker = document.createTreeWalker(root, 4 /* NodeFilter.SHOW_TEXT */);
      const todo = []; let n; while((n = walker.nextNode())) todo.push(n);
      todo.forEach(node => {
        let t = node.nodeValue; if(!t || !/B2S|Back 2 School|Funeral/.test(t)) return;
        if(labelDone.get(node) === t) return;   // already renamed; do not rename twice
        const o = t;
        t = t.replace(/Back 2 School \(B2S\)/g, L.b2s).replace(/Back 2 School fund/gi, L.b2s).replace(/Back 2 School/g, L.b2s).replace(/\bB2S\b/g, L.b2sShort).replace(/Funeral fund/gi, L.funeral).replace(/\bFuneral\b/g, L.funeral);
        if(t !== o){ node.nodeValue = t; labelDone.set(node, t); }
      });
    }
  }catch(e){ console.error('rule display pass failed', e); }
}
const labelDone = new WeakMap();
let ruleObs = null;
function startRuleObserver(){
  if(ruleObs || typeof MutationObserver === 'undefined') return;
  const root = document.getElementById('app'); if(!root) return;
  let busy = false;
  ruleObs = new MutationObserver(() => {
    if(busy) return; busy = true;
    setTimeout(() => { ruleObs.disconnect(); applyRuleDom(); ruleObs.observe(root, {childList:true, subtree:true}); busy = false; }, 0);
  });
  ruleObs.observe(root, {childList:true, subtree:true});
}

    const before = rules().roles;
    try{
      // Everyone who already holds a changed (or removed) role is brought into line first.
      for(const old of before){
        const nu = next.find(r => r.id === old.id);
        const same = nu && nu.name===old.name && nu.base===old.base && nu.perms.slice().sort().join()===old.perms.slice().sort().join();

// "the request failed" and "it loaded but didn't define what we expected".
async function ensureSupabaseLib(){
  if(typeof window.supabase !== 'undefined' && window.supabase.createClient) return true;
  for(const url of SUPABASE_LIB_CDNS){
    try{
      await loadScript(url);
      if(typeof window.supabase !== 'undefined' && window.supabase.createClient) return true;
    }catch(e){ /* try the next one */ }
  }
  return false;
}

// True when the person has just arrived from the "confirm your email" link in their inbox.
const CAME_FROM_EMAIL_LINK = (typeof location!=='undefined') && /[#&?]type=(signup|email|invite)\b|[?&]code=/.test(String(location.hash||'')+String(location.search||''));

const Auth = {
  client: null, session: null, profile: null, ready: false, initError: null,

  ensureClient(){
    if(!Store.isCloud()) { this.client = null; return null; }
    if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
      throw new Error('The Supabase library did not load (check your internet connection, then Retry).');
    }
    if(!this.client || this._url !== Store.cloud.url || this._key !== Store.cloud.key){
      this.client = window.supabase.createClient(Store.cloud.url, Store.cloud.key, {
        auth: { persistSession: true, autoRefreshToken: true, storageKey: 'mk_auth_session' }
      });
      this._url = Store.cloud.url; this._key = Store.cloud.key;
    }
    return this.client;
  },

  async init(){
    try{
      if(Store.isCloud()){
        const ok = await ensureSupabaseLib();
        if(!ok) throw new Error('Could not load the Supabase library from any CDN — check your internet connection, then Retry.');
      }
      const client = this.ensureClient();
      if(!client){ this.ready = true; return; }
      const { data } = await client.auth.getSession();
      this.session = data.session || null;
      if(this.session) await this.checkMfa();
      if(this.session) await this.loadProfile();
      if(this.session && CAME_FROM_EMAIL_LINK){ setTimeout(() => toast('Your email is confirmed. Welcome!'), 600); try{ history.replaceState(null,'',location.pathname); }catch(_){} }
      client.auth.onAuthStateChange((_event, session) => {
        this.session = session;
        this.loadProfile().then(() => { Store.trySyncFromCloud().finally(render); });
      });
    }catch(e){
      console.error('Auth init failed', e);
      this.initError = e.message || String(e);
    }
    this.ready = true;
  },

  mfaPending: false,
  memberships: [],      // every club this login belongs to (one row each, with the role there)
  clubsById: {},
  async checkMfa(){
    // Signed in with a password, but the account has two-step login on and this session has not passed it yet.
    try{
      const { data } = await this.ensureClient().auth.mfa.getAuthenticatorAssuranceLevel();
      this.mfaPending = !!(data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2');
    }catch(e){ this.mfaPending = false; }
  },
  async loadProfile(){
    if(!this.session){ this.profile = null; return; }
    try{
      const rows = await Store.cloudFetch('mk_profiles?select=*&id=eq.' + this.session.user.id);
      this.profile = (rows && rows[0]) || {role:'pending', email:this.session.user.email};
      this.club = null;
      // Every club this login belongs to (the table only exists once the multi-club upgrade has been run).
      this.memberships = []; this.clubsById = {};
      try{
        this.memberships = (await Store.cloudFetch('mk_memberships?select=*&user_id=eq.' + this.session.user.id + '&order=created_at')) || [];
        const ids = this.memberships.map(m => m.club_id);
        if(ids.length){
          ((await Store.cloudFetch('mk_clubs?select=*&id=in.(' + ids.join(',') + ')')) || []).forEach(c => { this.clubsById[c.id] = c; });
        }
      }catch(_){ this.memberships = []; }
      if(this.profile.club_id){
        if(this.clubsById[this.profile.club_id]) this.club = this.clubsById[this.profile.club_id];
        else { const cl = await Store.cloudFetch('mk_clubs?select=*&id=eq.' + this.profile.club_id); this.club = (cl && cl[0]) || null; }
      }
      try{ this.owner = (await Store.cloudFetch('rpc/mk_is_platform_admin', {method:'POST', body:'{}'})) === true; }catch(_){ this.owner = false; }
    }catch(e){
      console.error('Could not load profile', e);
      this.profile = {role:'pending', email:this.session.user.email}; this.club = null; this.owner = false;
    }
  },

  async signIn(email, password){
    const client = this.ensureClient();
    if(!client) throw new Error('Cloud database is not configured.');
    const { data, error } = await client.auth.signInWithPassword({email, password});
    if(error) throw error;
    this.session = data.session;
    await this.checkMfa();
    await this.loadProfile();
  },
  async signUp(email, password){
    const client = this.ensureClient();
    if(!client) throw new Error('Cloud database is not configured.');
    const { data, error } = await client.auth.signUp({email, password});
    if(error) throw error;
    if(data.session){ this.session = data.session; await this.loadProfile(); return true; }
    return false;   // email confirmation needed first
  },
  async signOut(){
    const client = this.ensureClient();
    if(client) await client.auth.signOut();
    this.session = null; this.profile = null; this.club = null; this.owner = false; this.mfaPending = false; this.memberships = []; this.clubsById = {};
    state.profilesCache = []; state.settings = Object.assign({}, SEED.settings);
    try{ localStorage.removeItem('mk_snapshot'); }catch(e){}
    state.execList = null;
    state.members=[]; state.datalog=[]; state.attMeetings=[]; state.resignations=[]; state.archives=[];
  },

  accessToken(){ return this.session ? this.session.access_token : null; },
  role(){ return this.profile ? this.profile.role : null; },
  isSignedIn(){ return !!this.session; },
  isOwner(){ return this.isSignedIn() && !!this.owner; },
  clubStatus(){ return this.club ? this.club.status : null; },
  isApproved(){ return this.isSignedIn() && !!this.profile && !!this.profile.club_id && this.clubStatus()==='active' && !!this.profile.role && this.profile.role !== 'pending'; },
  isAdmin(){ return this.role() === 'admin'; },
  isCapture(){ return this.role() === 'capture'; },
  isMember(){ return this.role() === 'member'; },
  isAuditor(){ return this.role() === 'auditor'; },
  isViewer(){ return this.role() === 'viewer'; },
  canManage(){ return this.isAdmin(); },                       // members, bulk, resign, new year, settings, users
  canCapture(){ return this.isAdmin() || this.isCapture(); },  // data entry, attendance, add loan
  canAudit(){ return this.isAdmin() || this.isAuditor(); },    // the audit tool
};

/* ---------------------------------------------------------------------
   STORAGE — localStorage as an offline cache; Supabase REST as the source
   of truth once signed in. Every cloud request carries the signed-in
   user's token (falling back to the anon key pre-login) so the database's
   row-level security rules can identify who's asking.
   --------------------------------------------------------------------- */
const Store = {
  cloud: { url: '', key: '' },

  loadCloudConfig(){
    try{
      const raw = localStorage.getItem('mk_cloud_config');
      const c = raw ? JSON.parse(raw) : {};
      this.cloud.url = c.url || DEFAULT_CLOUD.url;
      this.cloud.key = c.key || DEFAULT_CLOUD.key;
    }catch(e){
      this.cloud.url = DEFAULT_CLOUD.url; this.cloud.key = DEFAULT_CLOUD.key;
    }
  },
  saveCloudConfig(url, key){
    this.cloud.url = url.trim().replace(/\/+$/,'');
    this.cloud.key = key.trim();
    localStorage.setItem('mk_cloud_config', JSON.stringify({url:this.cloud.url, key:this.cloud.key}));
  },
  isCloud(){ return !!(this.cloud.url && this.cloud.key); },

  async cloudFetch(path, opts={}){
    const token = (typeof Auth !== 'undefined' && Auth.accessToken()) || this.cloud.key;
    const headers = Object.assign({
      'apikey': this.cloud.key,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    }, opts.headers||{});
    const res = await fetch(this.cloud.url + '/rest/v1/' + path, Object.assign({}, opts, {headers}));
    if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('Supabase error ' + res.status + ': ' + t); }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  },

  saveLocal(){
    const snap = {
      members: state.members, datalog: state.datalog, settings: state.settings,
      attMeetings: state.attMeetings, resignations: state.resignations, archives: state.archives,
    };
    localStorage.setItem('mk_snapshot', JSON.stringify(snap));
  },
  loadLocal(){
    const raw = localStorage.getItem('mk_snapshot');
    if(!raw) return false;
    try{
      const snap = JSON.parse(raw);
      state.members = snap.members || [];
      state.datalog = snap.datalog || [];
      state.settings = snap.settings || {};
      state.attMeetings = snap.attMeetings || [];
      state.resignations = snap.resignations || [];
      state.archives = snap.archives || [];
      migrateLegacyMonths();
      return true;
    }catch(e){ return false; }
  },

  // Only used when there is no cloud configured at all (fully offline / local testing).
  seedIfEmpty(){
    if(state.members.length===0 && state.datalog.length===0){
      state.members = SEED.members.slice();
      state.datalog = SEED.datalog.slice();
      state.settings = Object.assign({}, SEED.settings);
      state.attMeetings = SEED.attMeeting && SEED.attMeeting.date
        ? [{id: uid('am'), date: SEED.attMeeting.date, number: SEED.attMeeting.number, notes: SEED.attMeeting.notes, records: []}]
        : [];
      state.resignations = []; state.archives = [];
    }
  },

  async init(){
    this.loadCloudConfig();
    this.loadLocal();
    if(!this.isCloud()){
      this.seedIfEmpty();
      this.saveLocal();
    }
    // Cloud sync (if any) happens after Auth.init() resolves who's signed in —
    // see boot() in app_part10.js, which calls Auth.init() then this.trySyncFromCloud().
  },

  async trySyncFromCloud(){
    if(!this.isCloud() || !Auth.isApproved() || Auth.mfaPending) return;
    try{
      const [members, datalog, settingsRows, attMeetings, resignations, archives, execRows] = await Promise.all([
        this.cloudFetch('mk_members?select=*'),
        this.cloudFetch('mk_datalog?select=*'),
        this.cloudFetch('mk_settings?select=*'),
        this.cloudFetch('mk_att_meetings?select=*').catch(()=>[]),
        this.cloudFetch('mk_resignations?select=*').catch(()=>[]),
        this.cloudFetch('mk_archives?select=*').catch(()=>[]),
        this.cloudFetch('mk_executives?select=*').catch(()=>null),
      ]);
      state.execList = Array.isArray(execRows) ? execRows.map(r => ({full:r.member_full, role:r.role_title})) : null;
      state.members = (members||[]).map(r => ({id:r.id, surname:r.surname, name:r.name, full:r.full_name, fixed:Number(r.fixed), resigned:!!r.resigned, resignedDate:r.resigned_date||null}));
      state.datalog = (datalog||[]).map(r => ({
        id:r.id, date:r.date, name:r.name, month:r.month, year:r.year,
        contr:Number(r.contr), loanRep:Number(r.loan_rep), intPay:Number(r.int_pay), pena:Number(r.pena),
        b2s:Number(r.b2s), funeral:Number(r.funeral), taken:Number(r.taken), powng:Number(r.powng),
        poolChg:Number(r.pool_chg)||0, source:r.source||'manual',
        note:r.note||'', createdBy:r.created_by||'', createdAt:r.created_at||''
      }));
      state.settings = (settingsRows && settingsRows.length) ? JSON.parse(settingsRows[0].data) : Object.assign({}, SEED.settings, {clubName: (Auth.club && Auth.club.name) || SEED.settings.clubName});
      state.attMeetings = (attMeetings||[]).map(r => ({id:r.id, date:r.date, number:r.number, notes:r.notes, records: JSON.parse(r.records||'[]')}));
      state.resignations = (resignations||[]).map(r => Object.assign({id:r.id}, JSON.parse(r.data)));
      state.archives = (archives||[]).map(r => ({id:r.id, year:r.year, closedAt:r.closed_at, datalog: JSON.parse(r.datalog)}));
      const mig = migrateLegacyMonths();
      if(Auth.isAdmin()){
        if(mig.changed.length) await this.syncTable('mk_datalog', mig.changed, dlToDb);
        if(mig.settingsChanged) await this.syncTable('mk_settings', [{id:settingsId()}], () => ({id:settingsId(), data: JSON.stringify(state.settings)}));
      }
      this.saveLocal();
    }catch(e){
      console.error('Cloud sync failed', e);
      toast('Could not load data from the cloud database. ' + e.message, true);
    }
  },

  async syncTable(table, rows, mapFn){
    if(!this.isCloud()) return;
    try{
      await this.cloudFetch(table + '?on_conflict=club_id,id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates'}, body: JSON.stringify(rows.map(mapFn))});
    }catch(e){ console.error('sync failed', table, e); toast('Cloud sync failed for ' + table + ': ' + e.message, true); }
  },
  async deleteRow(table, id){
    if(!this.isCloud()) return;
    try{ await this.cloudFetch(table + '?id=eq.' + encodeURIComponent(id), {method:'DELETE'}); }
    catch(e){ console.error('delete sync failed', table, e); toast('Cloud delete failed: ' + e.message, true); }
  },
  async replaceAllInTable(table, rows, mapFn){
    if(!this.isCloud()) return;
    try{
      await this.cloudFetch(table + '?id=neq.__none__', {method:'DELETE'});
      if(rows.length) await this.cloudFetch(table, {method:'POST', body: JSON.stringify(rows.map(mapFn))});
    }catch(e){ console.error('replace sync failed', table, e); toast('Cloud sync failed for ' + table + ': ' + e.message, true); }
  },

  persist(){ this.saveLocal(); },

  // Used by "Import backup": writes everything in state up to the cloud.
  async pushAllToCloud(){
    await this.syncTable('mk_members', state.members, m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));
    await this.syncTable('mk_datalog', state.datalog, dlToDb);
    await this.syncTable('mk_settings', [{id:settingsId()}], () => ({id:settingsId(), data: JSON.stringify(state.settings)}));
  }
};


// One place that turns a ledger row into its database shape. created_by is stamped
// by the database itself (a trigger), so it can't be forged from the browser.
function dlToDb(d){
  return {id:d.id, date:d.date, name:d.name, month:d.month, year:d.year, contr:d.contr, loan_rep:d.loanRep,
    int_pay:d.intPay, pena:d.pena, b2s:d.b2s, funeral:d.funeral, taken:d.taken, powng:d.powng,
    pool_chg:d.poolChg||0, source:d.source||'manual', note:d.note||null,
    created_by:d.createdBy||null, created_at:d.createdAt||null};
}

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.remove(); }, isErr?5000:3200);
}

function confirmModal(title, body, okLabel, danger){
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal">
      <h3>${escapeHtml(title)}</h3>
      <p>${body}</p>
      <div class="btnrow">
        <button class="btn secondary" id="modalCancel">Cancel</button>
        <button class="btn ${danger?'danger':''}" id="modalOk">${escapeHtml(okLabel||'Confirm')}</button>
      </div>
    </div>`;
    document.body.appendChild(back);
    back.querySelector('#modalCancel').onclick = () => { back.remove(); resolve(false); };
    back.querySelector('#modalOk').onclick = () => { back.remove(); resolve(true); };
    back.onclick = (e) => { if(e.target===back){ back.remove(); resolve(false); } };
  });
}
/* ---------------------------------------------------------------------
   BUSINESS LOGIC — mirrors the workbook's formulas & VBA rules
   --------------------------------------------------------------------- */

function activeMembers(){ return state.members.filter(m => Number(m.fixed) > 0 && !m.resigned); }
function b2sMembers(){ return state.members.filter(m => Number(m.fixed) === 0 && !m.resigned); }

function entriesFor(fullName){ return state.datalog.filter(d => d.name === fullName); }

// Total interest paid club-wide this year -> drives the 5% pool per active member,
// same relationship as Settings C48-C50. The flat "took no loan & paid no penalty"
// year-end charge (Settings > noIntPool) is tracked separately (poolChg) and goes
// into this pool at its FULL value, not just 5% of it — unlike real loan interest,
// which still splits 95% back to the member / 5% to this pool.
// A member's login can only read their own rows, so the club-wide figures behind their
// year-end shares cannot be worked out on their phone. The admin's session stores them
// in settings.shareSnapshot (members can read settings) and members' screens use that.
function memberShareSnap(){
  return (Auth.isMember() && state.settings && state.settings.shareSnapshot) ? state.settings.shareSnapshot : null;
}
function computeShareSnapshot(){
  const r2 = x => Math.round((Number(x)||0)*100)/100;
  const n = activeMembers().length;
  const totalPaid = state.datalog.reduce((a,d) => a + (Number(d.pena)||0), 0);
  const pen = Math.max(totalPaid - (Number(state.settings.functionFundCost)||0), 0);
  const totalInt = state.datalog.reduce((a,d) => a + (Number(d.intPay)||0), 0);
  const totalPoolChg = state.datalog.reduce((a,d) => a + (Number(d.poolChg)||0), 0);
  const poolTotal = totalInt * (Number(state.settings.clubShare)||0) + totalPoolChg;
  const bank = Number(state.settings.bankInterest)||0;
  const on = String(state.settings.applyPenaltyShare).toUpperCase() === 'YES';
  return {
    active: n,
    bankPer: n>0 ? r2(bank/n) : 0, bankTotal: r2(bank),
    penaltyPer: (on && n>0) ? r2(pen/n) : 0, penaltyNet: r2(pen), penaltyOn: on,
    poolPer: n>0 ? r2(poolTotal/n) : 0, poolTotal: r2(poolTotal),
  };
}
let shareSnapSaving = false;
function refreshShareSnapshot(){
  if(!Auth.isAdmin() || shareSnapSaving || !state.settings) return;
  const fresh = computeShareSnapshot();
  const old = state.settings.shareSnapshot;
  const keys = Object.keys(fresh);
  if(old && keys.every(k => old[k] === fresh[k])) return;
  state.settings.shareSnapshot = Object.assign(fresh, {at: new Date().toISOString()});
  shareSnapSaving = true;
  saveSettingsCloud().catch(()=>{}).finally(()=>{ shareSnapSaving = false; });
}

function poolPerActiveMember(){
  const snap = memberShareSnap(); if(snap) return Number(snap.poolPer)||0;
  const totalInterestPaid = state.datalog.reduce((s,d) => s + (Number(d.intPay)||0), 0);
  const totalPoolCharges = state.datalog.reduce((s,d) => s + (Number(d.poolChg)||0), 0);
  const poolTotal = totalInterestPaid * (Number(state.settings.clubShare)||0) + totalPoolCharges;
  const n = activeMembers().length;
  return n > 0 ? poolTotal / n : 0;
}

// Everything in the penalty pool comes straight from the DataLog (every row's "penalties paid"), whoever it came from:
// active members, resigned members (their penalties, 5% share and 20%), and deleted members whose paid penalties were kept.
function penaltyPoolBreakdown(){
  const r2 = x => Math.round((Number(x)||0)*100)/100;
  const active = new Set(activeMembers().map(m => m.full));
  let fromActive = 0, fromResigned = 0, fromDeleted = 0;
  state.datalog.forEach(d => {
    const v = Number(d.pena)||0; if(!v) return;
    if(active.has(d.name)) fromActive += v;
    else if(state.members.some(m => m.full === d.name)) fromResigned += v;
    else fromDeleted += v;
  });
  const total = fromActive + fromResigned + fromDeleted;
  const fund = Number(state.settings.functionFundCost)||0;
  const net = Math.max(total - fund, 0);
  const n = activeMembers().length;
  return {fromActive:r2(fromActive), fromResigned:r2(fromResigned), fromDeleted:r2(fromDeleted), total:r2(total), fund, net:r2(net), perMember: n>0 ? r2(net/n) : 0, n};
}

// Penalty share per active member (year-end only, gated by settings.applyPenaltyShare === 'YES')
function penaltySharePerActiveMember(){
  const snap = memberShareSnap(); if(snap) return Number(snap.penaltyPer)||0;
  const totalPenaltiesPaid = state.datalog.reduce((s,d) => s + (Number(d.pena)||0), 0);
  const net = Math.max(totalPenaltiesPaid - (Number(state.settings.functionFundCost)||0), 0);
  const n = activeMembers().length;
  return n > 0 ? net / n : 0;
}

function bankInterestPerActiveMember(){
  const snap = memberShareSnap(); if(snap) return Number(snap.bankPer)||0;
  const n = activeMembers().length;
  return n > 0 ? (Number(state.settings.bankInterest)||0) / n : 0;
}

// Interest accrued on an outstanding loan: 20% of the loan balance, counted in fiscal
// months from the month the loan was first taken through to the current fiscal month
// (Settings "Months Elapsed This Year"), non-compounding, minus interest already paid
// in months at/after that starting month. Faithful to the workbook's stated rule
// (Settings D6/D36); see build notes for the one formula quirk we normalised.
function computeInterestAccrued(fullName, loanBalance, entries){
  if(loanBalance <= 0) return 0;
  const loanMonthIdxs = entries.filter(e => Number(e.taken) > 0).map(e => fiscalIndex(e.month)).filter(i => i > 0);
  if(loanMonthIdxs.length === 0) return 0;
  const firstIdx = Math.min(...loanMonthIdxs);
  const nowIdx = Number(state.settings.monthsElapsed) || fiscalIndex(currentFiscalMonthGuess());
  const monthsSinceLoan = Math.max(nowIdx - firstIdx + 1, 1);
  const gross = loanBalance * (Number(state.settings.intRate)||0) * monthsSinceLoan;
  const paidSince = entries.filter(e => fiscalIndex(e.month) >= firstIdx).reduce((s,e) => s + (Number(e.intPay)||0), 0);
  return Math.max(gross - paidSince, 0);
}

function currentFiscalMonthGuess(){
  rules();                          // makes sure MONTHS follows the club's calendar
  return MON_SHORT[new Date().getMonth()];
}

// The full computed row for one member — mirrors every Spreadsheet column.
function computeMemberRow(member){
  const entries = entriesFor(member.full);
  const sum = (key) => entries.reduce((s,e) => s + (Number(e[key])||0), 0);

  const totalContributions = sum('contr');
  const outstanding = totalContributions - (Number(member.fixed)||0) * (Number(state.settings.monthsElapsed)||0);
  const loanRepaid = sum('loanRep');
  const moneyTakenGross = sum('taken');
  const loanBalance = moneyTakenGross - loanRepaid;               // "Money Taken" column (G)
  const interestPaid = sum('intPay');                              // (I)
  const interestAccrued = computeInterestAccrued(member.full, loanBalance, entries); // (H)
  const totalOwing = Math.max(loanBalance + interestAccrued, 0);   // (K)
  const b2sTotal = sum('b2s');                                     // (L)
  const penaltiesPaid = sum('pena');                                // (M)
  const penaltyOwedRaw = sum('powng');
  const penaltiesOwed = Math.max(penaltyOwedRaw - penaltiesPaid, 0); // (N)
  const alloc95 = interestPaid * (Number(state.settings.memberShare)||0); // (O) — poolChg gets NO personal cut, by design
  const poolShare = (Number(member.fixed)===0) ? 0 : poolPerActiveMember(); // (P)
  const penaltyShareApplies = String(state.settings.applyPenaltyShare).toUpperCase() === 'YES';
  const bankShare = bankInterestPerActiveMember();
  const penaltyShare = penaltyShareApplies ? penaltySharePerActiveMember() : 0;
  const totalAlloc = totalContributions + alloc95 + poolShare + bankShare + penaltyShare; // (Q), manual adj omitted (none in source data)
  const funeralAlloc = sum('funeral'); // (R)
  const poolChg = sum('poolChg'); // flat year-end charge for no-loan/no-penalty members, 100% to pool
  const toPool5 = interestPaid * (Number(state.settings.clubShare)||0) + poolChg; // (S) — this member's total contribution to the shared pool

  return {
    member, entries,
    totalContributions, outstanding, loanBalance, interestAccrued, interestPaid, loanRepaid,
    totalOwing, b2sTotal, penaltiesPaid, penaltiesOwed, alloc95, poolShare, bankShare, penaltyShare, penaltyShareApplies, totalAlloc, funeralAlloc, toPool5, poolChg,
  };
}

// Qualifies for the flat year-end "never paid real interest" pool charge —
// applies whether or not they ever took a loan: a member who took a loan and
// simply never paid its interest (just absorbing the monthly non-payment
// penalty instead) still hasn't contributed anything to the 5% pool, so they
// qualify too. Everyone needs to contribute something to the pool to be fairly
// eligible for a share of it — this charge is what guarantees that. B2S-only
// members are always exempt.
function qualifiesForPoolCharge(row){
  if(!feat('poolCharge') || !feat('loans')) return false;
  if(Number(row.member.fixed) === 0) return false;
  const alreadyCharged = row.poolChg > 0;
  return row.interestPaid <= 0 && !alreadyCharged;
}

function allMemberRows(){
  return state.members
    .filter(m => !m.resigned)
    .slice()
    .sort((a,b) => (a.surname+a.name).localeCompare(b.surname+b.name))
    .map(computeMemberRow);
}

// Yearly Contr equivalent: total money in (all categories) per member per fiscal month
function monthTotalForMember(fullName, month){
  return state.datalog
    .filter(d => d.name === fullName && d.month === month)
    .reduce((s,d) => s + (Number(d.contr)||0) + (Number(d.loanRep)||0) + (Number(d.intPay)||0) +
                       (Number(d.pena)||0) + (Number(d.b2s)||0) + (Number(d.funeral)||0), 0);
}

// Monthly Report equivalent: aggregate DataLog by member for one fiscal month
function monthlyReport(month){
  const rows = state.members.filter(m => !m.resigned).slice().sort((a,b)=>(a.surname+a.name).localeCompare(b.surname+b.name)).map(m => {
    const entries = state.datalog.filter(d => d.name===m.full && d.month===month);
    const sum = (k) => entries.reduce((s,e)=>s+(Number(e[k])||0),0);
    const contr=sum('contr'), loanRep=sum('loanRep'), intPay=sum('intPay'), pena=sum('pena'),
          b2s=sum('b2s'), funeral=sum('funeral'), taken=sum('taken'), powng=sum('powng'), poolChg=sum('poolChg');
    const totalPaid = contr+loanRep+intPay+pena+b2s+funeral+poolChg;
    const paid = totalPaid>0 || taken>0 || powng>0;
    return {member:m, contr,loanRep,intPay,pena,b2s,funeral,taken,powng,poolChg,totalPaid,paid};
  });
  const totals = rows.reduce((acc,r) => {
    ['contr','loanRep','intPay','pena','b2s','funeral','taken','powng','poolChg','totalPaid'].forEach(k => acc[k]=(acc[k]||0)+r[k]);
    acc.paidCount += r.paid?1:0;
    return acc;
  }, {paidCount:0});
  return {rows, totals};
}

/* ---------------------------------------------------------------------
   PENALTY RULES (LogEntry pass-1 in the VBA)
   --------------------------------------------------------------------- */

// ---- Plain-language penalty reasons -------------------------------------
function dayMonth(dateStr){
  const d = new Date(dateStr);
  return isNaN(d) ? '' : `${d.getDate()} ${MON_SHORT[d.getMonth()]}`;
}
function missedTierInfo(member){
  const s = state.settings;
  if(member.fixed > s.t2Cutoff) return {amount:s.t3, name:`Tier 3 (monthly contribution above ${fmtR(s.t2Cutoff)})`};
  if(member.fixed > s.t1Cutoff) return {amount:s.t2, name:`Tier 2 (monthly contribution ${fmtR(Number(s.t1Cutoff)+1)}–${fmtR(s.t2Cutoff)})`};
  return {amount:s.t1, name:`Tier 1 (monthly contribution up to ${fmtR(s.t1Cutoff)})`};
}
// Specific wording for each kind of penalty
function reasonMissedPaid(member, contr, payDate, month){
  const t = missedTierInfo(member);
  return `Contribution for ${month||'the month'} (${fmtR(contr)}) paid on ${dayMonth(payDate)} — after the deadline (the ${ordDay(dueLateDay())} of the following month), counted as missed: ${t.name}, ${fmtR(t.amount)}`;
}
function reasonLatePaid(contr, payDate, month){
  return `Contribution for ${month||'the month'} (${fmtR(contr)}) paid on ${dayMonth(payDate)} — between the ${ordDay(dueOnTimeDay()+1)} and ${ordDay(dueLateDay())} of the following month, late: ${fmtR(state.settings.late)}`;
}
function reasonMissedSweep(member, month, today){
  const t = missedTierInfo(member);
  return `No contribution received for ${month} by ${dayMonth(today)} — the deadline (${ordDay(dueLateDay())} of the following month) has passed, counted as missed: ${t.name}, ${fmtR(t.amount)}`;
}
function reasonLateSweep(month, today){
  return `No contribution received for ${month} by ${dayMonth(today)} — past the ${ordDay(dueOnTimeDay())} of the following month, late: ${fmtR(state.settings.late)}`;
}
function reasonInterest(month, loanBalance){
  return `No interest paid for ${month} by the deadline (${ordDay(dueLateDay())} of the following month) while a loan of ${fmtR(loanBalance)} was outstanding — ${fmtR(state.settings.intPenalty)}`;
}

// ---- When is a month's contribution on time? --------------------------------
// A month's contribution may be paid any time in that month, or up to the 4th of
// the following month = on time. From the 5th to the 10th of the following month
// it is late; from the 11th it is missed. (e.g. September: on time through 4 Oct,
// late 5-10 Oct, missed from 11 Oct.) The fiscal year runs Dec to Nov, so for
// year 2026 December is in calendar 2025.
// Club rules (set per club in Settings; these are the defaults)
function ordDay(n){ n=Number(n); const t=n%100; const suf=(t>=11&&t<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'); return n+suf; }
function dueOnTimeDay(){ const v=Number(state.settings.dueOnTimeDay); return (isFinite(v)&&v>=0&&v<=27)?Math.floor(v):4; }
function dueLateDay(){ const v=Number(state.settings.dueLateDay); return (isFinite(v)&&v>dueOnTimeDay()&&v<=28)?Math.floor(v):Math.max(10,dueOnTimeDay()+1); }
function noPenaltyMonth(){ const v=state.settings.noPenaltyMonth; return v===undefined?(rules(),MONTHS[0]):String(v||''); }
function isNoPenaltyMonth(m){ const n=noPenaltyMonth(); return !!n && m===n; }
const MONTH_NUM = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function contributionTiming(month, dateStr){
  const p = String(dateStr||'').slice(0,10).split('-').map(Number);
  const mn = MONTH_NUM[month];
  if(p.length < 3 || !p[0] || !mn) return 'ontime';
  const fy = Number(state.settings.yearLabel);
  const sm = startMonth();   // the financial year is named after the year it ends in
  const cy = fy ? ((sm > 1 && mn >= sm) ? fy - 1 : fy) : p[0];
  const after = (p[0]*12 + p[1]) - (cy*12 + mn);   // whole months after the contribution month
  if(after <= 0) return 'ontime';                  // paid in the month itself, or in advance
  if(after === 1) return p[2] > dueLateDay() ? 'missed' : (p[2] > dueOnTimeDay() ? 'late' : 'ontime');
  return 'missed';
}

function computeAutoPenalty(member, contrAmount, payDateStr, loanBalance, intPayAmount, hasAnyActivity, month, isAdvance){
  if(!feat('penalties')) return {amount:0, reason:''};          // this club has no penalties
  if(Number(member.fixed) === 0) return {amount:0, reason:''}; // B2S exempt
  if(isNoPenaltyMonth(month)) return {amount:0, reason:''};     // the club's penalty-free month
  // If this member+month already has a penalty on record (e.g. applied earlier by
  // "Run Penalty Check"), don't auto-suggest a second one on top of it — that
  // would double-charge them for the same missed month.
  if(month && state.datalog.some(e => e.name===member.full && e.month===month && (Number(e.powng) > 0 || String(e.note||'').startsWith('[Fixed]')) && e.source!=='attendance')){
    return {amount:0, reason:'', alreadyPenalized:true};
  }
  let amount = 0; const parts = [];
  // Marked as an advance/pre-payment for a future month — never a late-contribution
  // penalty, regardless of what day-of-month the money actually changed hands on.
  const timing = payDateStr ? contributionTiming(month, payDateStr) : 'ontime';
  if(contrAmount > 0 && payDateStr && !isAdvance){
    const s2 = state.settings;
    if(timing === 'missed'){
      amount += missedTierInfo(member).amount; parts.push(reasonMissedPaid(member, contrAmount, payDateStr, month));
    } else if(timing === 'late'){
      amount += s2.late; parts.push(reasonLatePaid(contrAmount, payDateStr, month));
    }
  }
  // Interest is due on the same schedule: only charged once the deadline has passed.
  if(loanBalance > 0 && (!intPayAmount || intPayAmount===0) && hasAnyActivity && timing === 'missed'){
    amount += state.settings.intPenalty; parts.push(reasonInterest(month || 'this month', loanBalance));
  }
  return {amount, reason: parts.join('; ')};
}

function computeAttendancePenalty(member, status, apology){
  if(!feat('penalties') || !feat('attendance')) return 0;
  if(Number(member.fixed) === 0) return 0; // B2S exempt
  status = (status||'').toLowerCase();
  apology = (apology||'').toLowerCase();
  if(status === 'present' || status === 'exempted') return 0;
  if(status === 'apology' || (status==='absent' && (apology==='yes'||apology==='y'))) return state.settings.attApology;
  return state.settings.attNoApol; // absent, no apology (or blank)
}

/* ---------------------------------------------------------------------
   PENALTY SWEEP — "Run Penalty Check": scans everyone at once for the
   given fiscal month and flags/applies penalties for missed contribution
   or missed interest, using today's day-of-month for the tier (run it any
   time after the 10th and everyone still missing gets the "missed" tier).
   --------------------------------------------------------------------- */
// Resignation settlement. Order of deductions from (contributions + B2S):
//   1. loan principal  2. penalties owed  3. the club's 5% share of the unpaid (accrued) interest
// The rest is split 80% member / 20% club. Unpaid accrued interest is NOT charged to the member (waived),
// only the 5% share. Interest already paid also has its 5% moved from the pool to penalties paid. Penalties, the 5% share and the 20% all go in as PENALTIES PAID. Penalties and the 5% are recorded in full even if
// the member's money does not cover them; the gap shows as "still owed".
function resignCalc(row, draft){
  const r2 = x => Math.round((Number(x)||0)*100)/100;
  draft = draft || {};
  const loan = draft.overrideOwing!=null ? draft.overrideOwing : row.loanBalance;
  const penOwed = draft.overridePenalty!=null ? draft.overridePenalty : row.penaltiesOwed;
  const share = draft.overrideShare!=null ? draft.overrideShare : r2(row.interestAccrued * (Number(state.settings.clubShare)||0));
  const paidIn = r2(draft.paidIn || 0);                 // cash the member pays in now to cover a shortfall
  const available = row.totalContributions + row.b2sTotal + paidIn;
  // Penalties and the 5% share are recorded as penalties paid IN FULL, even when the member's money does not
  // cover them (any gap shows as "still owed"). Only the 20% depends on what is left.
  const penPaid = r2(penOwed);
  const sharePaid = r2(share);
  const net = r2(Math.max(available - loan - penOwed - share, 0));
  const forfeiture = r2(net*(1-payoutFrac())), payout = r2(net - forfeiture);
  const stillOwed = r2(Math.max(loan + penOwed + share - available, 0));
  // The 5% on interest the member ALREADY paid is sitting in the shared pool. It moves to penalties paid too
  // (nothing extra is charged to the member), so the whole 5%, paid or unpaid, ends up under penalties paid.
  const paidShare = r2((Number(row.interestPaid)||0) * (Number(state.settings.clubShare)||0));
  return {loan, penOwed, share, paidShare, paidIn, available, penPaid, sharePaid, net, forfeiture, payout, stillOwed, loanShort: r2(Math.max(loan-available,0))};
}

// Deleting members: their paid penalties (and year-end pool charge) are money the club already holds, so those
// amounts stay in the DataLog (stripped to just that money). Everything else for the member is removed.
function planMemberDeletion(names){
  const all = state.datalog.filter(d => names.includes(d.name));
  const keep = all.filter(d => (Number(d.pena)||0) > 0 || (Number(d.poolChg)||0) !== 0);
  const kept = keep.map(d => {
    const stamp = ' [Member deleted ' + todayISO() + ': paid penalty kept]';
    return Object.assign({}, d, {contr:0, loanRep:0, intPay:0, b2s:0, funeral:0, taken:0, powng:0,
      pena:(Number(d.pena)||0), poolChg:(Number(d.poolChg)||0), note: String(d.note||'').replace(/ \[Member deleted [^\]]*\]/,'') + stamp});
  });
  const keptIds = new Set(kept.map(d=>d.id));
  return {kept, removedIds: all.filter(d => !keptIds.has(d.id)).map(d=>d.id), keptPen: keep.reduce((a,d)=>a+(Number(d.pena)||0),0)};
}
async function applyMemberDeletion(members, plan){
  const names = members.map(m=>m.full), ids = members.map(m=>m.id);
  state.members = state.members.filter(m => !ids.includes(m.id));
  state.datalog = state.datalog.filter(d => !names.includes(d.name)).concat(plan.kept);
  if(names.includes(state.selectedMemberFull)) state.selectedMemberFull = null;
  Store.persist();
  for(const id of ids) await Store.deleteRow('mk_members', id);
  if(plan.kept.length) await Store.syncTable('mk_datalog', plan.kept, dlToDb);
  for(const id of plan.removedIds) await Store.deleteRow('mk_datalog', id);
}

// A month can only be scanned once the late-payment day of the FOLLOWING month has passed
// (by default the 11th onwards), because until then a payment can still arrive on time or late.
function sweepOpenDate(month){
  const mn = MONTH_NUM[month]; if(!mn) return null;
  const fy = Number(state.settings.yearLabel) || new Date().getFullYear();
  const sm = startMonth();
  const cy = (sm > 1 && mn >= sm) ? fy - 1 : fy;
  const d = new Date(Date.UTC(cy, mn, dueLateDay() + 1));      // month index mn = the next calendar month
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
}
function sweepAllowed(month){
  const open = sweepOpenDate(month);
  return !!open && todayISO() >= open;
}
function sweepOpenLabel(month){ const open = sweepOpenDate(month); return open ? fmtDate(open) : ''; }
function clubPct(){ return Math.round((Number(state.settings.clubShare)||0)*100); }        // the club's share of interest, e.g. 5
function clubKeepPct(){ return 100 - payoutPct(); }                                        // what the club keeps when someone resigns, e.g. 20

function scanPenaltySweep(month){
  if(isNoPenaltyMonth(month) || !feat('penalties')) return []; // penalty-free month, or a club with no penalties
  if(!sweepAllowed(month)) return []; // too early: see sweepOpenDate
  const today = todayISO();
  const results = [];
  for(const member of activeMembers()){
    const row = computeMemberRow(member);
    const alreadySwept = row.entries.some(e => e.month===month && e.source==='sweep');
    if(alreadySwept) continue;
    const paidContrThisMonth = row.entries.some(e => e.month===month && Number(e.contr)>0);
    const paidIntThisMonth = row.entries.some(e => e.month===month && Number(e.intPay)>0);
    const hasLoan = row.loanBalance > 0;
    let amount = 0; const parts = [];
    const timing = contributionTiming(month, today);
    if(!paidContrThisMonth){
      if(timing === 'missed'){
        amount += missedTierInfo(member).amount; parts.push(reasonMissedSweep(member, month, today));
      } else if(timing === 'late'){
        amount += state.settings.late; parts.push(reasonLateSweep(month, today));
      }
    }
    if(hasLoan && !paidIntThisMonth && timing === 'missed'){
      amount += state.settings.intPenalty; parts.push(reasonInterest(month, row.loanBalance));
    }
    if(amount > 0){
      results.push({member, amount, reason: parts.join('; '), missedContr: !paidContrThisMonth, missedInt: hasLoan && !paidIntThisMonth});
    }
  }
  return results;
}

/* ---------------------------------------------------------------------
   YEAR-END DISTRIBUTION — loans are only ever deducted from a member's
   payout at year-end, never during the year. Everything else (interest,
   pool share, contributions) stays exactly as computeMemberRow shows it
   all year; this just adds the one final subtraction.
   --------------------------------------------------------------------- */
function computeYearEndPayout(row){
  const deduction = row.loanBalance; // unpaid loan principal only — accrued interest is NOT deducted at year-end
  const netPayout = Math.max(row.totalAlloc - deduction, 0);
  const stillOwed = Math.max(deduction - row.totalAlloc, 0);
  return {grossAlloc: row.totalAlloc, deduction, netPayout, stillOwed};
}

/* ---------------------------------------------------------------------
   DOWNGRADE CONTRIBUTION — a member drops their monthly rate. They must
   already have this year's contributions at the NEW rate (12 calendar
   months' worth); any shortfall must be topped up now, any excess pays
   down their loan if they have one.
   --------------------------------------------------------------------- */
function computeDowngradePreview(member, newFixed){
  const row = computeMemberRow(member);
  const annualTarget = newFixed * 12;
  const currentContr = row.totalContributions;
  const shortfall = Math.max(annualTarget - currentContr, 0);
  const excess = Math.max(currentContr - annualTarget, 0);
  const loanPayoff = Math.min(excess, row.loanBalance);
  return {row, annualTarget, currentContr, shortfall, excess, loanPayoff};
}


/* ---------------------------------------------------------------------
   LOAN RULES
   1. B2S-only members (fixed contribution = 0) cannot take loans.
   2. A member's loan principal (what they already owe + the new loan) may not
      exceed 50% of their yearly contributions (percentage and basis are in
      Settings: "annual" = monthly contribution x 12, "paid" = what they have
      actually contributed so far this year).
   3. Either rule can be lifted for one member by an admin-approved exception
      (a ceiling on their total outstanding loan, with a reason). Exceptions
      are logged and expire when the financial year changes.
   --------------------------------------------------------------------- */
function loanCapPct(){ const v = Number(state.settings.loanCapPct); return (isFinite(v) && v > 0) ? v : 50; }
function loanCapBasis(){ return state.settings.loanCapBasis === 'paid' ? 'paid' : 'annual'; }
function loanExceptionsFor(full){
  return (state.settings.loanExceptions || []).filter(x => x.member === full && !x.revoked && Number(x.year) === Number(state.settings.yearLabel));
}
function loanCapFor(member){
  const row = computeMemberRow(member);
  const base = loanCapBasis()==='paid' ? row.totalContributions : (Number(member.fixed)||0) * 12;
  return {row, base, cap: base * loanCapPct() / 100};
}
// pendingExtra = loans for the same member already staged but not yet saved.
function checkLoan(memberFull, amount, pendingExtra){
  const member = state.members.find(m => m.full === memberFull);
  const res = {ok:true, problems:[], exception:null, outstanding:0, after:0, cap:0, base:0};
  if(!member){ res.ok=false; res.problems.push('Member not found.'); return res; }
  const {row, base, cap} = loanCapFor(member);
  const outstanding = Math.max(row.loanBalance, 0) + (pendingExtra||0);
  const after = outstanding + amount;
  Object.assign(res, {outstanding, after, cap, base});
  const ex = loanExceptionsFor(memberFull).sort((a,b)=>Number(b.maxTotal)-Number(a.maxTotal))[0];
  if(ex){
    res.exception = ex;
    if(after > Number(ex.maxTotal) + 0.005){
      res.problems.push(`Even with the approved exception (up to ${fmtR(ex.maxTotal)} outstanding), this loan would take them to ${fmtR(after)}.`);
    }
  } else if(!feat('loans')){
    res.problems.push('Loans are switched off for this club.');
  } else if(Number(member.fixed) === 0 && rules().blockB2sLoans){
    res.problems.push('Members who pay no monthly contribution cannot take loans.');
  } else if(after > cap + 0.005){
    const basisTxt = loanCapBasis()==='paid' ? 'their contributions paid so far this year' : 'their yearly contributions (monthly amount × 12)';
    res.problems.push(`A loan may not exceed ${loanCapPct()}% of ${basisTxt} (${fmtR(base)}), i.e. ${fmtR(cap)}. They already owe ${fmtR(outstanding)}, so this loan would take it to ${fmtR(after)}.`);
  }
  res.ok = res.problems.length === 0;
  return res;
}

// Returns true when the loan may go ahead. Otherwise explains why, and (for the
// admin) offers to grant an exception.
async function guardLoan(memberFull, amount, pendingExtra){
  const chk = checkLoan(memberFull, amount, pendingExtra);
  if(chk.ok) return true;
  const body = `<b>${escapeHtml(memberFull)}</b><br>${chk.problems.map(escapeHtml).join('<br>')}` +
    (can('settings') ? `<br><br>You can approve a one-off exception for this member.`
                 : `<br><br>Only the admin can approve an exception (Loans tab → Loan exceptions).`);
  const go = await confirmModal('Loan not allowed', body, can('settings') ? 'Grant exception…' : 'OK', false);
  if(go && can('settings')) openLoanExceptionModal(memberFull, chk.after);
  return false;
}

async function saveSettingsCloud(){
  Store.persist();
  await Store.syncTable('mk_settings', [{id:settingsId()}], () => ({id:settingsId(), data: JSON.stringify(state.settings)}));
}

function openLoanExceptionModal(presetMember, presetMax){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Grant a loan exception</h3>
    <p class="sub">Lifts the B2S-only block and/or the ${loanCapPct()}% limit for this member, up to the ceiling below. It lasts for this financial year (or until you revoke it) and is recorded in the activity log.</p>
    <div style="margin-top:10px"><label>Member</label><select id="exMember"><option value="">Select member…</option>${memberOptions(presetMember)}</select></div>
    <div style="margin-top:10px"><label>Highest total loan allowed (R) <span class="hint">principal outstanding, including the new loan</span></label>
      <input type="number" id="exMax" min="0" step="0.01" value="${presetMax?Math.ceil(presetMax):''}"></div>
    <div style="margin-top:10px"><label>Reason <span class="req">*</span></label><input type="text" id="exReason" placeholder="e.g. Approved at the general meeting, 3 Oct"></div>
    <div class="btnrow">
      <button class="btn secondary" id="exCancel">Cancel</button>
      <button class="btn" id="exSave">Grant exception</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#exCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#exSave').onclick = async () => {
    const member = back.querySelector('#exMember').value;
    const maxTotal = Number(back.querySelector('#exMax').value) || 0;
    const reason = back.querySelector('#exReason').value.trim();
    if(!member){ toast('Select a member.', true); return; }
    if(maxTotal <= 0){ toast('Enter the highest total loan allowed.', true); return; }
    if(!reason){ toast('Give a reason — it is kept in the record.', true); return; }
    state.settings.loanExceptions = (state.settings.loanExceptions || []).concat([{
      id: uid('lx'), member, maxTotal, reason, year: state.settings.yearLabel, date: todayISO(),
      approvedBy: (Auth.profile && Auth.profile.email) || 'admin', revoked: false
    }]);
    await saveSettingsCloud();
    back.remove();
    toast('Exception granted. The loan can now be recorded.');
    render();
  };
}

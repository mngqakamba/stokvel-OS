    <div class="btnrow" style="margin-top:16px"><button class="btn secondary" id="refreshUsersBtn">Refresh list</button></div>
  </div>`;
}

function wireUsers(){
  const inviteBtn = document.getElementById('inviteBtn');
  if(inviteBtn) inviteBtn.onclick = async () => {
    const e = document.getElementById('inviteEmail').value.trim();
    if(!e){ toast('Type an email address.', true); return; }
    try{
      const msg = await Store.cloudFetch('rpc/mk_invite_user', {method:'POST', body: JSON.stringify({p_email:e})});
      toast(String(msg||'Done.')); await loadProfilesCache(); render();
    }catch(err){
      let m = err.message || ''; try{ m = JSON.parse(m.slice(m.indexOf('{'))).message || m; }catch(_){}
      toast(m, true);
    }
  };
  const refresh = document.getElementById('refreshUsersBtn');
  if(refresh) refresh.onclick = async () => { await loadProfilesCache(); render(); };

  // What a chosen role means: a built-in role, or one of the club's own (a base role plus a fixed set of abilities).
  const resolveRole = (val) => {
    if(String(val).startsWith('r:')){ const c = rules().roles.find(x => 'r:'+x.id === val); if(c) return {role:c.base, perms:c.perms.slice(), title:c.name, fixed:true}; }
    return {role:val, perms:null, title:null, fixed:false};
  };
  document.querySelectorAll('[data-role]').forEach(sel => { sel.onchange = () => {
    const r = resolveRole(sel.value), allowed = rolePermKeys(r.role);
    document.querySelectorAll(`[data-perm="${sel.dataset.role}"]`).forEach(c => {
      if(r.fixed){ c.checked = r.perms.includes(c.value); c.disabled = true; }
      else { c.disabled = !allowed.includes(c.value); if(c.disabled) c.checked = false; }
    });
  }; });
  document.querySelectorAll('[data-saveuser]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.saveuser;
      const chosen = resolveRole(document.querySelector(`[data-role="${id}"]`).value);
      const role = chosen.role;
      const memberFull = document.querySelector(`[data-memberlink="${id}"]`).value;
      const allowed = rolePermKeys(role);
      const perms = chosen.fixed ? chosen.perms : [...document.querySelectorAll(`[data-perm="${id}"]:checked`)].map(c => c.value).filter(k => allowed.includes(k));
      try{
        await Store.cloudFetch('mk_memberships?user_id=eq.' + encodeURIComponent(id) + '&club_id=eq.' + encodeURIComponent(Auth.profile.club_id), {
          method:'PATCH', body: JSON.stringify({role, role_title: chosen.title, member_full: role==='member' ? memberFull : null, perms})
        });
        toast('Saved.');
        await loadProfilesCache();
        render();
      }catch(e){
        toast('Could not save: ' + e.message, true);
      }
    };
  });

  document.querySelectorAll('[data-resetpw]').forEach(btn => {
    btn.onclick = () => openResetPasswordModal(btn.dataset.resetpw, btn.dataset.email);
  });
}

/* ---------------------------------------------------------------------
   VIEW: PENALTIES — where every penalty came from, per member per month,
   plus the admin's tools to correct a mistake. Each fix keeps the original
   reason in the note and is recorded in the activity log (old vs new).
   --------------------------------------------------------------------- */
let penFilterMember = '';
let penFilterMonth = '';

const SOURCE_LABELS = {
  sweep:'Penalty check', manual:'Payment entry', csv:'CSV import', attendance:'Meeting attendance',
  manualpenalty:'Added by admin', newyear:'Carried forward', downgrade:'Downgrade', resignation:'Resignation',
  b2s:'B2S payout', yearend:'Year-end', poolcharge:'Year-end charge', banktrip:'Bank visit'
};

// Rows saved before reasons were recorded: work the reason out from the row itself
// (amount, date and what was paid) so it is still specific.
function inferPenaltyReason(d){
  const s = state.settings, amt = Number(d.powng)||0, m = state.members.find(x => x.full === d.name);
  const when = dayMonth(d.date);
  if(d.source === 'newyear') return `${fmtR(amt)} of penalties brought forward unpaid from last year`;
  if(d.source === 'manualpenalty') return 'Added by admin';
  if(d.source === 'attendance'){
    if(Math.abs(amt - s.attApology) < 0.005) return `Meeting on ${when} — absent with an apology, ${fmtR(amt)}`;
    if(Math.abs(amt - s.attNoApol) < 0.005) return `Meeting on ${when} — absent without an apology, ${fmtR(amt)}`;
    return `Meeting attendance on ${when}, ${fmtR(amt)}`;
  }
  const swept = d.source === 'sweep';
  const contr = Number(d.contr)||0;
  const tier = m ? missedTierInfo(m).amount : null;
  const late = Number(s.late), intP = Number(s.intPenalty);
  const eq = (a,b) => b !== null && Math.abs(a-b) < 0.005;
  const missedTxt = () => swept ? reasonMissedSweep(m, d.month, d.date) : (contr ? reasonMissedPaid(m, contr, d.date, d.month) : `Contribution for ${d.month} counted as missed (after the ${ordDay(dueLateDay())} of the following month), ${fmtR(tier)}`);
  const lateTxt = () => swept ? reasonLateSweep(d.month, d.date) : (contr ? reasonLatePaid(contr, d.date, d.month) : `Contribution for ${d.month} was late (${ordDay(dueOnTimeDay()+1)}–${ordDay(dueLateDay())} of the following month), ${fmtR(late)}`);
  const intTxt = () => `No interest paid for ${d.month} by the deadline (${ordDay(dueLateDay())} of the following month) while a loan was outstanding — ${fmtR(intP)}`;
  if(m){
    if(eq(amt, tier)) return missedTxt();
    if(eq(amt, late)) return lateTxt();
    if(eq(amt, intP)) return intTxt();
    if(eq(amt, tier + intP)) return missedTxt() + '; ' + intTxt();
    if(eq(amt, late + intP)) return lateTxt() + '; ' + intTxt();
  }
  return `${fmtR(amt)} penalty for ${d.month}, recorded ${when} (the detailed reason was not saved when it was captured)`;
}
function penaltyReason(d){
  return d.note ? d.note : inferPenaltyReason(d);
}

function isPenaltyRow(d){ return Number(d.powng) > 0 || String(d.note||'').startsWith('[Fixed]'); }

function penaltyItems(filter){
  filter = filter || {};
  const live = new Set(state.members.filter(m => !m.resigned).map(m => m.full));
  return state.datalog
    .filter(d => isPenaltyRow(d) && live.has(d.name) && (!filter.member || d.name===filter.member) && (!filter.month || d.month===filter.month))
    .slice()
    .sort((a,b) => (fiscalIndex(a.month)-fiscalIndex(b.month)) || String(a.date).localeCompare(String(b.date)));
}

function whoShort(email){ return String(email||'').split('@')[0]; }

// A member's penalties laid out month by month (used on their own page and on the Penalties tab).
function penaltySummaryHtml(member){
  const row = computeMemberRow(member);
  const items = penaltyItems({member: member.full});
  const paidByMonth = {};
  row.entries.forEach(e => { if(Number(e.pena)>0) paidByMonth[e.month] = (paidByMonth[e.month]||0) + Number(e.pena); });
  const months = MONTHS.filter(mo => items.some(i => i.month===mo) || paidByMonth[mo]);
  if(months.length===0) return `<h2 style="margin-top:22px"><span class="dot"></span>Penalty summary</h2><div class="empty">No penalties this year.</div>`;
  return `<h2 style="margin-top:22px"><span class="dot"></span>Penalty summary</h2>
  <p class="sub">Every penalty charged this year and why. Payments are listed in the month they were made.</p>
  <div class="tablewrap"><table>
    <thead><tr><th>Month</th><th class="num">Charged</th><th>Reason</th><th class="num">Paid</th></tr></thead>
    <tbody>${months.map(mo => {
      const its = items.filter(i => i.month===mo);
      const charged = its.reduce((s,i)=>s+(Number(i.powng)||0),0);
      return `<tr><td>${mo}</td><td class="num" style="color:var(--red)">${charged?fmtR(charged):'—'}</td>
        <td>${its.length ? its.map(i => `${Number(i.powng)>0?fmtR(i.powng)+' — ':''}${escapeHtml(penaltyReason(i))}`).join('<br>') : '—'}</td>
        <td class="num">${paidByMonth[mo]?fmtR(paidByMonth[mo]):'—'}</td></tr>`;
    }).join('')}
    <tr class="tot-row"><td>Total</td><td class="num">${fmtR(items.reduce((s,i)=>s+(Number(i.powng)||0),0))}</td><td>Still owing: <b>${fmtR(row.penaltiesOwed)}</b></td><td class="num">${fmtR(row.penaltiesPaid)}</td></tr>
    </tbody>
  </table></div>`;
}

function viewPenalties(opts){
  opts = opts || {};
  const audOnly = auditorOnlyExecs();
  const execSet = new Set(executiveMembers().map(x => x.m.full));
  const keep = i => !audOnly || execSet.has(i.name);
  const items = penaltyItems({member: penFilterMember, month: penFilterMonth}).filter(keep);
  const charged = items.reduce((s,i)=>s+(Number(i.powng)||0),0);
  const allRows = allMemberRows().filter(r => !audOnly || execSet.has(r.member ? r.member.full : r.full));
  const paid = allRows.reduce((s,r)=>s+r.penaltiesPaid,0);
  const owing = allRows.reduce((s,r)=>s+r.penaltiesOwed,0);
  const allItems = penaltyItems({}).filter(keep);
  // member x month matrix
  const byMember = {};
  allItems.forEach(i => {
    if(!byMember[i.name]) byMember[i.name] = {};
    byMember[i.name][i.month] = (byMember[i.name][i.month]||0) + (Number(i.powng)||0);
  });
  const matrixNames = Object.keys(byMember).sort();
  const canFix = canCapture() && !opts.readonly;
  return `
  <div class="card no-print">

      <div><label>Month</label><select id="penMonthSel"><option value="">All months</option>${monthOptions(penFilterMonth)}</select></div>
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:18px">
    <div class="kpi"><div class="v">${items.filter(i=>Number(i.powng)>0).length}</div><div class="l">Penalties${penFilterMember||penFilterMonth?' (filtered)':''}</div></div>
    <div class="kpi"><div class="v">${fmtR(charged)}</div><div class="l">Charged${penFilterMember||penFilterMonth?' (filtered)':''}</div></div>
    <div class="kpi"><div class="v">${fmtR(paid)}</div><div class="l">Paid by members (all)</div></div>
    <div class="kpi"><div class="v" style="color:var(--red)">${fmtR(owing)}</div><div class="l">Still owing (all)</div></div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>Penalties per member per month</h2>
    ${matrixNames.length===0 ? `<div class="empty">No penalties have been charged this year.</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Member</th>${MONTHS.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Charged</th><th class="num">Paid</th><th class="num">Owing</th></tr></thead>
      <tbody>${matrixNames.map(n => {
        const mem = state.members.find(m=>m.full===n); const r = computeMemberRow(mem);
        const tot = Object.values(byMember[n]).reduce((s,v)=>s+v,0);
        return `<tr style="cursor:pointer" data-penmember="${escapeHtml(n)}"><td>${escapeHtml(n)}</td>
          ${MONTHS.map(m => `<td class="num">${byMember[n][m]?fmtR(byMember[n][m]):''}</td>`).join('')}
          <td class="num" style="font-weight:700">${fmtR(tot)}</td><td class="num">${fmtR(r.penaltiesPaid)}</td>
          <td class="num" style="color:${r.penaltiesOwed>0?'var(--red)':'inherit'};font-weight:700">${fmtR(r.penaltiesOwed)}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="sub no-print" style="margin-top:8px">Click a member to list their penalties and the reason for each.</p>`}
  </div>

  <div class="card">
    <h2><span class="dot"></span>Where each penalty came from</h2>
    ${items.length===0 ? `<div class="empty">Nothing to show for this selection.</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Member</th><th>Month</th><th class="num">Amount</th><th>Reason</th><th>How it was recorded</th><th>Captured by</th>${canFix?'<th class="no-print"></th>':''}</tr></thead>
      <tbody>${items.map(i => `<tr>
        <td>${fmtDate(i.date)}</td><td>${escapeHtml(i.name)}</td><td>${i.month}</td>
        <td class="num" style="color:var(--red);font-weight:700">${Number(i.powng)>0?fmtR(i.powng):'<span class="pill gray">Removed</span>'}</td>
        <td>${escapeHtml(penaltyReason(i))}</td>

      <tfoot><tr><td colspan="3" style="font-weight:700">Total</td><td class="num" style="font-weight:700">${fmtR(tot)}</td></tr></tfoot>
    </table></div>`}
  </div>`; })()}
  `;
}

function wirePenalties(){

function openPenaltyFixModal(rowId){
  const d = state.datalog.find(x => x.id === rowId);
  if(!d) return;
  const original = Number(d.powng)||0;
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Fix penalty</h3>
    <p class="sub">${escapeHtml(d.name)} · ${d.month} · currently <b>${fmtR(original)}</b><br>${escapeHtml(penaltyReason(d))}</p>
    <div class="grid g2" style="margin-top:10px">
      <div><label>Member</label><select id="fpMember">${memberOptions(d.name)}</select></div>
      <div><label>Month</label><select id="fpMonth">${monthOptions(d.month)}</select></div>
    </div>
    <div style="margin-top:10px"><label>Correct amount (R) <span class="hint">0 removes the penalty</span></label>
      <input type="number" id="fpAmount" min="0" step="0.01" value="${original}"></div>
    <div style="margin-top:10px"><label>Why is this being corrected? <span class="req">*</span></label>
      <input type="text" id="fpReason" placeholder="e.g. Paid on the 3rd, receipt attached"></div>
    <div class="btnrow">
      <button class="btn secondary" id="fpCancel">Cancel</button>
      <button class="btn" id="fpSave">Save correction</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#fpCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#fpSave').onclick = async () => {
    const amount = Math.max(Number(back.querySelector('#fpAmount').value) || 0, 0);
    const reason = back.querySelector('#fpReason').value.trim();
    const member = back.querySelector('#fpMember').value;
    const month = back.querySelector('#fpMonth').value;
    if(!reason){ toast('Give a reason for the correction.', true); return; }
    const oldReason = penaltyReason(d).replace(/^\[Fixed\].*?\| was: /, '');
    const changes = [];
    if(amount !== original) changes.push(`R${original} → R${amount}`);
    if(member !== d.name) changes.push(`member ${d.name} → ${member}`);
    if(month !== d.month) changes.push(`month ${d.month} → ${month}`);
    if(changes.length===0){ toast('Nothing was changed.', true); return; }
    d.powng = amount; d.name = member; d.month = month;
    d.note = `[Fixed] ${changes.join(', ')}: ${reason} | was: ${oldReason}`;
    Store.persist();
    await Store.syncTable('mk_datalog', [d], dlToDb);
    back.remove();
    toast('Penalty corrected.');
    render();
  };
}

function openAddPenaltyModal(){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Add a penalty</h3>
    <p class="sub">For a penalty that was missed. It is recorded in the activity log.</p>
    <div class="grid g2" style="margin-top:10px">
      <div><label>Member</label><select id="apMember"><option value="">Select member…</option>${memberOptions()}</select></div>
      <div><label>Month</label><select id="apMonth">${monthOptions(MONTHS[Math.max((Number(state.settings.monthsElapsed)||1)-1,0)])}</select></div>
    </div>
    <div style="margin-top:10px"><label>Amount (R)</label><input type="number" id="apAmount" min="0" step="0.01"></div>
    <div style="margin-top:10px"><label>Reason <span class="req">*</span></label><input type="text" id="apReason" placeholder="e.g. Interest not paid in May"></div>
    <div class="btnrow">
      <button class="btn secondary" id="apCancel">Cancel</button>
      <button class="btn" id="apSave">Add penalty</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#apCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#apSave').onclick = async () => {
    const member = back.querySelector('#apMember').value;
    const month = back.querySelector('#apMonth').value;
    const amount = Number(back.querySelector('#apAmount').value) || 0;
    const reason = back.querySelector('#apReason').value.trim();
    if(!member){ toast('Select a member.', true); return; }
    if(amount <= 0){ toast('Enter an amount greater than 0.', true); return; }
    if(!reason){ toast('Give a reason.', true); return; }
    const mem = state.members.find(m => m.full === member);
    if(mem && Number(mem.fixed) === 0 && !await confirmModal('B2S-only member', 'B2S-only members are normally exempt from penalties. Add it anyway?', 'Add anyway', true)) return;
    const row = {id: uid('d'), date: todayISO()+'T00:00:00', name: member, month, year: state.settings.yearLabel,
      contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng: amount, source:'manualpenalty', note: reason};
    state.datalog.push(row);
    Store.persist();
    await Store.syncTable('mk_datalog', [row], dlToDb);
    back.remove();
    toast('Penalty added.');
    render();
  };
}


/* ---------------------------------------------------------------------
   VIEW: ACTIVITY LOG — who did what. Written by the database itself
   (triggers on every table) so it can't be skipped or edited from the app.
   --------------------------------------------------------------------- */
let activityCache = null;
let activityFilter = {user:'', table:'', text:''};

const LOG_TABLE_LABELS = {
  mk_datalog:'Ledger entry', mk_members:'Member', mk_settings:'Settings', mk_att_meetings:'Attendance',
  mk_resignations:'Resignation', mk_archives:'Year archive', mk_profiles:'User account', mk_audits:'Member audit',
  mk_bank_trips:'Bank visit', mk_bank_loans:'Bank loan'
};
const LOG_ACTION_LABELS = {INSERT:'Added', UPDATE:'Changed', DELETE:'Deleted'};
const LOG_FIELD_LABELS = {contr:'contribution', loan_rep:'loan repayment', int_pay:'interest paid', pena:'penalty paid', b2s:'B2S',
  funeral:'funeral', taken:'loan', powng:'penalty owing', pool_chg:'pool charge', fixed:'monthly contribution', name:'name', month:'month',
  role:'role', member_full:'linked member', resigned:'resigned'};

async function loadActivity(){
  try{
    activityCache = await Store.cloudFetch('mk_audit_log?select=*&order=at.desc&limit=3000') || [];
  }catch(e){
    activityCache = [];
    toast('Could not load the activity log: ' + e.message + ' (has the latest schema been run?)', true);
  }
}

function logDetail(r){
  const n = r.new_data || {}, o = r.old_data || {};
  const money = v => fmtR(Number(v)||0);
  try{
    if(r.table_name === 'mk_datalog'){
      const row = r.action==='DELETE' ? o : n;
      const bits = [];
      ['contr','loan_rep','int_pay','pena','b2s','funeral','taken','powng','pool_chg'].forEach(k => {
        if(r.action==='UPDATE'){
          if(Number(o[k]||0) !== Number(n[k]||0)) bits.push(`${LOG_FIELD_LABELS[k]} ${money(o[k])} → ${money(n[k])}`);
        } else if(Number(row[k]||0) !== 0) bits.push(`${LOG_FIELD_LABELS[k]} ${money(row[k])}`);
      });
      if(r.action==='UPDATE' && o.name !== n.name) bits.push(`member ${o.name} → ${n.name}`);
      if(r.action==='UPDATE' && o.month !== n.month) bits.push(`month ${o.month} → ${n.month}`);
      const src = row.source && row.source!=='manual' ? ` [${SOURCE_LABELS[row.source]||row.source}]` : '';
      return `${row.name||''} · ${row.month||''}${src}${bits.length?' — '+bits.join(', '):''}${n.note&&r.action!=='DELETE'?' ('+n.note+')':''}`;
    }
    if(r.table_name === 'mk_members'){
      const row = r.action==='DELETE' ? o : n;
      const bits = [];
      if(r.action==='UPDATE'){
        if(o.full_name !== n.full_name) bits.push(`renamed from ${o.full_name}`);
        if(Number(o.fixed) !== Number(n.fixed)) bits.push(`monthly contribution ${money(o.fixed)} → ${money(n.fixed)}`);
        if(!!o.resigned !== !!n.resigned) bits.push(n.resigned ? 'marked as resigned' : 'reinstated');
      } else bits.push(`monthly ${money(row.fixed)}`);
      return `${row.full_name} — ${bits.join(', ') || 'updated'}`;
    }
    if(r.table_name === 'mk_settings' && r.action==='UPDATE'){
      const a = JSON.parse(o.data||'{}'), b = JSON.parse(n.data||'{}');
      const diffs = Object.keys(Object.assign({}, a, b)).filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]));
      const nice = diffs.map(k => k==='loanExceptions' ? 'loan exceptions' : k).join(', ');
      return diffs.length ? `Changed: ${nice}` : 'Settings saved (no change)';
    }
    if(r.table_name === 'mk_profiles'){
      const row = r.action==='DELETE' ? o : n;
      return `${row.email||''}${r.action==='UPDATE' ? ` — role ${o.role} → ${n.role}${(o.member_full!==n.member_full)?', linked to '+(n.member_full||'nobody'):''}` : ''}`;
    }
    if(r.table_name === 'mk_audits'){ const row = r.action==='DELETE'?o:n; return `${row.member_full||'—'} · ${row.month||''} — ${row.overall_status||''}`; }
    if(r.table_name === 'mk_bank_trips'){ const row = r.action==='DELETE'?o:n; return `Visit on ${row.trip_date||''} (${row.sig1||'?'} & ${row.sig2||'?'})`; }
    if(r.table_name === 'mk_bank_loans'){ const row = r.action==='DELETE'?o:n; return `${row.member_name||''} — ${money(row.amount)} on ${row.trip_date||''}`; }
    if(r.table_name === 'mk_att_meetings'){ const row = r.action==='DELETE'?o:n; return `Meeting #${row.number||''} on ${row.date||''}`; }
    if(r.table_name === 'mk_archives'){ const row = r.action==='DELETE'?o:n; return `Year ${row.year||''} closed`; }
  }catch(e){ /* fall through */ }
  return r.row_id || '';
}

// Collapse bursts (e.g. 60 rows written by one bulk action) into one line.
function groupActivity(rows){
  const groups = [];
  rows.forEach(r => {
    const t = new Date(r.at).getTime();
    const g = groups[groups.length-1];
    if(g && g.user===r.user_email && g.table===r.table_name && g.action===r.action && Math.abs(g.t - t) < 15000){
      g.items.push(r); g.t = t;
    } else groups.push({user:r.user_email, table:r.table_name, action:r.action, t, at:r.at, role:r.user_role, items:[r]});
  });
  return groups;
}

    <div class="tablewrap"><table>

function wireActivity(){
  if(activityCache === null){ loadActivity().then(render); return; }
  const u = document.getElementById('actUser'); if(u) u.onchange = e => { activityFilter.user = e.target.value; render(); };

/* ---------------------------------------------------------------------
   VIEW: AUDIT TOOL  (simplified — one auditor, one checklist per month)
   --------------------------------------------------------------------- */
const AUDIT_POINTS = [
  {key:'contr',     text:"Monthly Contribution: Was the member's consistent contribution amount met?"},
  {key:'b2s',       text:"Back 2 School: Was the B2S minimum contribution met (if applicable)?"},
  {key:'loanrec',   text:"Loan: Was the loan correctly recorded when taken?"},
  {key:'loanout',   text:"Loans: Is the outstanding loan amount correctly recorded?"},
  {key:'loanlimit', text:"Loans: Is the loan amount within the club's limit relative to annual contribution?"},
  {key:'penrule',   text:"Penalties: Are penalties applied according to the rules?"},
  {key:'penrec',    text:"Penalties: Are all incurred penalties correctly recorded?"},
  {key:'general',   text:"General: Are all transactions for the period accurately reflected?"},
  {key:'penpay',    text:"Penalty Payments: Have all outstanding penalties been paid?"},
  {key:'intpay',    text:"Interest Payments: Have all interest payments been made and recorded?"},
];

// The checklist used for every new audit. The admin can change it for good
// (Audit > "Save as standard checklist"); the auditor can also reword, add or
// remove points for the single audit they are working on.
function standardAuditPoints(){
  const custom = state.settings.auditPoints;
  return (Array.isArray(custom) && custom.length ? custom : AUDIT_POINTS).map(p => ({key:p.key||'', text:p.text}));
}

let auditMemberFull = null;
let auditMonthLabel = null;
let auditDraft = null; // {answers:[{key,point,answer,comment,auto}], signedOffBy, id}
let auditHistoryCache = null;

function parseAuditLabel(label){
  const m = /^Q([1-4])\s+(\d{4})$/.exec(String(label||'').trim());
  if(m){ const q = auditQuarters()[Number(m[1])-1]; return {quarter:true, qid:q.id, months:q.months, year:Number(m[2]), text:q.label}; }
  const parts = String(label||'').split(' ');
  return {quarter:false, qid:null, months:[parts[0]], year:Number(parts[1]), text:String(label||'')};
}
function quarterAuditLabel(qid){ return 'Q' + qid.slice(1) + ' ' + (state.settings.yearLabel||''); }
// The audit period offered by default: the quarter we are currently in.
function currentAuditMonthLabel(){
  const idx = Math.max((Number(state.settings.monthsElapsed)||1)-1, 0);
  const q = auditQuarters().find(x => x.months.includes(MONTHS[idx])) || auditQuarters()[0];
  return quarterAuditLabel(q.id);
}

async function loadAuditHistory(){
  try{
    auditHistoryCache = await Store.cloudFetch('mk_audits?select=*&order=updated_at.desc') || [];
  }catch(e){
    auditHistoryCache = [];
  }
}

function missedTierAmount(member){
  const s = state.settings;
  return member.fixed > s.t2Cutoff ? s.t3 : (member.fixed > s.t1Cutoff ? s.t2 : s.t1);
}

// Fills the checklist from the member's own records. Every answer is only a
// suggestion — the auditor can change any answer, comment or point.
function prefillAudit(member, monthLabel, points){
  // The audit covers a whole period: a quarter (Q1 Dec–Feb, Q2 Mar–May, Q3 Jun–Aug, Q4 Sep–Nov) or, for older
  // audits saved per month, a single month. Everything below looks at every month of that period.
  const per = parseAuditLabel(monthLabel);
  const yr = per.year;
  const elapsed = Number(state.settings.monthsElapsed)||0;
  const snap = memberMonthSnapshot(member.full, monthLabel);           // whole period
  const snapOf = (mn) => memberMonthSnapshot(member.full, mn + ' ' + yr);
  const row = computeMemberRow(member);
  const fixed = Number(member.fixed)||0;
  const R = fmtR;
  const A = (answer, comment) => ({answer, comment, auto:true});
  const livePerMonths = per.months.filter(mn => fiscalIndex(mn) <= elapsed);      // months of the period that have happened
  const lastIdx = livePerMonths.length ? Math.max(...livePerMonths.map(fiscalIndex)) : 0;
  const future = livePerMonths.length === 0;
  const cumTo = (idx) => row.entries.filter(e => fiscalIndex(e.month) <= idx).reduce((x,e)=>x+(Number(e.contr)||0),0);
  const firstLoanIdx = (() => { const t = row.entries.filter(e => Number(e.taken)>0).map(e => fiscalIndex(e.month)); return t.length ? Math.min(...t) : null; })();
  const listM = arr => arr.join(', ');
  const calc = {
    contr(){
      if(fixed===0) return A('NA','B2S-only member — no monthly contribution.');
      if(future) return A('NA','This period has not happened yet.');
      const short = livePerMonths.filter(mn => cumTo(fiscalIndex(mn)) < fixed*fiscalIndex(mn) - 0.005);
      const perMonth = livePerMonths.map(mn => `${mn} ${R(snapOf(mn).contr)}`).join(', ');
      if(!short.length) return A('Y', `Contribution of ${R(fixed)} a month met for ${listM(livePerMonths)} (paid in the period: ${perMonth}; ${R(cumTo(lastIdx))} paid to date).`);
      return A('N', `Short in ${listM(short)} against ${R(fixed)} a month (paid in the period: ${perMonth}; ${R(cumTo(lastIdx))} paid to date).`);
    },
    b2s(){
      if(snap.b2s > 0 || row.b2sTotal > 0) return A('Y', `B2S recorded: ${R(snap.b2s)} in the period, ${R(row.b2sTotal)} to date.`);
      if(fixed===0) return A('N','B2S-only member but no B2S payment is recorded.');
      return A('NA','No B2S recorded for this member.');
    },
    loanrec(){
      return snap.taken > 0 ? A('Y', `Loan(s) of ${R(snap.taken)} recorded in the period.`) : A('NA','No loan taken in the period.');
    },
    loanout(){
      return row.loanBalance > 0 ? A('Y', `Balance ${R(row.loanBalance)} (taken ${R(entriesFor(member.full).reduce((x,e)=>x+(Number(e.taken)||0),0))}, repaid ${R(row.loanRepaid)}).`) : A('NA','No outstanding loan.');
    },
    loanlimit(){
      if(row.loanBalance <= 0) return A('NA','No outstanding loan.');
      const {cap, base} = loanCapFor(member);
      if(row.loanBalance <= cap + 0.005) return A('Y', `Loan ${R(row.loanBalance)} is within the ${loanCapPct()}% limit of ${R(cap)} (based on ${R(base)}).`);
      const ex = loanExceptionsFor(member.full)[0];
      if(ex) return A('Y', `Above the limit of ${R(cap)}, but covered by an admin exception (${ex.reason}).`);
      return A('N', `Loan ${R(row.loanBalance)} is above the ${loanCapPct()}% limit of ${R(cap)}, with no exception on record.`);
    },
    penrule(){
      if(fixed===0) return A('NA','B2S-only members are exempt from penalties.');
      const months = livePerMonths.filter(mn => !isNoPenaltyMonth(mn));        // the club's penalty-free month carries no penalties
      if(!months.length) return A('NA', future ? 'This period has not happened yet.' : 'The penalty-free month carries no penalties.');
      const bad = [], ok = [], odd = [];
      months.forEach(mn => {
        const sn = snapOf(mn);
        const paid = sn.entries.filter(e => Number(e.contr)>0).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
        const timing = contributionTiming(mn, paid.length ? paid[0].date : todayISO());
        let expect = 0, why = '';
        if(timing === 'missed'){ expect = missedTierAmount(member); why = paid.length ? `paid ${dayMonth(paid[0].date)}, after the ${ordDay(dueLateDay())}` : `not paid by the ${ordDay(dueLateDay())} of the following month`; }
        else if(timing === 'late'){ expect = Number(state.settings.late)||0; why = paid.length ? `paid ${dayMonth(paid[0].date)}, between the ${ordDay(dueOnTimeDay()+1)} and ${ordDay(dueLateDay())}` : `not paid yet, past the ${ordDay(dueOnTimeDay())} of the following month`; }
        if(expect > 0){ (sn.powng > 0 ? ok : bad).push(`${mn}: ${why}${sn.powng>0 ? ', penalty '+R(sn.powng) : ', no penalty recorded'}`); }
        else if(sn.powng > 0) odd.push(`${mn}: penalty ${R(sn.powng)} although the payment looks on time (check the reason)`);
      });
      if(bad.length) return A('N', `${bad.join('; ')}. (check it was not an advance payment)`);
      if(odd.length) return {answer:'', comment: odd.join('; '), auto:true};
      return A('Y', ok.length ? `Penalties applied correctly: ${ok.join('; ')}.` : 'Paid on time in every month; no penalty due.');
    },
    penrec(){
      if(snap.powng > 0) return A('Y', `Recorded: ${R(snap.powng)} — ${snap.entries.filter(e=>Number(e.powng)>0).map(e=>e.month+' '+penaltyReason(e)).join('; ')}.`);
      return A('NA','No penalties in the period.');
    },
    general(){
      return snap.entries.length ? A('Y', `${snap.entries.length} ledger entr${snap.entries.length===1?'y':'ies'} in the period.`) : A('NA','No transactions in the period.');
    },
    penpay(){
      return row.penaltiesOwed > 0.005 ? A('N', `${R(row.penaltiesOwed)} of penalties still outstanding.`) : A('Y','No penalties outstanding.');
    },
    intpay(){
      if(row.loanBalance <= 0) return A('NA','No outstanding loan.');
      const months = livePerMonths.filter(mn => firstLoanIdx === null || fiscalIndex(mn) >= firstLoanIdx);
      if(!months.length) return A('NA','The loan was taken after this period.');
      const missing = months.filter(mn => !(snapOf(mn).intPay > 0));
      return missing.length ? A('N', `Loan outstanding but no interest paid in ${listM(missing)} (interest paid in the period: ${R(snap.intPay)}).`)
                            : A('Y', `Interest paid in every month (${R(snap.intPay)} in the period).`);
    },
  };
  return points.map(p => {
    const f = p.key && calc[p.key];
    const a = f ? f() : {answer:'', comment:'', auto:false};
    return {key:p.key||'', point:p.text, answer:a.answer, comment:a.comment, auto:!!a.auto};
  });
}

function ensureAuditDraft(){
  if(!auditMonthLabel) auditMonthLabel = currentAuditMonthLabel();
  if(!auditDraft){
    const existing = (auditHistoryCache||[]).find(a => a.month === auditMonthLabel && a.member_full === auditMemberFull);
    if(existing){
      const saved = JSON.parse(existing.answers);
      auditDraft = {
        answers: saved.map((a,i) => ({key:a.key||'', point:a.point || (AUDIT_POINTS[i]?AUDIT_POINTS[i].text:''), answer:a.answer||'', comment:a.comment||'', auto:!!a.auto})),
        signedOffBy: existing.signed_off_by||'', id: existing.id
      };
    } else {
      const member = state.members.find(m => m.full === auditMemberFull);
      auditDraft = {
        answers: member ? prefillAudit(member, auditMonthLabel, standardAuditPoints())
                        : standardAuditPoints().map(p => ({key:p.key, point:p.text, answer:'', comment:'', auto:false})),
        signedOffBy: '', id: null
      };
    }
  }
  return auditDraft;
}

// The member's actual DataLog activity for the month being audited — shown
// alongside the checklist so the auditor has real numbers to check against,
// not just their memory.
function memberMonthSnapshot(memberFull, monthLabel){
  const months = parseAuditLabel(monthLabel).months;      // a quarter (3 months) or a single month
  const entries = state.datalog.filter(d => d.name===memberFull && months.includes(d.month));
  const sum = (k) => entries.reduce((s,e)=>s+(Number(e[k])||0),0);
  return {
    contr:sum('contr'), loanRep:sum('loanRep'), intPay:sum('intPay'), pena:sum('pena'),
    b2s:sum('b2s'), funeral:sum('funeral'), taken:sum('taken'), powng:sum('powng'), entries
  };
}

function wireMemberAudit(){

    if(!await confirmModal('Re-fill from records', 'Replace the answers and comments with fresh suggestions from this member\'s records? Your own answers will be overwritten (the point wording is kept).', 'Re-fill', true)) return;
    const draft = ensureAuditDraft();
    const member = state.members.find(m => m.full === auditMemberFull);
    const fresh = prefillAudit(member, auditMonthLabel, draft.answers.map(a => ({key:a.key, text:a.point})));

  };

    if(!await confirmModal('Reset to standard points', 'Go back to the standard checklist and fresh answers from the records?', 'Reset', true)) return;
    auditDraft = null;
    const existingIdx = (auditHistoryCache||[]).findIndex(a => a.month === auditMonthLabel && a.member_full === auditMemberFull);
    const member = state.members.find(m => m.full === auditMemberFull);
    auditDraft = {answers: prefillAudit(member, auditMonthLabel, standardAuditPoints()), signedOffBy:'', id: existingIdx>=0 ? auditHistoryCache[existingIdx].id : null};
    render();
  };
  const saveStd = document.getElementById('saveStdBtn');
  if(saveStd) saveStd.onclick = async () => {
    const draft = ensureAuditDraft();
    const pts = draft.answers.map(a => ({key:a.key||'', text:a.point})).filter(p => p.text.trim());
    if(!pts.length){ toast('The checklist is empty.', true); return; }
    if(!await confirmModal('Save as standard checklist', `Use these ${pts.length} points for every new audit from now on?`, 'Save', false)) return;
    state.settings.auditPoints = pts;
    await saveSettingsCloud();
    toast('Standard checklist saved.');
  };

  document.querySelectorAll('[data-openaudit-month]').forEach(row => {
    row.onclick = () => {
      auditMemberFull = row.dataset.openauditMember || null;
      auditMonthLabel = row.dataset.openauditMonth;
      auditDraft = null;
      render();
    };
  });

  const exportBtn = document.getElementById('exportAuditBtn');
  if(exportBtn) exportBtn.onclick = () => exportPdf('portrait');

  const saveBtn = document.getElementById('saveAuditBtn');
  if(saveBtn) saveBtn.onclick = async () => {
    const draft = ensureAuditDraft();
    const signedOffBy = document.getElementById('auditSignoff').value.trim();
    draft.signedOffBy = signedOffBy;
    const allAnswered = draft.answers.length > 0 && draft.answers.every(a => a.answer);
    const record = {
      id: draft.id || uid('au'),
      month: auditMonthLabel,
      member_full: auditMemberFull,
      answers: JSON.stringify(draft.answers),
      overall_status: allAnswered ? 'Complete' : 'Incomplete',
      auditor_name: signedOffBy,
      signed_off_by: signedOffBy,
      signed_off_date: todayISO(),
    };
    try{
      await Store.cloudFetch('mk_audits?on_conflict=club_id,id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates'}, body: JSON.stringify([record])});
      toast('Audit saved.');
      await loadAuditHistory();
      auditDraft = null;
      render();
    }catch(e){
      toast('Could not save audit: ' + e.message, true);
    }
  };
}

/* ---------------------------------------------------------------------
   AUDIT SUMMARY — one place to pull the executive (member) audits by quarter and the
   bank visits for the same period. Quarters follow the club's financial year (three months each). Bank audits happen on every bank visit,
   so every visit in the period is listed.
   --------------------------------------------------------------------- */
// Quarters are three months each, counted from the start of the club's financial year (the club may start in any month).
function auditQuarters(){
  return [0,1,2,3].map(i => { const ms = MONTHS.slice(i*3, i*3+3);
    return {id:'q'+(i+1), label:'Q'+(i+1)+' ('+ms[0]+'–'+ms[2]+')', months:ms}; });
}
const CAL_MONTHS = MON_SHORT;
let sumYear = null, sumPeriod = null;

function fiscalOfDate(iso){            // {fy, month, q} for a calendar date; December belongs to the NEXT financial year
  const p = String(iso||'').slice(0,10).split('-').map(Number);
  if(p.length < 3 || !p[0] || !p[1]) return null;
  const month = CAL_MONTHS[p[1]-1];
  const q = auditQuarters().find(x => x.months.includes(month));
  const sm = startMonth();                                  // the financial year is named after the year it ends in
  return {fy: (sm > 1 && p[1] >= sm) ? p[0]+1 : p[0], month, q: q ? q.id : null};
}
function summaryDefaults(){
  if(sumYear === null){
    const f = fiscalOfDate(todayISO());
    sumYear = Number(state.settings.yearLabel) || (f && f.fy) || new Date().getFullYear();
    sumPeriod = (f && f.fy === sumYear && f.q) ? f.q : 'year';
  }
}
function periodMonths(){ const q = auditQuarters().find(x => x.id===sumPeriod); return q ? q.months : MONTHS; }
function periodLabel(){ const q = auditQuarters().find(x => x.id===sumPeriod); return (q ? q.label : 'Full year (' + MONTHS[0] + '–' + MONTHS[11] + ')') + ' · financial year ' + sumYear; }

function memberAuditSummaryData(){
  const months = periodMonths();
  const recs = (auditHistoryCache||[]).map(a => {
    const per = parseAuditLabel(a.month);
    let answers = []; try{ answers = JSON.parse(a.answers||'[]'); }catch(e){}
    return Object.assign({}, a, {mName: per.quarter ? ('Q'+per.qid.slice(1)) : per.months[0], mYear: per.year, per, list: answers});
  }).filter(a => a.mYear === sumYear && (a.per.quarter ? (sumPeriod==='year' || a.per.qid===sumPeriod) : months.includes(a.mName)));
  const execs = executiveMembers();
  const execNames = new Set(execs.map(x => x.m.full));
  const tally = a => ({
    yes: a.list.filter(x => x.answer==='Y').length, no: a.list.filter(x => x.answer==='N').length,
    na: a.list.filter(x => x.answer==='NA').length, open: a.list.filter(x => !x.answer).length,
    issues: a.list.filter(x => x.answer==='N').map(x => ({point:x.point, comment:x.comment||''}))
  });
  const build = (full, role) => {
    const ord = a => a.per.quarter ? Number(a.per.qid.slice(1))*10 : (Math.floor((fiscalIndex(a.mName)-1)/3)+1)*10+fiscalIndex(a.mName)%3+1;
    const mine = recs.filter(a => a.member_full === full).sort((a,b)=>ord(a)-ord(b));
    return {full, role, audits: mine.map(a => Object.assign({month:a.mName, status:a.overall_status||'Incomplete', by:a.signed_off_by||a.auditor_name||'', date:a.signed_off_date||''}, tally(a)))};
  };
  const execRows = execs.map(x => build(x.m.full, x.e.role));
  const otherNames = [...new Set(recs.map(a => a.member_full).filter(n => n && !execNames.has(n)))].sort();
  const otherRows = otherNames.map(n => build(n, ''));
  return {execRows, otherRows};
}

function bankSummaryData(){
  const months = periodMonths();
  const trips = (bankTripsCache||[]).filter(t => { const f = fiscalOfDate(t.trip_date); return f && f.fy === sumYear && months.includes(f.month); })
    .slice().sort((a,b)=>String(a.trip_date).localeCompare(String(b.trip_date)));
  const visits = trips.map(t => {
    const loans = loansForTripDate(t.trip_date);
    const loanTot = loans.reduce((x,l)=>x+(Number(l.amount)||0),0);
    const notice = Number(t.notice_transfer)||0, misc = Number(t.misc_amount)||0, petrol = Number(t.petrol)||0;
    return {t, loans, loanTot, notice, misc, petrol, outflow: loanTot+notice+misc+petrol, valid: tripValid(t)};
  });
  const sig = {};
  visits.forEach(v => [['sig1',v.t.sig1],['sig2',v.t.sig2]].forEach(([k,n]) => { if(!n) return; sig[n] = sig[n] || {n:0, s1:0, s2:0}; sig[n].n++; sig[n][k==='sig1'?'s1':'s2']++; }));
  const sum = k => visits.reduce((x,v)=>x+v[k],0);
  return {visits, sig, totals:{count:visits.length, valid:visits.filter(v=>v.valid).length, loans:visits.reduce((x,v)=>x+v.loans.length,0),
    loanTot:sum('loanTot'), notice:sum('notice'), misc:sum('misc'), petrol:sum('petrol'), outflow:sum('outflow')}};
}

function csvCell(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(name, rows){
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

    </div>
  </div>
  ${auditSubTab==='member' ? viewMemberAudit() : auditSubTab==='bank' ? viewBankAudit() : auditSubTab==='summary' ? viewAuditSummary() : auditSubTab==='penalties' ? viewPenalties({readonly:true}) : viewActivity()}`;
}

function wireAudit(){
  document.querySelectorAll('[data-audittab]').forEach(btn => {
    btn.onclick = () => { auditSubTab = btn.dataset.audittab; if(auditSubTab==='activity') activityCache = null; render(); };
  });
  if(auditSubTab==='member') wireMemberAudit();
  else if(auditSubTab==='bank') wireBankAudit();
  else if(auditSubTab==='summary') wireAuditSummary();
  else if(auditSubTab==='penalties') wirePenalties();
  else wireActivity();
}

/* ---------------------------------------------------------------------
   BANK AUDIT — bank-trip register + loan-disbursement register + dashboard.
   A loan disbursed here also creates a real "Loan" entry in DataLog, so the
   member's balance and interest are correct in the main ledger too — this
   isn't a separate silo of numbers, it's another way of logging the same
   underlying loan.
   --------------------------------------------------------------------- */
let bankTripsCache = null;
let bankLoansCache = null;
let bankTripOpen = null; // id of the bank visit being viewed in detail

async function loadBankAuditData(){
  try{
    const [trips, loans] = await Promise.all([
      Store.cloudFetch('mk_bank_trips?select=*&order=trip_date.desc'),
      Store.cloudFetch('mk_bank_loans?select=*&order=trip_date.desc'),
    ]);
    bankTripsCache = trips || [];
    bankLoansCache = loans || [];
  }catch(e){
    bankTripsCache = []; bankLoansCache = [];
    toast('Could not load bank audit data: ' + e.message, true);
  }
}

function loansForTripDate(date){
  return (bankLoansCache||[]).filter(l => l.trip_date === date);
}

function clubFileSlug(){ return String((state.settings&&state.settings.clubName)||'club').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'club'; }
function signatoryOptions(){
  const list = (state.settings.bankSignatories && state.settings.bankSignatories.length)
    ? state.settings.bankSignatories : [];
  return list.map(n => `<option value="${escapeHtml(n)}">`).join('');
}

function tripValid(t){ return !!(t.sig1 && t.sig2 && t.sig1 !== t.sig2); }

function viewBankTripDetail(){
  const trips = bankTripsCache;
  const i = trips.findIndex(x => x.id === bankTripOpen);
  if(i < 0){ bankTripOpen = null; return viewBankAudit(); }
  const t = trips[i];
  const loans = loansForTripDate(t.trip_date);
  const loanTot = loans.reduce((s,l)=>s+(Number(l.amount)||0),0);
  const outflow = loanTot + (Number(t.notice_transfer)||0) + (Number(t.misc_amount)||0) + (Number(t.petrol)||0);
  const valid = tripValid(t);
  const newer = trips[i-1], older = trips[i+1];
  const inLedger = (l) => state.datalog.some(d => d.name===l.member_name && d.source==='banktrip' && String(d.date).slice(0,10)===l.trip_date && Math.abs((Number(d.taken)||0) - (Number(l.amount)||0)) < 0.005);
  const sameDay = trips.filter(x => x.trip_date === t.trip_date).length > 1;
  return `
  <div class="card" id="bankTripArea">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <h2><span class="dot"></span>Bank visit — ${fmtDate(t.trip_date)} ${valid ? '<span class="pill green">✓ Valid</span>' : '<span class="pill red">⚠ Incomplete</span>'}</h2>
      <div class="btnrow no-print">
        <button class="btn secondary sm" id="tripBackBtn">← All visits</button>
        ${older ? `<button class="btn secondary sm" data-gotrip="${older.id}">← Earlier</button>` : ''}
        ${newer ? `<button class="btn secondary sm" data-gotrip="${newer.id}">Later →</button>` : ''}
        <button class="btn secondary sm" id="tripEditBtn">${icon('edit',13)} Edit</button>
        ${canManage() ? `<button class="btn danger sm" id="tripDeleteBtn">${icon('trash',13)} Delete</button>` : ''}
        <button class="btn secondary sm" id="tripExportBtn">${icon('printer',13)} Export PDF</button>
      </div>
    </div>
    ${sameDay ? `<p class="sub" style="color:var(--orange)">More than one visit is logged on this date, so the loans below are shared between them.</p>` : ''}
    <div class="grid g4" style="margin:14px 0">
      <div class="kpi"><div class="v">${fmtR(loanTot)}</div><div class="l">Loans disbursed (${loans.length})</div></div>
      <div class="kpi"><div class="v">${fmtR(t.notice_transfer)}</div><div class="l">Notice account transfer</div></div>
      <div class="kpi"><div class="v">${fmtR(t.misc_amount)}</div><div class="l">Misc${t.misc_desc?' — '+escapeHtml(t.misc_desc):''}</div></div>
      <div class="kpi"><div class="v">${fmtR(t.petrol)}</div><div class="l">Petrol</div></div>
    </div>
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><div class="v">${fmtR(outflow)}</div><div class="l">Total outflow this visit</div></div>
      <div class="kpi"><div class="v" style="font-size:16px">${escapeHtml(t.sig1||'—')}<br>${escapeHtml(t.sig2||'—')}</div><div class="l">Signatories</div></div>
      <div class="kpi"><div class="v" style="font-size:16px">${escapeHtml(whoShort(t.created_by)||'—')}</div><div class="l">Logged by${t.created_at?' · '+fmtDate(t.created_at):''}</div></div>
    </div>
    ${t.notes ? `<p><b>Notes:</b> ${escapeHtml(t.notes)}</p>` : ''}
    ${!valid ? `<p class="sub" style="color:var(--red)">A bank visit needs two different signatories to be valid.</p>` : ''}
    <h2 style="margin-top:18px"><span class="dot"></span>Loans disbursed on this visit</h2>
    ${loans.length===0 ? `<div class="empty">No loans were disbursed on this visit.</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Member</th><th class="num">Amount</th><th>Notes</th><th>Logged by</th><th>Main ledger</th></tr></thead>
      <tbody>${loans.map(l => `<tr><td>${escapeHtml(l.member_name)}</td><td class="num">${fmtR(l.amount)}</td><td>${escapeHtml(l.notes||'—')}</td>
        <td>${escapeHtml(whoShort(l.created_by)||'—')}</td>
        <td>${inLedger(l) ? '<span class="pill green">✓ Recorded</span>' : '<span class="pill red">⚠ Not found in ledger</span>'}</td></tr>`).join('')}
      <tr class="tot-row"><td>Total</td><td class="num">${fmtR(loanTot)}</td><td colspan="3"></td></tr></tbody>
    </table></div>`}
  </div>`;
}

function openTripEditModal(t){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Edit bank visit — ${fmtDate(t.trip_date)}</h3>
    <div class="grid g2" style="margin-top:10px">
      <div><label>Signatory 1</label><input type="text" id="teSig1" list="sigList" value="${escapeHtml(t.sig1||'')}"></div>
      <div><label>Signatory 2</label><input type="text" id="teSig2" list="sigList" value="${escapeHtml(t.sig2||'')}"></div>
      <datalist id="sigList">${signatoryOptions()}</datalist>
      <div><label>Notice Acct Transfer (R)</label><input type="number" id="teNotice" value="${Number(t.notice_transfer)||0}"></div>
      <div><label>Petrol (R)</label><input type="number" id="tePetrol" value="${Number(t.petrol)||0}"></div>
      <div><label>Misc Description</label><input type="text" id="teMiscDesc" value="${escapeHtml(t.misc_desc||'')}"></div>
      <div><label>Misc Amount (R)</label><input type="number" id="teMiscAmt" value="${Number(t.misc_amount)||0}"></div>
    </div>
    <div style="margin-top:10px"><label>Notes</label><input type="text" id="teNotes" value="${escapeHtml(t.notes||'')}"></div>
    <div class="btnrow">
      <button class="btn secondary" id="teCancel">Cancel</button>
      <button class="btn" id="teSave">Save changes</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#teCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#teSave').onclick = async () => {
    const g = id => back.querySelector('#'+id).value;
    const patch = {
      sig1: g('teSig1').trim(), sig2: g('teSig2').trim(),
      notice_transfer: Number(g('teNotice'))||0, petrol: Number(g('tePetrol'))||0,
      misc_desc: g('teMiscDesc').trim(), misc_amount: Number(g('teMiscAmt'))||0, notes: g('teNotes').trim(),
    };
    if(!patch.sig1 || !patch.sig2 || patch.sig1===patch.sig2){ toast('Enter two different signatories — minimum 2 required.', true); return; }
    try{
      await Store.cloudFetch('mk_bank_trips?id=eq.' + encodeURIComponent(t.id), {method:'PATCH', body: JSON.stringify(patch)});
      back.remove(); toast('Bank visit updated.');
      await loadBankAuditData(); render();
    }catch(e){ toast('Could not save: ' + e.message, true); }
  };
}

function viewBankAudit(){
  if(bankTripsCache === null){
    return `<div class="card"><p class="sub">Loading bank audit data…</p></div>`;
  }
  if(bankTripOpen) return viewBankTripDetail();
  const trips = bankTripsCache;
  const loans = bankLoansCache;

  const tripCount = trips.length;
  const loanCount = loans.length;
  const totalLoans = loans.reduce((s,l)=>s+(Number(l.amount)||0),0);
  const totalNotice = trips.reduce((s,t)=>s+(Number(t.notice_transfer)||0),0);
  const totalPetrol = trips.reduce((s,t)=>s+(Number(t.petrol)||0),0);
  const totalMisc = trips.reduce((s,t)=>s+(Number(t.misc_amount)||0),0);
  const totalOutflows = totalLoans + totalNotice + totalMisc + totalPetrol;

  const sigStats = {};
  trips.forEach(t => {
    [t.sig1, t.sig2].forEach((name,i) => {
      if(!name) return;
      if(!sigStats[name]) sigStats[name] = {trips:0, asSig1:0, asSig2:0};
      sigStats[name].trips++;
      if(i===0) sigStats[name].asSig1++; else sigStats[name].asSig2++;
    });
  });
  const sigNames = Object.keys(sigStats).sort();

  return `
  <div class="card no-print">
    <h2><span class="dot"></span>Log a bank visit</h2>
    <p class="sub">One row per bank visit. Minimum 2 signatories required. Petrol defaults to R200/trip, shared.</p>
    <div class="grid g3">
      <div><label>Date</label><input type="date" id="btDate" value="${todayISO()}"></div>
      <div><label>Signatory 1</label><input type="text" id="btSig1" list="sigList"></div>
      <div><label>Signatory 2</label><input type="text" id="btSig2" list="sigList"></div>
      <datalist id="sigList">${signatoryOptions()}</datalist>
      <div><label>Notice Acct Transfer (R)</label><input type="number" id="btNotice" value="0"></div>
      <div><label>Misc Description</label><input type="text" id="btMiscDesc" placeholder="e.g. Venue fee"></div>
      <div><label>Misc Amount (R)</label><input type="number" id="btMiscAmt" value="0"></div>
      <div><label>Petrol (R)</label><input type="number" id="btPetrol" value="200"></div>
      <div style="grid-column:span 2"><label>Notes</label><input type="text" id="btNotes"></div>
    </div>
    <div class="btnrow" style="margin-top:14px"><button class="btn" id="addTripBtn">${icon('plus',15)} Log visit</button></div>
  </div>

  ${!(canManage() || Auth.isAuditor()) ? `<div class="card no-print"><h2><span class="dot"></span>Loans disbursed</h2><p class="sub">Loans are logged by the admin or the auditor, because each one also becomes a real Loan entry in the main ledger. You can open any bank visit below to see its loans and check they appear in the ledger.</p></div>` : `
  <div class="card no-print">
    <h2><span class="dot"></span>Log a loan disbursed</h2>
    <p class="sub">Trip Date must match a logged bank visit above. This also records a real "Loan" against the member in the main ledger.</p>
    <div class="grid g3">
      <div><label>Trip Date</label><select id="blTripDate">${trips.map(t=>`<option value="${t.trip_date}">${fmtDate(t.trip_date)}</option>`).join('') || '<option value="">No trips logged yet</option>'}</select></div>
      <div><label>Member</label><select id="blMember"><option value="">Select member…</option>${memberOptions()}</select></div>
      <div><label>Loan Amount (R)</label><input type="number" id="blAmount" value="0"></div>
      <div style="grid-column:span 3"><label>Notes</label><input type="text" id="blNotes"></div>
    </div>
    <div class="btnrow" style="margin-top:14px"><button class="btn" id="addLoanBtn">${icon('plus',15)} Log loan</button></div>
  </div>`}

  <div style="display:flex;justify-content:flex-end;margin-bottom:8px" class="no-print">
    <button class="btn secondary" id="exportBankAuditBtn">${icon('printer',15)} Export PDF report</button>
  </div>

  <div class="grid g4" style="margin-bottom:18px">
    <div class="kpi"><div class="v">${tripCount}</div><div class="l">Bank trips</div></div>
    <div class="kpi"><div class="v">${loanCount}</div><div class="l">Loans disbursed</div></div>
    <div class="kpi"><div class="v">${fmtR(totalLoans)}</div><div class="l">Total loans (R)</div></div>
    <div class="kpi"><div class="v">${fmtR(totalNotice)}</div><div class="l">Notice Acct (R)</div></div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>Trip Register</h2>
    <p class="sub no-print">Click a visit to see its full details.</p>
    ${trips.length===0 ? `<div class="empty">No bank visits logged yet.</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Signatory 1</th><th>Signatory 2</th><th class="num">Notice Acct</th><th>Misc</th>
      <th class="num">Misc Amt</th><th class="num" style="color:var(--orange)">Loans Disbursed</th><th class="num">Petrol</th><th>Status</th><th class="no-print"></th></tr></thead>
      <tbody>${trips.map(t => {
        const tripLoans = loansForTripDate(t.trip_date).reduce((s,l)=>s+(Number(l.amount)||0),0);
        const valid = t.sig1 && t.sig2 && t.sig1 !== t.sig2;
        return `<tr style="cursor:pointer" data-opentrip="${escapeHtml(t.id)}" title="Open this visit">
          <td>${fmtDate(t.trip_date)}</td><td>${escapeHtml(t.sig1||'—')}</td><td>${escapeHtml(t.sig2||'—')}</td>
          <td class="num">${fmtR(t.notice_transfer)}</td><td>${escapeHtml(t.misc_desc||'—')}</td>
          <td class="num">${fmtR(t.misc_amount)}</td><td class="num" style="color:var(--orange)">${fmtR(tripLoans)}</td>
          <td class="num">${fmtR(t.petrol)}</td>
          <td>${valid ? '<span class="pill green">✓ Valid</span>' : '<span class="pill red">⚠ Incomplete</span>'}</td>
          <td class="no-print"><button class="btn secondary sm" data-opentrip="${escapeHtml(t.id)}">View details</button></td>
        </tr>`;
      }).join('')}
      <tr class="tot-row"><td colspan="3">Totals</td><td class="num">${fmtR(totalNotice)}</td><td></td>
        <td class="num">${fmtR(totalMisc)}</td><td class="num">${fmtR(totalLoans)}</td><td class="num">${fmtR(totalPetrol)}</td><td></td><td class="no-print"></td></tr>
      </tbody>
    </table></div>`}
  </div>

  <div class="card">
    <h2><span class="dot"></span>Loan Register</h2>
    ${loans.length===0 ? `<div class="empty">No loans disbursed yet.</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Trip Date</th><th>Member</th><th class="num">Loan Amount</th><th>Notes</th></tr></thead>
      <tbody>${loans.map(l => `<tr style="cursor:pointer" title="Open this bank visit" data-opentripdate="${escapeHtml(l.trip_date)}"><td>${fmtDate(l.trip_date)}</td><td>${escapeHtml(l.member_name)}</td>
        <td class="num">${fmtR(l.amount)}</td><td>${escapeHtml(l.notes||'—')}</td></tr>`).join('')}
      <tr class="tot-row"><td colspan="2">Total Loans Disbursed</td><td class="num">${fmtR(totalLoans)}</td><td></td></tr>
      </tbody>
    </table></div>`}
  </div>

  <div class="card">
    <h2><span class="dot"></span>Signatory Attendance</h2>
    ${sigNames.length===0 ? `<div class="empty">No trips logged yet.</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Signatory</th><th class="num">Trips attended</th><th class="num">As Sig 1</th><th class="num">As Sig 2</th></tr></thead>
      <tbody>${sigNames.map(n => `<tr><td>${escapeHtml(n)}</td><td class="num">${sigStats[n].trips}</td>
        <td class="num">${sigStats[n].asSig1}</td><td class="num">${sigStats[n].asSig2}</td></tr>`).join('')}</tbody>
    </table></div>`}
  </div>

  <div class="card">
    <h2><span class="dot"></span>Outflow Summary</h2>
    <div class="tablewrap"><table><tbody>
      <tr><td>Loans disbursed</td><td class="num">${fmtR(totalLoans)}</td></tr>
      <tr><td>Notice account transfers</td><td class="num">${fmtR(totalNotice)}</td></tr>
      <tr><td>Miscellaneous</td><td class="num">${fmtR(totalMisc)}</td></tr>
      <tr><td>Petrol</td><td class="num">${fmtR(totalPetrol)}</td></tr>
      <tr class="tot-row"><td>Total outflows</td><td class="num">${fmtR(totalOutflows)}</td></tr>
    </tbody></table></div>
  </div>`;
}

function wireBankAudit(){
  if(bankTripsCache === null){
    loadBankAuditData().then(render);
    return;
  }

  if(bankTripOpen){
    document.getElementById('tripBackBtn').onclick = () => { bankTripOpen = null; render(); };
    document.querySelectorAll('[data-gotrip]').forEach(b => b.onclick = () => { bankTripOpen = b.dataset.gotrip; render(); window.scrollTo({top:0}); });
    document.getElementById('tripExportBtn').onclick = () => exportPdf('portrait');
    document.getElementById('tripEditBtn').onclick = () => { const t = bankTripsCache.find(x => x.id===bankTripOpen); if(t) openTripEditModal(t); };
    const del = document.getElementById('tripDeleteBtn');
    if(del) del.onclick = async () => {
      const t = bankTripsCache.find(x => x.id===bankTripOpen); if(!t) return;
      if(loansForTripDate(t.trip_date).length){ toast('This visit has loans logged against it — they must stay on record. Edit it instead.', true); return; }
      if(!await confirmModal('Delete bank visit', `Delete the visit on ${fmtDate(t.trip_date)}? This is recorded in the activity log.`, 'Delete', true)) return;
      try{ await Store.cloudFetch('mk_bank_trips?id=eq.' + encodeURIComponent(t.id), {method:'DELETE'}); bankTripOpen = null; toast('Visit deleted.'); await loadBankAuditData(); render(); }
      catch(e){ toast('Could not delete: ' + e.message, true); }
    };
    return;
  }

  document.querySelectorAll('[data-opentrip]').forEach(r => r.onclick = () => { bankTripOpen = r.dataset.opentrip; render(); window.scrollTo({top:0}); });
  document.querySelectorAll('[data-opentripdate]').forEach(r => r.onclick = () => {
    const t = bankTripsCache.find(x => x.trip_date === r.dataset.opentripdate);
    if(t){ bankTripOpen = t.id; render(); window.scrollTo({top:0}); } else toast('No bank visit is logged on that date.', true);
  });
  const exportBtn = document.getElementById('exportBankAuditBtn');
  if(exportBtn) exportBtn.onclick = () => exportPdf('landscape');

  document.getElementById('addTripBtn').onclick = async () => {
    const date = document.getElementById('btDate').value;
    const sig1 = document.getElementById('btSig1').value.trim();
    const sig2 = document.getElementById('btSig2').value.trim();
    if(!date){ toast('Pick a date.', true); return; }
    if(!sig1 || !sig2 || sig1===sig2){ toast('Enter two different signatories — minimum 2 required.', true); return; }
    const trip = {
      id: uid('bt'), trip_date: date, sig1, sig2,
      notice_transfer: Number(document.getElementById('btNotice').value)||0,
      misc_desc: document.getElementById('btMiscDesc').value.trim(),
      misc_amount: Number(document.getElementById('btMiscAmt').value)||0,
      petrol: Number(document.getElementById('btPetrol').value)||0,
      notes: document.getElementById('btNotes').value.trim(),
    };
    try{
      await Store.cloudFetch('mk_bank_trips', {method:'POST', body: JSON.stringify([trip])});
      toast('Bank visit logged.');
      await loadBankAuditData();
      render();
    }catch(e){ toast('Could not save: ' + e.message, true); }
  };

  const addLoanBtn = document.getElementById('addLoanBtn');
  if(addLoanBtn) addLoanBtn.onclick = async () => {
    const tripDate = document.getElementById('blTripDate').value;
    const memberFull = document.getElementById('blMember').value;
    const amount = Number(document.getElementById('blAmount').value)||0;
    if(!tripDate){ toast('Log a bank visit first.', true); return; }
    if(!memberFull){ toast('Select a member.', true); return; }
    if(amount <= 0){ toast('Enter a loan amount greater than 0.', true); return; }
    const notes = document.getElementById('blNotes').value.trim();
    if(!await guardLoan(memberFull, amount, 0)) return;
    const ok = await confirmModal('Log loan disbursed',
      `Record a loan of ${fmtR(amount)} for <b>${escapeHtml(memberFull)}</b> on ${fmtDate(tripDate)}? This also adds a real Loan entry to their DataLog history.`,
      'Log loan', false);
    if(!ok) return;
    const loan = {id: uid('bl'), trip_date: tripDate, member_name: memberFull, amount, notes};
    const month = currentFiscalMonthGuessFromDate(tripDate);
    const dlRow = {id: uid('d'), date: tripDate+'T00:00:00', name: memberFull, month, year: state.settings.yearLabel,
      contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken: amount, powng:0, source:'banktrip', note: notes || ('Bank visit ' + tripDate)};
    try{
      await Store.cloudFetch('mk_bank_loans', {method:'POST', body: JSON.stringify([loan])});
      state.datalog.push(dlRow);
      Store.persist();
      await Store.syncTable('mk_datalog', [dlRow], dlToDb);
      toast('Loan logged.');
      await loadBankAuditData();
      render();
    }catch(e){ toast('Could not save: ' + e.message, true); }
  };
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
(async function init(){
  const savedTheme = localStorage.getItem('mk_theme') || 'light';
  applyTheme(savedTheme);
  document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">Loading…</div>`;
  try{
    await Store.init();
    await Auth.init();
    await Store.trySyncFromCloud();
    render();
  }catch(e){
    console.error('Startup failed', e);
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
        <div class="card" style="max-width:460px">
          <h2 style="color:var(--red)">Something went wrong loading the app</h2>
          <p class="sub">${escapeHtml(e.message || String(e))}</p>
          <div class="btnrow" style="margin-top:14px"><button class="btn" onclick="location.reload()">Reload</button></div>
        </div>
      </div>`;
  }
})();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err));
  });
}

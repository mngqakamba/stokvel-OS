function billingInfo(){
  const c = Auth.club; if(!c) return null;
  const today = new Date(todayISO()+'T00:00:00');
  const days = (d) => Math.ceil((new Date(String(d).slice(0,10)+'T00:00:00') - today) / 86400000);
  if(c.plan === 'free') return null;
  if(c.plan === 'cancelled') return {tone:'red', text:'This subscription has been cancelled. Please contact us if you would like to continue.'};
  if(c.plan === 'trial'){
    if(!c.trial_ends) return null;
    const n = days(c.trial_ends);
    if(n > 0) return {tone: n<=7?'orange':'blue', text:`Free trial: ${n} day${n===1?'':'s'} left (ends ${fmtDate(c.trial_ends)}).`};
    return {tone:'red', text:`Your free trial ended on ${fmtDate(c.trial_ends)}. Please subscribe (Settings > Subscription) so the club keeps access.`};
  }
  if(!c.paid_until) return null;
  const n = days(c.paid_until);
  if(n < 0) return {tone:'red', text:`Your subscription ended on ${fmtDate(c.paid_until)}. Please renew to keep access.`};
  if(n <= 14) return {tone:'orange', text:`Your subscription ends in ${n} day${n===1?'':'s'} (${fmtDate(c.paid_until)}). Please contact us to renew.`};
  return null;
}

let menuDocBound = false;
function wireShellEvents(){
  document.querySelectorAll('.navtab').forEach(btn => {
    btn.onclick = () => setRoute(btn.dataset.route);
  });
  document.querySelectorAll('.menuitem').forEach(btn => { btn.onclick = () => setRoute(btn.dataset.route); });
  const menuBtn = document.getElementById('menuBtn'), menuPanel = document.getElementById('menuPanel');
  if(menuBtn && menuPanel){
    menuBtn.onclick = (e) => { e.stopPropagation(); const open = menuPanel.hasAttribute('hidden'); if(open) menuPanel.removeAttribute('hidden'); else menuPanel.setAttribute('hidden',''); menuBtn.setAttribute('aria-expanded', String(open)); };
    if(!menuDocBound){
      menuDocBound = true;
      document.addEventListener('click', (e) => { const mp = document.getElementById('menuPanel'); if(mp && !mp.hasAttribute('hidden') && !mp.contains(e.target)) mp.setAttribute('hidden',''); });
      document.addEventListener('keydown', (e) => { if(e.key==='Escape'){ const mp = document.getElementById('menuPanel'); if(mp) mp.setAttribute('hidden',''); } });
    }
  }
  document.getElementById('themeBtn').onclick = () => { applyTheme(state.theme==='dark'?'light':'dark'); render(); };
  const search = document.getElementById('globalSearch');
  search.oninput = () => { state.searchQuery = search.value; renderSearchResultsInline(); };
  search.onkeydown = (e) => { if(e.key==='Enter' && state.searchQuery.trim()){ setRoute('members'); } };
  const settingsLink = document.getElementById('openSettingsFromBar');
  if(settingsLink) settingsLink.onclick = (e) => { e.preventDefault(); setRoute('settings'); };
  const cpBtn = document.getElementById('changePwBtn');
  if(cpBtn) cpBtn.onclick = () => openChangePasswordModal();
  const signOut = document.getElementById('signOutBtn');
  if(signOut) signOut.onclick = async () => { await Auth.signOut(); render(); };
}

function wireViewEvents(route){
  switch(route){

    case 'months': wireMonths(); break;
    case 'members': wireMembers(); break;

    case 'penalties': wirePenalties(); break;

}

function auditMemberOptions(selected){
  const opt = (m, extra) => `<option value="${escapeHtml(m.full)}" ${m.full===selected?'selected':''}>${escapeHtml(m.full)}${extra||''}${Number(m.fixed)===0?' (B2S)':''}</option>`;
  const ex = executiveMembers();
  const exSet = new Set(ex.map(x => x.m.full));
  const others = auditorOnlyExecs() ? [] : state.members.filter(m => !exSet.has(m.full)).slice().sort((a,b)=>(a.surname+a.name).localeCompare(b.surname+b.name));
  return (ex.length ? `<optgroup label="Executive members">${ex.map(x => opt(x.m, ' — '+x.e.role)).join('')}</optgroup>` : '')
    + (others.length ? `<optgroup label="${ex.length?'All other members':'Members'}">${others.map(m => opt(m)).join('')}</optgroup>` : '');
}

// paying its interest in the same batch).
function previewPendingEntries(){
  const runningLoanDelta = {};
  const runningTaken = {};
  const seenThisBatch = {}; // "name|month" -> true, to catch duplicates staged within the same batch
  return pendingEntries.map(p => {
    const member = state.members.find(m => m.full===p.name);
    const row0 = computeMemberRow(member);
    const priorDelta = runningLoanDelta[p.name] || 0;
    const loanBalanceNow = row0.loanBalance + priorDelta;
    runningLoanDelta[p.name] = priorDelta + (p.taken - p.loanRep);
    const hasActivity = !!(p.contr||p.loanRep||p.intPay||p.pena||p.b2s||p.funeral||p.taken);
    const auto = computeAutoPenalty(member, p.contr, p.payDate, loanBalanceNow, p.intPay, hasActivity, p.month, p.advance);
    const totalPaid = p.contr+p.loanRep+p.intPay+p.pena+p.b2s+p.funeral;

    // Duplicate contribution check: already recorded for this member+month, either
    // already saved in DataLog, or staged twice in this same batch.
    let duplicateContr = false;
    if(p.contr > 0){
      const key = p.name + '|' + p.month;
      const alreadySaved = state.datalog.some(e => e.name===p.name && e.month===p.month && Number(e.contr) > 0);
      const alreadyInBatch = !!seenThisBatch[key];
      duplicateContr = alreadySaved || alreadyInBatch;
      seenThisBatch[key] = true;
    }

    let loanProblem = '';
    if(p.taken > 0){
      const chk = checkLoan(p.name, p.taken, runningTaken[p.name] || 0);
      if(!chk.ok) loanProblem = chk.problems.join(' ');
      runningTaken[p.name] = (runningTaken[p.name] || 0) + p.taken;
    }
    return { p, member, autoPenalty: auto.amount, autoReason: auto.reason, totalPaid, alreadyPenalized: !!auto.alreadyPenalized, duplicateContr, loanProblem };
  });
}

      payDate: document.getElementById('ePayDate').value,

      advance: document.getElementById('eAdvance').checked,
    };
    if(!row.contr && !row.loanRep && !row.intPay && !row.pena && !row.b2s && !row.funeral && !row.taken){

  if(submitBtn) submitBtn.onclick = submitEntryBatch;

  document.getElementById('csvPaste').oninput = (e) => { csvRawText = e.target.value; };

    reader.readAsText(file);

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bulk-payments-template.csv'; a.click();
  };

  document.getElementById('sweepMonthSel').onchange = (e) => { sweepMonth = e.target.value; sweepResults = null; render(); };
  document.getElementById('scanSweepBtn').onclick = () => {
    sweepMonth = document.getElementById('sweepMonthSel').value;
    if(!sweepAllowed(sweepMonth)){ toast('Too early: ' + sweepMonth + ' can only be scanned from ' + sweepOpenLabel(sweepMonth) + '.', true); return; }
    sweepResults = scanPenaltySweep(sweepMonth);
    render();
  };
  const applySweepBtn = document.getElementById('applySweepBtn');
  if(applySweepBtn) applySweepBtn.onclick = async () => {
    if(!sweepAllowed(sweepMonth)){ toast('Too early to apply penalties for ' + sweepMonth + '.', true); return; }
    const ok = await confirmModal('Apply penalty check results',
      `Apply ${sweepResults.length} penalt${sweepResults.length===1?'y':'ies'} for ${sweepMonth}? These will be tagged as auto-applied so you can always identify them later.`,
      'Apply', false);
    if(!ok) return;
    const rows = sweepResults.map(r => ({id: uid('d'), date: todayISO()+'T00:00:00', name: r.member.full, month: sweepMonth,
      year: state.settings.yearLabel, contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng: r.amount, source:'sweep', note: r.reason}));
    state.datalog.push(...rows);
    Store.persist();
    await Store.syncTable('mk_datalog', rows, dlToDb);
    toast(`${rows.length} penalt${rows.length===1?'y':'ies'} applied for ${sweepMonth}.`);
    sweepResults = null;
    render();
  };
}

// Minimal CSV parser: handles simple comma-separated values and "quoted, commas".
function parseCsvLine(line){
  const out = []; let cur = ''; let inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQuotes = false; }
      else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ out.push(cur); cur=''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function parseCsvIntoBatch(){
  const text = (csvRawText||'').trim();
  if(!text){ toast('Paste or upload a CSV first.', true); return; }
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length===0){ toast('That CSV looks empty.', true); return; }
  let start = 0;
  if(/surname/i.test(lines[0])) start = 1; // skip header row if present
  let added = 0; const skipped = [];
  for(let i=start;i<lines.length;i++){
    const cols = parseCsvLine(lines[i]);
    if(cols.length < 2) { skipped.push(lines[i]); continue; }
    const [surname, firstName, month, contr, loanRep, intPay, pena, b2s, funeral, taken, payDate, advanceFlag] = cols;
    const full = (surname||'').trim() + ', ' + (firstName||'').trim();
    const member = state.members.find(m => m.full.toLowerCase() === full.toLowerCase());
    const normMonth = normaliseMonth(month) || (MONTHS.includes(month) ? month : '');
    if(!member || !normMonth){ skipped.push(lines[i]); continue; }
    const num = (v) => Number(v)||0;
    const row = {
      name: member.full, month: normMonth, payDate: payDate || todayISO(),
      contr: num(contr), loanRep: num(loanRep), intPay: num(intPay), pena: num(pena),
      b2s: num(b2s), funeral: num(funeral), taken: num(taken), source: 'csv',
      advance: /^(y|yes|true|1)$/i.test((advanceFlag||'').trim()),
    };
    if(!row.contr && !row.loanRep && !row.intPay && !row.pena && !row.b2s && !row.funeral && !row.taken){ skipped.push(lines[i]); continue; }
    pendingEntries.push(row);
    added++;
  }
  toast(`${added} row${added===1?'':'s'} added to the batch${skipped.length?`, ${skipped.length} skipped (check names/months)`:''}.`, skipped.length && !added);
  csvRawText = '';
  render();
}

async function submitEntryBatch(){
  if(pendingEntries.length===0) return;
  const previewed = previewPendingEntries();

  const blockedLoans = previewed.filter(r => r.loanProblem);
  if(blockedLoans.length){
    const go = await confirmModal(`${blockedLoans.length} loan${blockedLoans.length>1?'s':''} not allowed`,
      `<div style="max-height:240px;overflow:auto;text-align:left">${blockedLoans.map(r => `<b>${escapeHtml(r.p.name)}</b> — ${fmtR(r.p.taken)}<br><span style="color:var(--muted)">${escapeHtml(r.loanProblem)}</span>`).join('<br><br>')}</div>
       <p style="margin-top:10px">Nothing has been saved. Remove the loan from the batch${can('settings')?', or grant an exception on the Loans tab and submit again':' (the admin can approve an exception on the Loans tab)'}.</p>`,
      can('settings') ? 'Go to Loans tab' : 'OK', false);
    if(go && can('settings')) setRoute('loans');
    return;
  }

  const duplicates = previewed.filter(r => r.duplicateContr).map(r => `${r.p.name} (${r.p.month}) — ${fmtR(r.p.contr)}`);
  if(duplicates.length){
    const proceedAnyway = await confirmModal(
      `${duplicates.length} possible duplicate contribution${duplicates.length>1?'s':''}`,
      `<div style="max-height:220px;overflow:auto;text-align:left">${duplicates.map(escapeHtml).join('<br>')}</div>
       <p style="margin-top:10px">These members already have a contribution logged for that month this year. If this is a genuine second payment (e.g. topping up a shortfall), go ahead — otherwise cancel and check the batch.</p>`,
      'Save anyway', true
    );
    if(!proceedAnyway) return;
  }

  const penaltyPreview = previewed.filter(r => r.autoPenalty > 0).map(r => `${r.p.name} (${r.p.month}): ${fmtR(r.autoPenalty)} — ${r.autoReason}`);

  let applyPenalties = true;
  if(penaltyPreview.length){
    applyPenalties = await confirmModal(
      `${penaltyPreview.length} penalty${penaltyPreview.length>1?'ies':''} calculated`,
      `<div style="max-height:220px;overflow:auto;text-align:left">${penaltyPreview.map(escapeHtml).join('<br>')}</div>
       <p style="margin-top:10px">Save these penalties along with the entries, or save the entries without them?</p>`,
      'Save with penalties', false
    );
  }

  const newRows = previewed.map(({p, autoPenalty, autoReason}) => ({
    id: uid('d'),
    date: (p.payDate || todayISO()) + 'T00:00:00',
    name: p.name, month: p.month, year: state.settings.yearLabel,
    contr: p.contr, loanRep: p.loanRep, intPay: p.intPay, pena: p.pena,
    b2s: p.b2s, funeral: p.funeral, taken: p.taken,
    powng: applyPenalties ? autoPenalty : 0,
    source: p.source || 'manual',
    note: (applyPenalties && autoPenalty > 0) ? (autoReason || 'Penalty') : '',
  }));

  state.datalog.push(...newRows);
  Store.persist();
  await Store.syncTable('mk_datalog', newRows, dlToDb);

  pendingEntries = [];
  toast(`${newRows.length} ${newRows.length===1?'entry':'entries'} saved to DataLog.`);
  render();
}

// Adds a second horizontal scrollbar above a wide table, kept in sync with the one below.
function addTopScroll(wrap){
  if(!wrap || wrap.dataset.topscroll) return;
  wrap.dataset.topscroll = '1';
  const top = document.createElement('div');
  top.className = 'topscroll no-print';
  const spacer = document.createElement('div');
  spacer.style.height = '1px';
  top.appendChild(spacer);
  wrap.parentNode.insertBefore(top, wrap);
  const size = () => { spacer.style.width = wrap.scrollWidth + 'px'; top.style.display = wrap.scrollWidth > wrap.clientWidth + 2 ? 'block' : 'none'; };
  size(); setTimeout(size, 50); window.addEventListener('resize', size);
  let lock = false;
  top.onscroll = () => { if(lock){ lock = false; return; } lock = true; wrap.scrollLeft = top.scrollLeft; };
  wrap.onscroll = () => { if(lock){ lock = false; return; } lock = true; top.scrollLeft = wrap.scrollLeft; };
}

function viewMonths(){
  const members = state.members.filter(m => !m.resigned).slice().sort((a,b)=>(a.surname+a.name).localeCompare(b.surname+b.name));
  const totalsByMonth = {};
  MONTHS.forEach(m => totalsByMonth[m]=0);
  const rows = members.map(m => {

      totalsByMonth[mo]+=v;
      return v;

  const grand = Object.values(totalsByMonth).reduce((a,b)=>a+b,0);

        ${(!opts.readonly && canCapture())?`<td class="no-print" style="white-space:nowrap">${h.source==='yearend'?'':`<button class="btn secondary sm" data-editdl="${escapeHtml(h.id)}">${icon('edit',12)} Correct</button> <button class="btn danger sm" data-deldl="${escapeHtml(h.id)}">${icon('trash',12)}</button>`}</td>`:''}
      </tr>`).join('')}</tbody>
    </table></div>`}
    ${dlBtn}
  </div>`;
}

function openEntryEditModal(rowId){
  const d = state.datalog.find(x => x.id === rowId);
  if(!d) return;
  const fields = [['contr','Contribution'],['loanRep','Loan repaid'],['intPay','Interest paid'],['pena','Penalty paid'],['b2s','B2S'],['funeral','Funeral'],['taken','Loan taken'],['powng','Penalty owing']];
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Correct entry</h3>
    <p class="sub">${escapeHtml(d.name)} · ${fmtDate(d.date)}. Change what is wrong; the original values stay in the activity log.</p>
    <div class="grid g2" style="margin-top:10px">
      <div><label>Date</label><input type="date" id="ceDate" value="${String(d.date||'').slice(0,10)}"></div>
      <div><label>Month</label><select id="ceMonth">${monthOptions(d.month)}</select></div>
      ${fields.map(f=>`<div><label>${f[1]} (R)</label><input type="number" min="0" step="0.01" id="ce_${f[0]}" value="${Number(d[f[0]])||0}"></div>`).join('')}
    </div>
    <div style="margin-top:10px"><label>Why is this being corrected? <span class="req">*</span></label><input type="text" id="ceReason" placeholder="e.g. Typed R500 instead of R5000"></div>
    <div class="btnrow"><button class="btn secondary" id="ceCancel">Cancel</button><button class="btn" id="ceSave">Save correction</button></div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#ceCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#ceSave').onclick = async () => {
    const reason = back.querySelector('#ceReason').value.trim();
    if(!reason){ toast('Give a reason for the correction.', true); return; }
    const date = back.querySelector('#ceDate').value;
    if(!date){ toast('Pick a date.', true); return; }
    const month = back.querySelector('#ceMonth').value;
    const nv = {};
    fields.forEach(f => nv[f[0]] = Math.max(Number(back.querySelector('#ce_'+f[0]).value)||0, 0));
    const changes = [];
    if(date !== String(d.date||'').slice(0,10)) changes.push(`date ${String(d.date||'').slice(0,10)} → ${date}`);
    if(month !== d.month) changes.push(`month ${d.month} → ${month}`);
    fields.forEach(f => { if(nv[f[0]] !== (Number(d[f[0]])||0)) changes.push(`${f[1].toLowerCase()} R${Number(d[f[0]])||0} → R${nv[f[0]]}`); });
    if(!changes.length){ toast('Nothing was changed.', true); return; }
    if(nv.taken > (Number(d.taken)||0) && !await guardLoan(d.name, nv.taken - (Number(d.taken)||0), 0)) return;
    d.date = date + 'T00:00:00'; d.month = month;
    fields.forEach(f => d[f[0]] = nv[f[0]]);
    d.note = (d.note ? d.note + ' ' : '') + `[Corrected: ${changes.join(', ')} — ${reason}]`;
    Store.persist();
    await Store.syncTable('mk_datalog', [d], dlToDb);
    back.remove();
    toast('Entry corrected.');
    render();
  };
}

function wireMembers(){
  document.querySelectorAll('[data-editdl]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openEntryEditModal(b.dataset.editdl); });
  document.querySelectorAll('[data-deldl]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const d = state.datalog.find(x => x.id === b.dataset.deldl);
    if(!d) return;
    const ok = await confirmModal('Delete entry', `Delete this entry for <b>${escapeHtml(d.name)}</b> dated ${fmtDate(d.date)}? If only one amount is wrong, use Correct instead. The deletion is kept in the activity log.`, 'Delete entry', true);
    if(!ok) return;
    state.datalog = state.datalog.filter(x => x.id !== d.id);
    Store.persist();
    try{ await Store.deleteRow('mk_datalog', d.id); toast('Entry deleted.'); }catch(err){ toast('Could not delete: ' + err.message, true); }
    render();
  });
  const showResignedToggle = document.getElementById('showResignedToggle');
  if(showResignedToggle) showResignedToggle.onchange = (e) => { showResignedMembers = e.target.checked; render(); };
  document.querySelectorAll('[data-select]').forEach(row => {
    row.onclick = () => {
      const full = row.dataset.select;
      state.selectedMemberFull = state.selectedMemberFull===full ? null : full;
      memberResignOpen = false; memberResignDraft = {overrideOwing:null, overridePenalty:null, overrideShare:null, paidIn:0};
      render();
    };
  });

  if(can('members')){
    document.getElementById('addMemberBtn').onclick = async () => {
      const sur = document.getElementById('mSur').value.trim();
      const nam = document.getElementById('mNam').value.trim();
      const fixed = Number(document.getElementById('mFixed').value) || 0;
      if(!sur || !nam){ toast('Enter surname and first name.', true); return; }
      const full = sur + ', ' + nam;
      if(state.members.some(m => m.full.toLowerCase()===full.toLowerCase())){ toast(full + ' already exists.', true); return; }
      const member = {id: uid('m'), surname:sur, name:nam, full, fixed};
      state.members.push(member);
      Store.persist();
      await Store.syncTable('mk_members', [member], m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));
      toast(full + ' added.');
      render();
    };

    document.getElementById('toggleBulkBtn').onclick = () => { membersBulkOpen = !membersBulkOpen; render(); };

    const bulkAddBtn = document.getElementById('bulkAddBtn');
    if(bulkAddBtn) bulkAddBtn.onclick = async () => {
      const text = document.getElementById('bulkAddText').value.trim();
      if(!text){ toast('Paste at least one member line.', true); return; }
      const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
      const added = []; const skipped = [];
      for(const line of lines){
        const parts = line.split(',').map(p=>p.trim());
        if(parts.length < 2){ skipped.push(line); continue; }
        const [sur, nam, fixedStr] = parts;
        const full = sur + ', ' + nam;
        if(state.members.some(m => m.full.toLowerCase()===full.toLowerCase())){ skipped.push(line); continue; }
        const member = {id: uid('m'), surname:sur, name:nam, full, fixed: Number(fixedStr)||0};
        state.members.push(member);
        added.push(member);
      }
      if(added.length){
        Store.persist();
        await Store.syncTable('mk_members', added, m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));
      }
      toast(`${added.length} member${added.length===1?'':'s'} added${skipped.length?`, ${skipped.length} skipped`:''}.`, skipped.length && !added.length);
      render();
    };

    const bulkDelBtn = document.getElementById('bulkDelBtn');
    if(bulkDelBtn) bulkDelBtn.onclick = async () => {
      const ids = Array.from(document.querySelectorAll('[data-bulkdel]:checked')).map(el => el.dataset.bulkdel);
      if(ids.length===0){ toast('Select at least one member.', true); return; }
      const mems = state.members.filter(m => ids.includes(m.id));
      const plan = planMemberDeletion(mems.map(m=>m.full));
      const ok = await confirmModal('Bulk delete', `Delete ${ids.length} member${ids.length===1?'':'s'} and their DataLog history? ` +
        (plan.kept.length ? `Their <b>${fmtR(plan.keptPen)}</b> of already-paid penalties stays in the DataLog. ` : '') + `This can't be undone.`, 'Delete all', true);
      if(!ok) return;
      await applyMemberDeletion(mems, plan);
      toast(`${ids.length} member${ids.length===1?'':'s'} deleted.`);
      render();
    };
  }

  const selected = state.selectedMemberFull ? state.members.find(m => m.full===state.selectedMemberFull) : null;
  if(selected && can('members')){
    document.getElementById('editMemberBtn').onclick = () => openRenameModal(selected.id);
    document.getElementById('deleteMemberBtn').onclick = async () => {
      const plan = planMemberDeletion([selected.full]);
      const ok = await confirmModal('Delete member', `Delete <b>${escapeHtml(selected.full)}</b> and remove their history rows from DataLog? ` +
        (plan.kept.length ? `The <b>${fmtR(plan.keptPen)}</b> of penalties they already paid stays in the DataLog (penalties paid), so the club's penalty totals and year-end shares do not change. ` : `They have no paid penalties on record. `) +
        `This can't be undone.`, 'Delete', true);
      if(!ok) return;
      await applyMemberDeletion([selected], plan);
      toast(selected.full + ' deleted.' + (plan.keptPen ? ' ' + fmtR(plan.keptPen) + ' of paid penalties kept.' : ''));
      render();
    };
    const reactBtn = document.getElementById('reactivateMemberBtn');
    if(reactBtn) reactBtn.onclick = () => {
      const oldRows = state.datalog.filter(d => d.name===selected.full && (Number(d.contr)||0) > 0);
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `<div class="modal">
        <h3>Mark ${escapeHtml(selected.full)} as active again</h3>
        <p>They will appear again in the Main Sheet, Monthly Report, Yearly Contributions and Attendance, and can be captured and penalised like any other member.</p>
        ${oldRows.length ? `<p style="color:var(--red)"><b>Heads up:</b> this member still has ${fmtR(oldRows.reduce((a,d)=>a+(Number(d.contr)||0),0))} of contributions in the current year's DataLog from before they left, and their payout was settled when they resigned. Those amounts would count for them again. It is best to do this after the New Year reset, when last year's rows have been archived.</p>` : ''}
        <div style="margin-top:10px"><label>Monthly contribution (R) <span class="hint">0 = B2S-only</span></label><input type="number" id="raFixed" value="${Number(selected.fixed)||0}" min="0" step="50"></div>
        <div class="btnrow"><button class="btn secondary" id="raCancel">Cancel</button><button class="btn" id="raOk">Mark as active</button></div>
      </div>`;
      document.body.appendChild(back);
      back.querySelector('#raCancel').onclick = () => back.remove();
      back.onclick = (e) => { if(e.target===back) back.remove(); };
      back.querySelector('#raOk').onclick = async () => {
        selected.fixed = Number(back.querySelector('#raFixed').value) || 0;
        selected.resigned = false;
        selected.resignedDate = null;
        const last = state.resignations.filter(r => r.name===selected.full).slice(-1)[0];
        if(last){ last.returnedDate = todayISO(); }
        Store.persist();
        if(last) await Store.syncTable('mk_resignations', [last], r => ({id:r.id, date:r.date, data: JSON.stringify(r)}));
        await Store.syncTable('mk_members', [selected], m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));
        back.remove();
        toast(selected.full + ' is active again.');
        render();
      };
    };
    const resignBtn = document.getElementById('resignMemberBtn');
    if(resignBtn) resignBtn.onclick = () => {
      memberResignOpen = true; memberResignDraft = {overrideOwing:null, overridePenalty:null, overrideShare:null, paidIn:0}; render();
    };
    const downgradeBtn = document.getElementById('downgradeMemberBtn');
    if(downgradeBtn) downgradeBtn.onclick = () => { memberDowngradeOpen = true; memberDowngradeFixed = null; render(); };
    const cancelDowngrade = document.getElementById('cancelDowngradeBtn');
    if(cancelDowngrade) cancelDowngrade.onclick = () => { memberDowngradeOpen = false; render(); };
    const dgFixedInput = document.getElementById('dgNewFixed');
    if(dgFixedInput) dgFixedInput.onchange = e => { memberDowngradeFixed = Number(e.target.value)||0; render(); };
    const applyDowngradeBtn = document.getElementById('applyDowngradeBtn');
    if(applyDowngradeBtn) applyDowngradeBtn.onclick = async () => {
      const newFixed = memberDowngradeFixed !== null ? memberDowngradeFixed : Math.max(Number(selected.fixed) - 500, 0);
      const preview = computeDowngradePreview(selected, newFixed);
      if(newFixed >= Number(selected.fixed)){ toast('New amount must be lower than their current contribution.', true); return; }
      const msg = preview.shortfall > 0
        ? `This assumes you've already collected the shortfall of <b>${fmtR(preview.shortfall)}</b> from ${escapeHtml(selected.full)} just now. Their contribution history for the year will be rewritten to show R${newFixed}/month evenly across all 11 months. Continue?`
        : preview.loanPayoff > 0
          ? `${escapeHtml(selected.full)}'s excess of ${fmtR(preview.excess)} will pay down ${fmtR(preview.loanPayoff)} of their loan${(preview.excess-preview.loanPayoff)>0.005?`, with the remaining ${fmtR(preview.excess-preview.loanPayoff)} carried forward as a credit (nothing is lost)`:''}. Their contribution history for the year will be rewritten to show R${newFixed}/month evenly across all 11 months. Continue?`
          : preview.excess > 0.005
            ? `${escapeHtml(selected.full)}'s excess of ${fmtR(preview.excess)} will be carried forward as a credit (they have no loan to pay down, so nothing is lost). Their contribution history for the year will be rewritten to show R${newFixed}/month evenly across all 11 months. Continue?`
            : `${escapeHtml(selected.full)}'s contribution history for the year will be rewritten to show R${newFixed}/month evenly across all 11 months. Continue?`;
      const ok = await confirmModal('Downgrade contribution', msg, 'Apply downgrade', false);
      if(!ok) return;

      // Zero out the contribution portion of every one of this member's entries
      // this year — but only that field, never the whole row. A row that mixes a
      // contribution with something else (e.g. a contribution logged alongside a
      // late fee in the same entry, which Data Entry allows) must keep that other
      // part intact; deleting the whole row would double-count it once the new
      // normalized entries go in, silently inflating their contributions.
      const contrRowsThisYear = state.datalog.filter(d => d.name===selected.full && d.year===state.settings.yearLabel && Number(d.contr) > 0);
      const zeroedRows = [];
      for(const d of contrRowsThisYear){
        d.contr = 0;
        zeroedRows.push(d);
      }
      if(zeroedRows.length){
        await Store.syncTable('mk_datalog', zeroedRows, dlToDb);
      }

      const newRows = MONTHS.map(m => ({
        id: uid('d'), date: todayISO()+'T00:00:00', name: selected.full, month: m, year: state.settings.yearLabel,
        contr: newFixed, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng:0, source:'downgrade'
      }));
      if(preview.loanPayoff > 0){
        newRows.push({id: uid('d'), date: todayISO()+'T00:00:00', name: selected.full, month: MONTHS[Number(state.settings.monthsElapsed)-1]||MONTHS[0],
          year: state.settings.yearLabel, contr:0, loanRep: preview.loanPayoff, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng:0, source:'downgrade'});
      }
      // Any excess beyond what paid down the loan is real money they already paid in —
      // it must never just vanish from the rewrite. Carry it forward as a credit
      // toward future contributions rather than dropping it.
      const leftoverCredit = preview.excess - preview.loanPayoff;
      if(leftoverCredit > 0.005){
        newRows.push({id: uid('d'), date: todayISO()+'T00:00:00', name: selected.full, month: MONTHS[Number(state.settings.monthsElapsed)-1]||MONTHS[0],
          year: state.settings.yearLabel, contr: leftoverCredit, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng:0, source:'downgrade'});
      }
      state.datalog.push(...newRows);
      selected.fixed = newFixed;
      Store.persist();
      await Store.syncTable('mk_datalog', newRows, dlToDb);
      await Store.syncTable('mk_members', [selected], m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));

      memberDowngradeOpen = false;
      toast(`${selected.full} downgraded to R${newFixed}/month.`);
      render();
    };
    const cancelResign = document.getElementById('cancelResignBtn');
    if(cancelResign) cancelResign.onclick = () => { memberResignOpen = false; render(); };
    const owingInput = document.getElementById('rzOwing');
    if(owingInput) owingInput.onchange = e => { memberResignDraft.overrideOwing = Number(e.target.value)||0; render(); };
    const paidInInput = document.getElementById('rzPaidIn');
    if(paidInInput) paidInInput.onchange = e => { memberResignDraft.paidIn = Math.max(Number(e.target.value)||0,0); render(); };
    const shareInput = document.getElementById('rzShare');
    if(shareInput) shareInput.onchange = e => { memberResignDraft.overrideShare = Number(e.target.value)||0; render(); };
    const penInput = document.getElementById('rzPenalty');
    if(penInput) penInput.onchange = e => { memberResignDraft.overridePenalty = Number(e.target.value)||0; render(); };
    const recordBtn = document.getElementById('recordResignBtn');
    if(recordBtn) recordBtn.onclick = async () => {
      const row = computeMemberRow(selected);
      const rc = resignCalc(row, memberResignDraft);
      const {loan, penOwed, share, available, penPaid, sharePaid, net, forfeiture, payout, stillOwed} = rc;
      if(stillOwed > 0.005){ toast('The member must pay in ' + fmtR(stillOwed) + ' before the resignation can be recorded.', true); return; }
      const intoPen = penPaid + sharePaid + rc.paidShare + forfeiture;

      const ok = await confirmModal('Record resignation settlement',
        `This logs the resignation of <b>${escapeHtml(selected.full)}</b> and clears their loan. Unpaid interest is waived. <b>${fmtR(intoPen)}</b> goes into penalties paid (penalties ${fmtR(penPaid)}, ${clubPct()}% share ${fmtR(sharePaid + rc.paidShare)}, ${clubKeepPct()}% forfeiture ${fmtR(forfeiture)}). Payout of ${fmtR(payout)} is not deposited, so pay it out separately.` +
        (rc.paidIn>0 ? ` The ${fmtR(rc.paidIn)} they paid in is recorded as a payment.` : '') + ` Continue?`,
        'Record settlement', false);
      if(!ok) return;

      const mon = MONTHS[Number(state.settings.monthsElapsed)-1]||MONTHS[0];
      const mk = (o, note) => Object.assign({id: uid('d'), date: todayISO()+'T00:00:00', name: selected.full, month: mon,
        year: state.settings.yearLabel, contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng:0, source:'resignation', note}, o);
      const clearingRows = [];
      if(rc.paidIn > 0) clearingRows.push(mk({contr: rc.paidIn}, 'Resignation: money paid in by the member to cover the loan, penalties and ' + clubPct() + '% share'));
      if(row.loanBalance > 0) clearingRows.push(mk({loanRep: row.loanBalance}, 'Resignation: loan cleared against contributions (unpaid interest waived)'));
      if(penPaid > 0)   clearingRows.push(mk({pena: penPaid}, 'Resignation: penalties owed, taken from contributions'));
      if(sharePaid > 0) clearingRows.push(mk({pena: sharePaid}, 'Resignation: ' + clubPct() + '% club share of unpaid interest, recorded as penalty paid'));
      if(rc.paidShare > 0) clearingRows.push(mk({pena: rc.paidShare, poolChg: -rc.paidShare}, 'Resignation: ' + clubPct() + '% of interest already paid, moved from the pool to penalties paid'));
      if(forfeiture > 0) clearingRows.push(mk({pena: forfeiture}, 'Resignation: ' + clubKeepPct() + '% forfeiture, recorded as penalty paid'));
      state.datalog.push(...clearingRows);

      const entry = {id: uid('rz'), date: todayISO(), name: selected.full, totalOwing: loan, penaltiesOwed: penOwed, interestShare: share, interestShareRecorded: sharePaid, paidInterestShareMoved: rc.paidShare, penaltiesRecorded: penPaid, totalAvailable: available,
        net, forfeiture, payout, stillOwed, notes:'Settlement recorded'};
      state.resignations.push(entry);
      selected.resigned = true;
      selected.resignedDate = todayISO();
      Store.persist();
      if(clearingRows.length) await Store.syncTable('mk_datalog', clearingRows, dlToDb);
      await Store.syncTable('mk_resignations', [entry], r => ({id:r.id, date:r.date, data: JSON.stringify(r)}));
      await Store.syncTable('mk_members', [selected], m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));

      memberResignOpen = false;
      toast('Resignation settlement recorded — they no longer appear in Main Sheet, Yearly Contributions, or Monthly Report.');
      render();
    };
  }
}

function openRenameModal(memberId){
  const member = state.members.find(m => m.id===memberId);
  if(!member) return;
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Edit ${escapeHtml(member.full)}</h3>
    <div class="grid g2" style="margin-top:10px">
      <div><label>Surname</label><input type="text" id="rSur" value="${escapeHtml(member.surname)}"></div>
      <div><label>First name</label><input type="text" id="rNam" value="${escapeHtml(member.name)}"></div>
    </div>
    <div style="margin-top:10px"><label>Fixed contribution (R)</label><input type="number" id="rFixed" value="${member.fixed}"></div>
    <div class="btnrow">
      <button class="btn secondary" id="rCancel">Cancel</button>
      <button class="btn" id="rSave">Save changes</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#rCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#rSave').onclick = async () => {
    const newSur = back.querySelector('#rSur').value.trim();
    const newNam = back.querySelector('#rNam').value.trim();
    const newFixed = Number(back.querySelector('#rFixed').value) || 0;
    if(!newSur || !newNam){ toast('Enter surname and first name.', true); return; }
    const oldFull = member.full;
    const newFull = newSur + ', ' + newNam;
    member.surname = newSur; member.name = newNam; member.fixed = newFixed; member.full = newFull;
    if(oldFull !== newFull){
      state.datalog.forEach(d => { if(d.name===oldFull) d.name = newFull; });
      if(state.selectedMemberFull===oldFull) state.selectedMemberFull = newFull;
    }
    Store.persist();
    await Store.syncTable('mk_members', [member], m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));
    if(oldFull !== newFull) await Store.syncTable('mk_datalog', state.datalog.filter(d=>d.name===newFull),
      dlToDb);
    back.remove();
    toast('Saved.');
    render();
  };
}

  const totalInt = rows.reduce((s,r)=>s+r.interestAccrued,0);
  return `
  <div class="card">

    <p class="sub">Issuing a loan adds a "Loan" entry to DataLog for that member — it'll immediately start accruing interest. Rules: B2S-only members cannot take loans, and a member's loan total may not exceed ${loanCapPct()}% of ${loanCapBasis()==='paid'?'what they have contributed so far this year':'their yearly contributions (monthly amount × 12)'}. The admin can approve exceptions below.</p>

    </div>

function wireLoans(){
  const addEx = document.getElementById('addExceptionBtn');

  document.querySelectorAll('[data-revokeex]').forEach(b => b.onclick = async () => {

    if(!await confirmModal('Revoke exception', `Revoke the loan exception for <b>${escapeHtml(ex.member)}</b>?`, 'Revoke', true)) return;

  document.getElementById('addLoanBtn').onclick = async () => {

    const notes = document.getElementById('lnNotes').value.trim();
    if(!memberFull){ toast('Select a member.', true); return; }
    if(amount <= 0){ toast('Enter a loan amount greater than 0.', true); return; }

function wireAttendance(){
  document.getElementById('atDate').onchange = e => { ensureAttDraft().date = e.target.value; };
  document.getElementById('atNumber').onchange = e => { ensureAttDraft().number = e.target.value; };
  document.getElementById('atNotes').oninput = e => { ensureAttDraft().notes = e.target.value; };

  document.querySelectorAll('[data-att-status]').forEach(el => el.onchange = () => {
    const d = ensureAttDraft(); const key = el.dataset.attStatus;
    d.statusByMember[key] = Object.assign({status:'Present',apology:'',proxy:''}, d.statusByMember[key], {status: el.value});
    render();
  });
  document.querySelectorAll('[data-att-apology]').forEach(el => el.onchange = () => {
    const d = ensureAttDraft(); const key = el.dataset.attApology;
    d.statusByMember[key] = Object.assign({status:'Present',apology:'',proxy:''}, d.statusByMember[key], {apology: el.value});
    render();
  });
  document.querySelectorAll('[data-att-proxy]').forEach(el => el.oninput = () => {
    const d = ensureAttDraft(); const key = el.dataset.attProxy;
    d.statusByMember[key] = Object.assign({status:'Present',apology:'',proxy:''}, d.statusByMember[key], {proxy: el.value});
  });

  document.getElementById('applyAttendanceBtn').onclick = async () => {
    const draft = ensureAttDraft();
    const members = state.members;
    const records = [];
    const newRows = [];
    const month = normaliseMonth(currentFiscalMonthGuessFromDate(draft.date));
    for(const m of members){
      const exempt = Number(m.fixed)===0;
      const rec = draft.statusByMember[m.full] || {status:'Present', apology:'', proxy:''};
      const penalty = (exempt || isNoPenaltyMonth(month)) ? 0 : computeAttendancePenalty(m, rec.status, rec.apology);
      records.push({name:m.full, status:rec.status, apology:rec.apology, proxy:rec.proxy, penalty, applied: penalty>0});
      if(penalty > 0){
        newRows.push({
          id: uid('d'), date: draft.date+'T00:00:00', name:m.full, month: month || MONTHS[0], year: state.settings.yearLabel,
          contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng: penalty,
          source:'attendance', note: `Meeting #${draft.number} on ${dayMonth(draft.date)} — ${(String(rec.status).toLowerCase()==='apology' || /^(y|yes)$/i.test(rec.apology||'')) ? 'absent with an apology' : 'absent without an apology'}, ${fmtR(penalty)}`
        });
      }
    }
    const ok = await confirmModal('Apply attendance penalties',
      `This will add ${newRows.length} penalty ${newRows.length===1?'entry':'entries'} to DataLog for meeting #${escapeHtml(String(draft.number))}. Continue?`,
      'Apply & save', false);
    if(!ok) return;

    const meeting = {id: uid('am'), date: draft.date, number: draft.number, notes: draft.notes, records};
    state.attMeetings.push(meeting);
    state.datalog.push(...newRows);
    Store.persist();
    await Store.syncTable('mk_att_meetings', [meeting], mm => ({id:mm.id, date:mm.date, number:mm.number, notes:mm.notes, records: JSON.stringify(mm.records)}));
    if(newRows.length) await Store.syncTable('mk_datalog', newRows, dlToDb);

    attDraft = null;
    toast('Attendance recorded' + (newRows.length ? ` — ${newRows.length} penalties saved.` : '.'));
    render();
  };
}

function currentFiscalMonthGuessFromDate(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return currentFiscalMonthGuess();
  return MON_SHORT[d.getMonth()];
}

let exportedArchiveIds = new Set();
// POPIA "access to my information": everything recorded about one member, as a spreadsheet file.
function downloadMemberData(full){
  const m = state.members.find(x => x.full === full);
  const rows = state.datalog.filter(d => d.name === full).concat([].concat(...(state.archives||[]).map(a => (a.datalog||[]).filter(d => d.name === full))));
  const head = `Member data export\r\nClub,${csvCell((state.settings&&state.settings.clubName)||'')}\r\nMember,${csvCell(full)}\r\nMonthly contribution,${csvCell(m?m.fixed:'')}\r\nExported,${todayISO()}\r\n\r\n`;
  downloadFile(`my-records-${todayISO()}.csv`, head + archiveCsv({datalog: rows}), 'text/csv');
}

function csvCell(v){ const t = String(v==null?'':v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; }
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function archiveCsv(a){
  const head = ['Member','Date','Month','Year','Contribution','Loan Repayment','Interest Paid','Penalties Paid','B2S','Funeral','Loan','Penalty Owing','Pool Charge','Source','Note','Captured by'];
  const rows = a.datalog.slice().sort((x,y)=> String(x.name).localeCompare(String(y.name)) || (fiscalIndex(x.month)-fiscalIndex(y.month)) || String(x.date).localeCompare(String(y.date)))
    .map(d => [d.name, String(d.date||'').slice(0,10), d.month, d.year, d.contr, d.loanRep, d.intPay, d.pena, d.b2s, d.funeral, d.taken, d.powng, d.poolChg||0, d.source||'', d.note||'', d.createdBy||'']);
  return '\ufeff' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
}

function wireNewYear(){
  document.querySelectorAll('[data-exportarcsv]').forEach(b => b.onclick = () => {
    const a = state.archives.find(x => x.id === b.dataset.exportarcsv); if(!a) return;
    downloadFile(`${clubFileSlug()}-${a.year}-archive.csv`, archiveCsv(a), 'text/csv;charset=utf-8');
    exportedArchiveIds.add(a.id); toast(`${a.year} exported.`); render();
  });
  document.querySelectorAll('[data-exportarcjson]').forEach(b => b.onclick = () => {
    const a = state.archives.find(x => x.id === b.dataset.exportarcjson); if(!a) return;
    const pack = {type:'mk-year-archive', year:a.year, closedAt:a.closedAt, exportedAt:new Date().toISOString(),
      club: state.settings.clubName, members: state.members.map(m => ({surname:m.surname, name:m.name, full:m.full, fixed:m.fixed})),
      settings: state.settings, datalog: a.datalog};
    downloadFile(`${clubFileSlug()}-${a.year}-archive.json`, JSON.stringify(pack, null, 2), 'application/json');
    exportedArchiveIds.add(a.id); toast(`${a.year} exported.`); render();
  });
  document.querySelectorAll('[data-deletearc]').forEach(b => b.onclick = async () => {
    const a = state.archives.find(x => x.id === b.dataset.deletearc); if(!a) return;
    if(!exportedArchiveIds.has(a.id)){ toast(`Export ${a.year} first (spreadsheet or full backup) so you keep a copy, then delete it.`, true); return; }
    if(!await confirmModal(`Delete the ${a.year} archive`, `This permanently removes the ${a.year} year (${a.datalog.length} ledger rows) from the app to free up space. Make sure the file you exported is saved somewhere safe — it will not be possible to bring this year back into the app. The deletion is recorded in the activity log.`, 'Delete permanently', true)) return;
    await Store.deleteRow('mk_archives', a.id);
    state.archives = state.archives.filter(x => x.id !== a.id);
    exportedArchiveIds.delete(a.id);
    Store.persist(); toast(`${a.year} archive deleted.`); render();
  });
  const saveYeBtn = document.getElementById('saveYeSettingsBtn');
  if(saveYeBtn) saveYeBtn.onclick = async () => {
    state.settings.bankInterest = Number(document.getElementById('yeBankInterest').value) || 0;
    state.settings.functionFundCost = Number(document.getElementById('yeFunctionFundCost').value) || 0;
    state.settings.applyPenaltyShare = document.getElementById('yeApplyPenaltyShare').value;
    Store.persist();
    await Store.syncTable('mk_settings', [{id:settingsId()}], () => ({id:settingsId(), data: JSON.stringify(state.settings)}));
    toast('Saved.');
    render();
  };

  const distributeB2sBtn = document.getElementById('distributeB2sBtn');
  if(distributeB2sBtn) distributeB2sBtn.onclick = async () => {
    const b2sRows = allMemberRows().filter(r => r.b2sTotal > 0.5);
    const ok = await confirmModal('Distribute B2S',
      `Pay out ${fmtR(b2sRows.reduce((s,r)=>s+r.b2sTotal,0))} of B2S to ${b2sRows.length} member${b2sRows.length===1?'':'s'} and reset their B2S fund to zero. Continue?`,
      'Distribute', false);
    if(!ok) return;
    const rows = b2sRows.map(r => ({id: uid('d'), date: todayISO()+'T00:00:00', name: r.member.full, month: MONTHS[1],
      year: state.settings.yearLabel, contr:0, loanRep:0, intPay:0, pena:0, b2s: -r.b2sTotal, funeral:0, taken:0, powng:0, source:'b2s'}));
    state.datalog.push(...rows);
    Store.persist();
    await Store.syncTable('mk_datalog', rows, dlToDb);
    toast(`B2S distributed to ${rows.length} member${rows.length===1?'':'s'}.`);
    render();
  };

  const finalizeDistBtn = document.getElementById('finalizeDistBtn');
  if(finalizeDistBtn) finalizeDistBtn.onclick = async () => {
    const distRows = activeMembers().map(computeMemberRow).map(r => Object.assign({}, r, computeYearEndPayout(r)));
    const toSettle = distRows.filter(r => r.loanBalance > 0.5);
    if(toSettle.length===0){ toast('No outstanding loans to settle.'); return; }
    const shortfallCount = toSettle.filter(r => r.stillOwed > 0.5).length;
    const ok = await confirmModal('Finalize year-end distribution',
      `This will clear ${toSettle.length} member${toSettle.length===1?"'s":"s'"} outstanding loan by deducting it from their allocation (unpaid interest is not deducted).${shortfallCount ? ` ${shortfallCount} of them owe more than their whole allocation covers — that shortfall stays visible in this table for you to follow up on directly, it won't be turned into a new loan.` : ''} This can't be undone from here. Continue?`,
      'Finalize', true);
    if(!ok) return;
    const rows = [];
    const month = MONTHS[Number(state.settings.monthsElapsed)-1] || MONTHS[MONTHS.length-1];
    for(const r of toSettle){
      if(r.loanBalance > 0){
        rows.push({id: uid('d'), date: todayISO()+'T00:00:00', name: r.member.full, month, year: state.settings.yearLabel,
          contr:0, loanRep: r.loanBalance, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng:0, source:'yearend', note:'Year-end: loan deducted from allocation (interest not deducted)'});
      }
      // Note: a "still owed" shortfall (debts bigger than their whole allocation)
      // is deliberately NOT written back as a new loan here — doing that once
      // caused it to be treated as a freshly-taken loan and start accruing real
      // loan interest on itself, inflating on every later view of this page even
      // without re-clicking anything. It stays as a number in this table only,
      // for you to follow up on directly (same as a resignation shortfall).
    }
    state.datalog.push(...rows);
    Store.persist();
    await Store.syncTable('mk_datalog', rows, dlToDb);
    toast(`Distribution finalized for ${toSettle.length} member${toSettle.length===1?'':'s'}.`);
    render();
  };

  const applyNoIntBtn = document.getElementById('applyNoIntBtn');
  if(applyNoIntBtn) applyNoIntBtn.onclick = async () => {
    const ratePool = Number(state.settings.noIntPool) || 0;
    if(ratePool <= 0){ toast('Set a non-loan/interest charge amount in Settings first.', true); return; }
    const targets = allMemberRows().filter(qualifiesForPoolCharge);
    if(targets.length===0){ toast('No members currently qualify.'); return; }
    const ok = await confirmModal('Year-end pool charge',
      `Charge ${fmtR(ratePool)} — 100% straight into the shared pool, no personal cut back — to ${targets.length} member${targets.length===1?'':'s'} who paid no real interest this year. Continue?`,
      'Apply charge', false);
    if(!ok) return;
    const rows = targets.map(r => ({id: uid('d'), date: todayISO()+'T00:00:00', name: r.member.full, month: MONTHS[MONTHS.length-1],
      year: state.settings.yearLabel, contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken:0, powng:0, poolChg: ratePool, source:'poolcharge'}));
    state.datalog.push(...rows);
    Store.persist();
    await Store.syncTable('mk_datalog', rows, dlToDb);
    toast(`Charged ${fmtR(ratePool)} to ${rows.length} member${rows.length===1?'':'s'} — 100% into the pool.`);
    render();
  };

  document.getElementById('nyGoBtn').onclick = async () => {
    const newYear = Number(document.getElementById('nyYear').value) || (Number(state.settings.yearLabel)+1);
    const carryLoans = false, carryPenalties = false; // nothing is carried forward
    const resetFixed = document.getElementById('nyResetFixed').checked;

    const openLoansNow = allMemberRows().filter(r => r.loanBalance>0.5);
    const undistributedB2s = allMemberRows().filter(r => r.b2sTotal > 0.5);
    const totalUndistributedB2s = undistributedB2s.reduce((s,r)=>s+r.b2sTotal,0);
    const ok = await confirmModal('Close the year',
      `This archives all ${state.datalog.length} DataLog rows for ${escapeHtml(String(state.settings.yearLabel))} and starts ${newYear}.${
        (openLoansNow.length > 0 || allMemberRows().some(r => r.penaltiesOwed > 0.5))
          ? ` <b>Nothing is carried forward.</b> ${openLoansNow.length} member${openLoansNow.length===1?'':'s'} still ha${openLoansNow.length===1?'s':'ve'} an unpaid loan (${fmtR(openLoansNow.reduce((s,r)=>s+r.loanBalance,0))}) and ${fmtR(allMemberRows().reduce((s,r)=>s+r.penaltiesOwed,0))} of penalties is unpaid — these stay in the archive only. Cancel and run "Finalize distribution" first if loans should be deducted.`
          : ''
      }${
        totalUndistributedB2s > 0.5
          ? ` <b>${fmtR(totalUndistributedB2s)}</b> of B2S across ${undistributedB2s.length} member${undistributedB2s.length===1?'':'s'} hasn't been distributed yet — closing the year now leaves it sitting in the archive, not paid out. Cancel and run "Distribute B2S" (step 1) first if that's not intentional.`
          : ''
      } The archive is kept and can be exported or deleted later from Archived years. Continue?`,
      'Close year', true);
    if(!ok) return;

    const archive = {id: uid('ar'), year: state.settings.yearLabel, closedAt: todayISO(), datalog: state.datalog};
    state.archives.push(archive);

    const carryRows = [];
    if(carryLoans || carryPenalties){
      for(const row of allMemberRows()){
        // Carrying forward a loan folds in any unpaid interest too — otherwise that
        // interest would just silently disappear (it isn't stored anywhere on its
        // own; it only exists as a live calculation from the loan). The normal,
        // cleaner path is to run "Finalize distribution" first, which settles
        // interest within the year so nothing needs folding in here at all.
        const taken = carryLoans ? row.loanBalance : 0;
        const powng = carryPenalties ? row.penaltiesOwed : 0;
        if(taken>0.5 || powng>0.5){
          carryRows.push({id: uid('d'), date: todayISO()+'T00:00:00', name: row.member.full, month: MONTHS[0], year: newYear,
            contr:0, loanRep:0, intPay:0, pena:0, b2s:0, funeral:0, taken: taken>0.5?taken:0, powng: powng>0.5?powng:0, source:'newyear'});
        }
      }
    }

    state.datalog = carryRows;
    state.settings.yearLabel = newYear;
    state.settings.monthsElapsed = 1;
    if(resetFixed) state.members.forEach(m => m.fixed = 0);

    Store.persist();
    await Store.syncTable('mk_archives', [archive], a => ({id:a.id, year:a.year, closed_at:a.closedAt, datalog: JSON.stringify(a.datalog)}));
    await Store.replaceAllInTable('mk_datalog', state.datalog, dlToDb);
    await Store.syncTable('mk_settings', [{id:settingsId()}], () => ({id:settingsId(), data: JSON.stringify(state.settings)}));
    if(resetFixed) await Store.syncTable('mk_members', state.members, m => ({id:m.id, surname:m.surname, name:m.name, full_name:m.full, fixed:m.fixed, resigned:!!m.resigned, resigned_date:m.resignedDate||null}));

    toast(`${newYear} started. ${archive.datalog.length} rows archived.`);
    setRoute('sheet');
  };
}

function wireSettings(){
  wireBrandCard();

      try{
        const data = JSON.parse(reader.result);
        state.members = data.members||[]; state.datalog = data.datalog||[]; state.settings = data.settings||{};
        state.attMeetings = data.attMeetings||[]; state.resignations = data.resignations||[]; state.archives = data.archives||[];
        Store.persist();
        if(Store.isCloud()) await Store.pushAllToCloud();
        toast('Backup imported.');
        render();
      }catch(err){ toast('Could not read that file.', true); }
    };
    reader.readAsText(file);
  };
}

   VIEW: SUMMARY  (club-wide overview, mirrors the workbook's Summary tab)
   --------------------------------------------------------------------- */
function viewSummary(){
  const s = state.settings;
  const rows = allMemberRows();
  const currentMonth = MONTHS[Math.min(Math.max((Number(s.monthsElapsed)||1)-1,0),MONTHS.length-1)];
  const mrep = monthlyReport(currentMonth);

  const totalContr = rows.reduce((a,r)=>a+r.totalContributions,0);
  const totalIntPaid = rows.reduce((a,r)=>a+r.interestPaid,0);
  const totalPenPaid = rows.reduce((a,r)=>a+r.penaltiesPaid,0);
  const totalB2s = rows.reduce((a,r)=>a+r.b2sTotal,0);
  const totalFuneral = rows.reduce((a,r)=>a+r.funeralAlloc,0);
  const totalLoanRepaid = rows.reduce((a,r)=>a+r.loanRepaid,0);
  const totalPoolCharges = state.datalog.reduce((a,d)=>a+(Number(d.poolChg)||0),0);
  const totalLoansIssued = state.datalog.reduce((a,d)=>a+(Number(d.taken)||0),0);
  const expectedCash = totalContr+totalIntPaid+totalPenPaid+totalB2s+totalFuneral+totalLoanRepaid+totalPoolCharges-totalLoansIssued;

  const principalOutstanding = rows.reduce((a,r)=>a+r.loanBalance,0);
  const interestOutstanding = rows.reduce((a,r)=>a+r.interestAccrued,0);
  const penaltiesOwed = rows.reduce((a,r)=>a+r.penaltiesOwed,0);
  const totalAlloc = rows.reduce((a,r)=>a+r.totalAlloc,0);
  const payoutLiability = rows.reduce((a,r)=>{
    const net = r.totalContributions + r.b2sTotal - r.totalOwing - r.penaltiesOwed;
    return a + (net>0 ? net*payoutFrac() : 0);
  },0);

  const monthTotals = MONTHS.map(m => state.members.reduce((s2,mem)=>s2+monthTotalForMember(mem.full,m),0));
  const maxMonth = Math.max(...monthTotals, 1);

  // Where the money comes from (donut)
  const sources = [
    {label:'Contributions', value:totalContr, color:'#1fa971'},
    feat('loans') && {label:'Interest paid', value:totalIntPaid, color:'#f59e0b'},
    feat('loans') && {label:'Loan repayments', value:totalLoanRepaid, color:'#14b8a6'},
    feat('penalties') && {label:'Penalties paid', value:totalPenPaid, color:'#ef4444'},
    feat('b2s') && {label:'Back 2 School', value:totalB2s, color:'#3b82f6'},
    feat('funeral') && {label:'Funeral fund', value:totalFuneral, color:'#8b5cf6'},
    feat('poolCharge') && feat('loans') && {label:'Year-end pool charges', value:totalPoolCharges, color:'#ec4899'},
  ].filter(x => x && x.value > 0.005);
  const sourceTotal = sources.reduce((a,x)=>a+x.value,0);
  const R = 70, C = 2*Math.PI*R;
  let acc = 0;
  const donut = sourceTotal > 0 ? `<svg viewBox="0 0 200 200" width="230" height="230" role="img" aria-label="Where the money comes from">
    <g transform="rotate(-90 100 100)">
      ${sources.map(x => { const len = x.value/sourceTotal*C; const el = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${x.color}" stroke-width="38" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"><title>${x.label}: ${fmtR(x.value)} (${(x.value/sourceTotal*100).toFixed(1)}%)</title></circle>`; acc += len; return el; }).join('')}
    </g>
    <text x="100" y="96" text-anchor="middle" font-size="11" fill="var(--muted)">Total in</text>
    <text x="100" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${fmtR(sourceTotal)}</text>
  </svg>` : '';

  // Collections by month: colour by how high each month is compared with the best month
  const monthTier = (t) => t <= 0 ? {c:'#cfd8d3', n:'None'} : t >= maxMonth*0.75 ? {c:'#16a34a', n:'High'} : t >= maxMonth*0.4 ? {c:'#f59e0b', n:'Medium'} : {c:'#ef4444', n:'Low'};

  return `
  <div class="card">
    <h2><span class="dot"></span>${escapeHtml(s.clubName||'Your Club')} — Club Year ${escapeHtml(String(s.yearLabel||''))}</h2>
    <p class="sub">Current period: <b>${currentMonth}</b> · Month ${s.monthsElapsed||'—'} of the club year</p>
    <div class="grid g4">
      <div class="kpi"><div class="v">${activeMembers().length}</div><div class="l">Active members</div></div>
      <div class="kpi"><div class="v">${b2sMembers().length}</div><div class="l">B2S-only members</div></div>
      <div class="kpi"><div class="v">${mrep.totals.paidCount} / ${rows.length}</div><div class="l">Paid in ${currentMonth}</div></div>
      <div class="kpi"><div class="v">${rows.filter(r=>r.penaltiesOwed>0).length}</div><div class="l">Members with penalties owed</div></div>
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <h2><span class="dot"></span>Money in / out this year</h2>
      <div class="tablewrap"><table><tbody>
        <tr><td>Contributions</td><td class="num">${fmtR(totalContr)}</td></tr>
        <tr><td>Interest paid</td><td class="num">${fmtR(totalIntPaid)}</td></tr>
        <tr><td>Penalties paid</td><td class="num">${fmtR(totalPenPaid)}</td></tr>
        <tr><td>Back 2 School fund</td><td class="num">${fmtR(totalB2s)}</td></tr>
        <tr><td>Funeral fund</td><td class="num">${fmtR(totalFuneral)}</td></tr>
        <tr><td>Loan repayments</td><td class="num">${fmtR(totalLoanRepaid)}</td></tr>
        <tr><td>Year-end pool charges</td><td class="num">${fmtR(totalPoolCharges)}</td></tr>
        <tr><td>Loans issued (out)</td><td class="num">-${fmtR(totalLoansIssued)}</td></tr>
        <tr class="tot-row"><td>Expected cash in bank</td><td class="num">${fmtR(expectedCash)}</td></tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <h2><span class="dot"></span>Loans &amp; payouts</h2>
      <div class="tablewrap"><table><tbody>
        <tr><td>Principal outstanding</td><td class="num">${fmtR(principalOutstanding)}</td></tr>
        <tr><td>Interest outstanding</td><td class="num">${fmtR(interestOutstanding)}</td></tr>
        <tr class="tot-row"><td>Total loan book</td><td class="num">${fmtR(principalOutstanding+interestOutstanding)}</td></tr>
        <tr><td>Penalties still owed</td><td class="num">${fmtR(penaltiesOwed)}</td></tr>
        <tr><td>5% pool per active member</td><td class="num">${fmtR(poolPerActiveMember())}</td></tr>
        <tr><td>Total member allocations</td><td class="num">${fmtR(totalAlloc)}</td></tr>
        <tr class="tot-row"><td>Payout liability if the year ended today</td><td class="num">${fmtR(payoutLiability)}</td></tr>
      </tbody></table></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>Where the money comes from</h2>
    ${sourceTotal<=0 ? `<div class="empty">Nothing has been collected yet.</div>` : `
    <div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center">
      ${donut}
      <div style="flex:1;min-width:240px">
        ${sources.map(x => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
          <span style="width:14px;height:14px;border-radius:4px;background:${x.color};flex:none"></span>
          <span style="flex:1">${x.label}</span>
          <span style="font-weight:700">${fmtR(x.value)}</span>
          <span style="width:52px;text-align:right;color:var(--muted)">${(x.value/sourceTotal*100).toFixed(1)}%</span>
        </div>`).join('')}
      </div>
    </div>`}
  </div>

  <div class="card">
    <h2><span class="dot"></span>Collections by month</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px">
      <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#16a34a;vertical-align:-1px"></span> High (75%+ of the best month)</span>
      <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#f59e0b;vertical-align:-1px"></span> Medium (40–75%)</span>
      <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#ef4444;vertical-align:-1px"></span> Low (under 40%)</span>
      <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#cfd8d3;vertical-align:-1px"></span> Nothing yet</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:190px;padding:10px 4px 0">
      ${MONTHS.map((m,i) => { const t = monthTotals[i], tier = monthTier(t); return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%" title="${m}: ${fmtR(t)} — ${tier.n}">
        <span style="font-size:10px;font-weight:700;color:${tier.c}">${t?fmtR(t).replace('R ',''):''}</span>
        <div style="width:100%;background:linear-gradient(180deg, ${tier.c}, ${tier.c}cc);border-radius:7px 7px 0 0;height:${Math.max((t/maxMonth)*130,4)}px"></div>
        <span style="font-size:10.5px;color:var(--muted)">${m}</span>
      </div>`; }).join('')}
    </div>
    <div class="tablewrap" style="margin-top:14px"><table>
      <thead><tr>${MONTHS.map(m=>`<th class="num">${m}</th>`).join('')}</tr></thead>
      <tbody><tr>${monthTotals.map(t=>`<td class="num" style="color:${monthTier(t).c};font-weight:700">${t?fmtR(t):'—'}</td>`).join('')}</tr></tbody>
    </table></div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>How this app works</h2>
    <div class="grid g2" style="font-size:13.5px;color:var(--muted)">
      <p>1. Log payments on <b>Data Entry</b> — stage a few, review the auto-calculated penalties, then submit them together.</p>
      <p>2. <b>Main Sheet</b>, <b>Yearly Contributions</b>, <b>Loans</b> and this Summary are all computed live from DataLog — nothing to refresh.</p>
      <p>3. Run <b>Attendance</b> after each meeting to apply attendance penalties automatically.</p>
      <p>4. At year-end, run the <b>Year-End Tools</b> steps, then <b>New Year Reset</b> to archive the year and start a fresh one (nothing is carried forward).</p>
    </div>
  </div>`;
}

let authError = '';
let authBusy = false;

function renderAuthGate(){
  const app = document.getElementById('app');
  if(!Auth.isSignedIn()){
    app.innerHTML = loginScreenHtml();
    wireLoginScreen();
    return;
  }
  if(Auth.mfaPending){ app.innerHTML = mfaScreenHtml(); wireMfaScreen(); return; }

  if(Auth.clubStatus() !== 'active'){ app.innerHTML = clubStatusHtml(); wirePendingScreen(); return; }

}

function mfaScreenHtml(){
  return authShellWrap(`
    <div class="card">
      <h2><span class="dot"></span>Two-step login</h2>
      <p class="sub">Open your authenticator app and type the 6-digit code it shows for this account.</p>
      <div><label>6-digit code</label><input type="text" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
      ${authError ? `<p style="color:var(--red);font-size:13px;margin-top:10px">${escapeHtml(authError)}</p>` : ''}

        <button class="btn secondary" id="authSignOutBtn">Sign out</button>
      </div>
    </div>`);

function wireMfaScreen(){
  wirePendingScreen();
  const go = async () => {
    const code = document.getElementById('mfaCode').value.replace(/\s/g,'');
    if(!/^\d{6}$/.test(code)){ authError = 'Type the 6-digit code.'; renderAuthGate(); return; }
    authBusy = true; authError = ''; renderAuthGate();
    try{
      const c = Auth.ensureClient();
      const { data: fl, error: fe } = await c.auth.mfa.listFactors(); if(fe) throw fe;
      const f = (fl.totp || [])[0]; if(!f) throw new Error('No authenticator is set up for this account.');
      const { error } = await c.auth.mfa.challengeAndVerify({ factorId: f.id, code }); if(error) throw error;
      Auth.mfaPending = false;
      await Auth.loadProfile(); await Store.trySyncFromCloud();
    }catch(e){ authError = (e.message || 'That code was not accepted.'); }
    authBusy = false; render();
  };
  document.getElementById('mfaGo').onclick = go;
  const inp = document.getElementById('mfaCode'); inp.onkeydown = (e) => { if(e.key==='Enter') go(); }; inp.focus();
}

function wireRegisterClub(){

function wireLoginScreen(){
  const btn = document.getElementById('authSignInBtn');
  const doSignIn = async () => {
    const up = authMode === 'signup';
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password){ authError = 'Enter your email and password.'; authInfo = ''; renderAuthGate(); return; }
    if(up){
      const p2 = document.getElementById('authPassword2').value;
      if(password.length < MIN_PASSWORD_LENGTH){ authError = `Use at least ${MIN_PASSWORD_LENGTH} characters.`; authInfo=''; renderAuthGate(); return; }
      if(password !== p2){ authError = 'The two passwords do not match.'; authInfo=''; renderAuthGate(); return; }
      if(!document.getElementById('authAgree').checked){ authError = 'Please accept the privacy policy and terms to create an account.'; authInfo=''; renderAuthGate(); return; }
    }
    authBusy = true; authError = ''; authInfo = ''; renderAuthGate();
    try{
      if(up){
        const signedIn = await Auth.signUp(email, password);
        authBusy = false;
        if(signedIn){ await Store.trySyncFromCloud(); render(); return; }
        authMode = 'signin'; authInfo = 'Account created. Check your email to confirm it, then sign in.'; renderAuthGate(); return;
      }
      await Auth.signIn(email, password);
      await Store.trySyncFromCloud();
      authBusy = false;
      render();
    }catch(e){
      authBusy = false;
      authError = e.message && e.message.includes('Invalid login') ? 'Incorrect email or password.' : (e.message || 'Could not complete that.');
      renderAuthGate();
    }
  };
  btn.onclick = doSignIn;
  document.getElementById('authModeBtn').onclick = () => { authMode = authMode==='signup' ? 'signin' : 'signup'; authError = ''; authInfo = ''; renderAuthGate(); };
  ['authEmail','authPassword'].forEach(id => {
    document.getElementById(id).onkeydown = (e) => { if(e.key==='Enter') doSignIn(); };
  });
}

/* ---------------------------------------------------------------------
   CHANGE MY PASSWORD — available to every signed-in role, self-service only.
   Uses the user's own session (auth.updateUser), never touches other accounts.
   --------------------------------------------------------------------- */
async function renderMfaBox(box){
  const c = Auth.client; if(!c || !box) return;
  box.innerHTML = '<p class="hint">Checking…</p>';
  let all = [];
  try{ const { data, error } = await c.auth.mfa.listFactors(); if(error) throw error; all = (data && data.all) || []; }
  catch(e){ box.innerHTML = `<p class="hint">Two-step login is not available right now. ${escapeHtml(e.message||'')}</p>`; return; }
  const on = all.find(f => f.factor_type === 'totp' && f.status === 'verified');
  if(on){
    box.innerHTML = `<p class="sub" style="margin:4px 0 8px"><span class="pill green">On</span> You will be asked for a code from your authenticator app each time you sign in.</p>
      <button class="btn danger sm" id="mfaOffBtn">Turn off two-step login</button><span class="hint" id="mfaMsg" style="margin-left:10px"></span>`;
    box.querySelector('#mfaOffBtn').onclick = async () => {
      if(!await confirmModal('Turn off two-step login', 'Your account will be protected by your password only. Continue?', 'Turn off', true)) return;
      const { error } = await c.auth.mfa.unenroll({ factorId: on.id });
      if(error){ box.querySelector('#mfaMsg').textContent = error.message; return; }
      toast('Two-step login is off.'); renderMfaBox(box);
    };
    return;
  }
  box.innerHTML = `<p class="sub" style="margin:4px 0 8px">Add a second step with an authenticator app (Google Authenticator, Microsoft Authenticator, Authy). Recommended for administrators.</p>
    <button class="btn secondary sm" id="mfaOnBtn">Set up two-step login</button><span class="hint" id="mfaMsg" style="margin-left:10px"></span>`;
  box.querySelector('#mfaOnBtn').onclick = async () => {
    const msg = box.querySelector('#mfaMsg');
    try{
      for(const f of all){ if(f.status !== 'verified'){ await c.auth.mfa.unenroll({ factorId: f.id }); } }   // clear abandoned set-ups
      const { data, error } = await c.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Authenticator' });
      if(error) throw error;
      box.innerHTML = `<p class="sub" style="margin:4px 0 8px">1. Scan this picture with your authenticator app (or type the key). 2. Type the 6-digit code it shows.</p>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><img id="mfaQr" alt="QR code" width="150" height="150" style="background:#fff;border-radius:8px;padding:6px">
        <div><div class="hint">Key</div><code id="mfaSecret" style="word-break:break-all;font-size:12.5px"></code></div></div>
        <div class="grid g2" style="margin-top:10px;align-items:end"><div><label>6-digit code</label><input type="text" id="mfaSetupCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
        <div><button class="btn sm" id="mfaVerifyBtn">Turn on</button></div></div><p class="hint" id="mfaMsg2" style="color:var(--red)"></p>`;
      box.querySelector('#mfaQr').setAttribute('src', data.totp.qr_code);
      box.querySelector('#mfaSecret').textContent = data.totp.secret;
      box.querySelector('#mfaVerifyBtn').onclick = async () => {
        const code = box.querySelector('#mfaSetupCode').value.replace(/\s/g,'');
        const { error: ve } = await c.auth.mfa.challengeAndVerify({ factorId: data.id, code });
        if(ve){ box.querySelector('#mfaMsg2').textContent = ve.message || 'That code was not accepted.'; return; }
        toast('Two-step login is on.'); renderMfaBox(box);
      };
    }catch(e){ msg.textContent = e.message || 'Could not start set-up.'; }
  };
}

/* ---------------------------------------------------------------------
   ADMIN: RESET A USER'S PASSWORD — calls a Supabase Edge Function, since
   setting someone else's password needs the service-role key, which must
   never live in this public file. See edge-function-admin-reset-password.ts.
   --------------------------------------------------------------------- */
// Keep this in step with Supabase: Authentication > Sign In / Providers > Email > Minimum password length.
const MIN_PASSWORD_LENGTH = 10;

function generateTempPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  let out = '';
  const rnd = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(12)) : null;
  for(let i=0;i<12;i++) out += chars[(rnd ? rnd[i] : Math.floor(Math.random()*4294967296)) % chars.length];
  return out;
}

function openResetPasswordModal(userId, email){
  const suggested = generateTempPassword();
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">
    <h3>Reset password for ${escapeHtml(email)}</h3>
    <p class="sub">This sets their password immediately — share it with them directly (WhatsApp, in person, etc). They can change it themselves once logged in.</p>
    <div style="margin-top:10px"><label>New password</label><input type="text" id="rpNew" value="${escapeHtml(suggested)}"></div>
    <p id="rpError" style="color:var(--red);font-size:13px;margin-top:8px;display:none"></p>
    <div class="btnrow">
      <button class="btn secondary" id="rpCancel">Cancel</button>
      <button class="btn" id="rpSave">Set password</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#rpCancel').onclick = () => back.remove();
  back.onclick = (e) => { if(e.target===back) back.remove(); };
  back.querySelector('#rpSave').onclick = async () => {
    const pw = back.querySelector('#rpNew').value;
    const errEl = back.querySelector('#rpError');
    const showErr = (msg) => { errEl.textContent = msg; errEl.style.display = 'block'; };
    if(pw.length < MIN_PASSWORD_LENGTH){ showErr('Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.'); return; }
    try{
      const res = await fetch(Store.cloud.url + '/functions/v1/admin-reset-password', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + Auth.accessToken(), 'apikey': Store.cloud.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetUserId: userId, newPassword: pw })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
      back.remove();
      toast(`Password reset for ${email}. New password: ${pw}`);
    }catch(e){
      showErr(e.message || 'Could not reset password. Has the admin-reset-password Edge Function been deployed?');
    }
  };
}
